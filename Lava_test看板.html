    ], Object.keys(by).sort((a, b) => by[b] - by[a]).slice(0, 10)
      .map(k => ({ type: k, count: by[k] })));
  }

  function last7(list) {
    const out = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(Date.now() - i * 86400000);
      const key = Util.todayKey(d);
      out.push({ label: key.slice(5),
        value: list.filter(e => e.day === key).reduce((a, e) => a + (e.count || 1), 0) });
    }
    return out;
  }

  /* 用 canvas 画全线热力图 */
  function drawHeat() {
    const box = document.getElementById('boardHeat');
    if (!box) return;
    _heatDrawn = true;
    const cfg = App.cfg;
    const topo = Topology.all(cfg);
    /* 按工站顺序把全部设备拉平，每格一个盘位 */
    const all = [];
    Topology.effectiveStations(cfg).forEach(s => {
      (topo.stationsMap[s.key] || []).forEach(eq => all.push(eq));
    });
    const canvas = document.createElement('canvas');
    box.innerHTML = '';
    box.appendChild(canvas);
    SlotGrid.drawCanvas(canvas, null, all, App.slots, { cell: 4, gap: 1, cols: 160 });
  }

  function bind() {
    Dom.delegate('boardBody', 'click', '#boardGotoFloor', () => App.switchView('floor'));

    Dom.delegate('boardBody', 'click', '#boardHeatToggle', (e, el) => {
      if (_heatDrawn) {
        Dom.html('boardHeat', '');
        _heatDrawn = false;
        el.textContent = '绘制热力图';
      } else {
        const t = Date.now();
        drawHeat();
        el.textContent = '清除热力图';
        Toast.ok('已绘制 12,737 格，耗时 ' + (Date.now() - t) + 'ms');
      }
    });

    Dom.delegate('boardBody', 'click', '[data-goto-eq]', (e, el) => {
      const p = el.dataset.gotoEq.split('|');
      LocalStore.ui.set('stationFilter', p[0]);
      App.switchView('floor');
      setTimeout(() => {
        const node = document.querySelector('#floorBody [data-eq="' + p[1] + '"]');
        if (node) Dom.scrollTo(node, 3000);
      }, 120);
    });
  }

  return { render, bind };
})();

/* ============================================================================
   产量统计 —— 产能对比、占用、瓶颈分析、ORT 自洽性互验
   ============================================================================ */

const ViewStats = (() => {

  async function render() {
    await App.ensureRecords('records');
    const cfg = App.cfg;
    const ov = Capacity.overview(cfg);
    const topo = Topology.all(cfg);
    const bn = ov.bottleneck;

    /* 各工站实际占用 */
    const occupancy = ov.rows.map(r => {
      const eqs = topo.stationsMap[r.station] || [];
      const c = SlotGrid.countStates(eqs, App.slots);
      return { station: r.station, name: r.name, color: r.color, online: r.online,
               used: c.used, testing: c.testing, pass: c.pass, fail: c.fail,
               abort: c.abort, util: c.util, c };
    });
    const totalOnline = occupancy.reduce((a, x) => a + x.online, 0);
    const totalUsed = occupancy.reduce((a, x) => a + x.used, 0);

    /* 近 7 日产量趋势 */
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(Date.now() - i * 86400000);
      const key = Util.todayKey(d);
      const n = (App.records || []).filter(r => r.day === key &&
        String(r.result).toUpperCase() === 'PASS').length;
      days.push({ label: key.slice(5), value: n });
    }

    /* ORT 自洽性 */
    const con = Sampling.consistency(cfg);
    const ortPlan = Sampling.plan((App.workOrders || []).map(w => ({ id: w.id, no: w.no, qty: w.qty })));

    /* 当日良率 */
    const today = Util.todayKey();
    const todayRecs = (App.records || []).filter(r => r.day === today);
    const tp = todayRecs.filter(r => String(r.result).toUpperCase() === 'PASS').length;
    const tf = todayRecs.filter(r => String(r.result).toUpperCase() === 'FAIL').length;
    const ta = todayRecs.filter(r => String(r.result).toUpperCase() === 'ABORT').length;
    const y = Capacity.yieldOf({ pass: tp, fail: tf, abort: ta });

    Dom.html('statsBody',
      '<div class="cards">' +
        '<div class="card"><div class="lbl">全线同时在线容量</div>' +
          '<div class="val">' + Util.num(totalOnline) + '</div>' +
          '<div class="sub">7 道工序合计盘位</div></div>' +
        '<div class="card"><div class="lbl">当前在制</div>' +
          '<div class="val">' + Util.num(totalUsed) + '</div>' +
          '<div class="sub">整体利用率 ' + (totalOnline ? (totalUsed / totalOnline * 100).toFixed(1) : 0) + '%</div></div>' +
        '<div class="card accent"><div class="lbl">整线日产能（瓶颈）</div>' +
          '<div class="val">' + Util.num(Math.round(ov.lineRate)) + '</div>' +
          '<div class="sub">受 ' + (bn ? bn.name + ' · ' + bn.cn : '--') + ' 限制</div></div>' +
        '<div class="card"><div class="lbl">今日良率</div>' +
          '<div class="val" style="color:' + (y.pct == null ? 'var(--tx-3)' :
            y.pct >= 0.95 ? 'var(--ok)' : 'var(--warn)') + '">' +
            (y.pct == null ? '--' : (y.pct * 100).toFixed(2) + '%') + '</div>' +
          '<div class="sub">' + y.formula + '</div></div>' +
      '</div>' +

      Charts.barH(ov.rows.map(r => ({
        label: r.name, value: Math.round(r.daily), color: r.color,
        tag: r.isBottleneck ? ' <span class="badge b-fault">瓶颈</span>' :
             (r.bypass ? ' <span class="pill p-wait">旁路</span>' : '')
      })), {
        title: '各工序理论日产能 = 设备数 × 单台容量 × (1440 ÷ 单轮时长)',
        fmt: v => Util.num(v) + ' 块/天',
        note: '瓶颈决定整线节拍：<b>' + (bn ? bn.name + ' ' + Util.num(Math.round(bn.daily)) +
          ' 块/天' : '--') + '</b>。实际产能还需扣除换料、停机与复测。'
      }) +

      '<div style="height:14px"></div>' +

      Charts.barH(occupancy.map(x => ({
        label: x.name, value: Math.round(x.util * 100), color: x.color
      })), {
        title: '盘位占用率',
        fmt: (v, x) => v + '%',
        note: occupancy.map(x => x.name + ' ' + Util.num(x.used) + '/' + Util.num(x.online)).join(' · ')
      }) +

      '<div style="height:14px"></div>' +

      '<div class="section-title">瓶颈分析与优化建议</div>' +
      (Capacity.advice(cfg).map(a =>
        '<div class="suggest-card ' + (a.level === 'warn' ? 'warn' : a.level === 'bad' ? 'bad' : '') + '">' +
        a.text.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>') + '</div>').join('') ||
        '<div class="empty-tip">暂无建议</div>') +

      '<div class="section-title">近 7 日通过量</div>' +
      Charts.barV(days, { title: '', note: '按测试记录的 PASS 条数统计' }) +

      '<div class="section-title">ORT 抽样容量互验' +
        '<span class="note-inline">数据自洽性检查</span></div>' +
      Charts.barH([
        { label: '主线需求（2.5%）', value: Math.round(con.demand), color: 'var(--st-ort)' },
        { label: 'ORT 能力', value: Math.round(con.capacity), color: 'var(--st-ort)' }
      ], {
        fmt: v => Util.num(v) + ' 块/天',
        note: '主线 ' + Util.num(Math.round(con.lineRate)) + ' 块/天 × 2.5% = ' +
          Util.num(Math.round(con.demand)) + ' 块/天；ORT ' + ST.ORT.count + ' 台 × ' +
          ST.ORT.capacity + ' 盘位 ÷ ' + (ST.ORT.cycleMin / 1440) + ' 天 = ' +
          Util.num(Math.round(con.capacity)) + ' 块/天。' +
          '<b style="color:' + (con.ok ? 'var(--ok)' : 'var(--warn)') + '">匹配度 ' +
          (con.match * 100).toFixed(1) + '%</b> —— ' +
          (con.ok ? '说明 ORT 的设备配置就是按 2.5% 抽检精确配的，也反证了 ORT 必须是旁路工序。'
                  : '与 2.5% 抽检需求偏差较大，建议核实 ORT 设备数或抽样比例。')
      }) +

      '<div class="section-title">工单 ORT 排轮测算</div>' +
      (ortPlan.list.length
        ? DataTable.build([
            { key: 'no', label: '工单号' },
            { key: 'qty', label: '批量', cls: 'num', fmt: v => Util.num(v) },
            { key: 'sample', label: '抽样量(2.5%)', cls: 'num' },
            { key: 'rounds', label: 'ORT 台次', cls: 'num' },
            { key: 'lastRoundLoad', label: '末轮装载', cls: 'num' },
            { key: 'desc', label: '说明' }
          ], ortPlan.list, { emptyText: '暂无工单' }) +
          '<div class="note">共需抽 <b>' + Util.num(ortPlan.totalSample) + '</b> 块 / <b>' +
          ortPlan.totalRounds + '</b> 台次；ORT 总容量 ' + Util.num(ortPlan.capacity) +
          ' 盘位，单轮 ' + ortPlan.cycleDays + ' 天。<br>' +
          '⚠️ 本表只做<b>测算与展示，不自动派工</b> —— 排轮逻辑与失效后的停线判据尚未经现场确认（规范 §10）。</div>'
        : '<div class="empty-tip">暂无工单</div>')
    );
  }

  function bind() { }

  return { render, bind };
})();


/* ==========================================================================
   src/views/daily.js
   ========================================================================== */
/* ============================================================================
   当日报表 —— 按工站汇总当日生产情况，可展开看明细
   ============================================================================ */

const ViewDaily = (() => {

  function dayKey() {
    return LocalStore.ui.get('dailyDate', '') || Util.todayKey();
  }

  async function render() {
    await App.ensureRecords('records');
    const day = dayKey();
    const topo = Topology.all(App.cfg);
    const slots = App.slots;

    /* 当日记录（按日期字段过滤） */
    const recs = (App.records || []).filter(r => r.day === day);

    /* 逐工站汇总 */
    const rows = Topology.summary(App.cfg).map(s => {
      const eqs = topo.stationsMap[s.station] || [];
      const c = SlotGrid.countStates(eqs, slots);
      const dayRecs = recs.filter(r => r.station === s.station);
      const pass = dayRecs.filter(r => String(r.result).toUpperCase() === 'PASS').length;
      const fail = dayRecs.filter(r => String(r.result).toUpperCase() === 'FAIL').length;
      const abort = dayRecs.filter(r => String(r.result).toUpperCase() === 'ABORT').length;
      const y = Capacity.yieldOf({ pass, fail, abort });
      const bads = (App.bad || []).filter(b => b.day === day && b.station === s.station).length;
      const errs = (App.error || []).filter(e => e.day === day && e.station === s.station).length;
      return { s, c, dayRecs, pass, fail, abort, y, bads, errs };
    });

    const sumPass = rows.reduce((a, r) => a + r.pass, 0);
    const sumFail = rows.reduce((a, r) => a + r.fail, 0);
    const sumAbort = rows.reduce((a, r) => a + r.abort, 0);
    const sumYield = Capacity.yieldOf({ pass: sumPass, fail: sumFail, abort: sumAbort });
    const totalUsed = rows.reduce((a, r) => a + r.c.used, 0);

    const cols = [
      { key: 'st', label: '工序', html: (v, r) =>
          '<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:' +
          r.s.color + ';margin-right:7px"></span>' + r.s.name +
          (r.s.bypass ? ' <span class="pill p-wait">旁路</span>' : '') },
      { key: 'eq', label: '设备', fmt: (v, r) => r.s.eqCount + ' ' + r.s.unit +
          (r.s.cabCount ? ' / ' + r.s.cabCount + ' 柜' : '') },
      { key: 'cap', label: '单台容量', cls: 'num', fmt: (v, r) => r.s.capacityPerUnit },
      { key: 'online', label: '同时在线', cls: 'num', fmt: (v, r) => Util.num(r.s.online) },
      { key: 'cycle', label: '单轮', cls: 'num', fmt: (v, r) => Util.fmtCycle(r.s.cycleMin) },
      { key: 'used', label: '在制', cls: 'num', fmt: (v, r) => Util.num(r.c.used) },
      { key: 'testing', label: '在测', cls: 'num', fmt: (v, r) => Util.num(r.c.testing) },
      { key: 'pass', label: '通过', cls: 'num', html: (v, r) =>
          '<span style="color:#6ee787">' + Util.num(r.pass) + '</span>' },
      { key: 'fail', label: '失败', cls: 'num', html: (v, r) =>
          '<span style="color:#ff8b82">' + Util.num(r.fail) + '</span>' },
      { key: 'abort', label: '异常终止', cls: 'num', html: (v, r) =>
          '<span style="color:#b9aef5">' + Util.num(r.abort) + '</span>' },
      { key: 'yield', label: '良率', cls: 'num', fmt: (v, r) =>
          r.y.pct == null ? '--' : (r.y.pct * 100).toFixed(1) + '%' },
      { key: 'bad', label: '不良', cls: 'num' },
      { key: 'err', label: '报错', cls: 'num' },
      { key: 'util', label: '利用率', cls: 'num', html: (v, r) => DataTable.miniBar(r.c.util) }
    ];

    const bottom = {
      st: '合计', eq: '', cap: '', online: '', cycle: '',
      used: totalUsed, testing: rows.reduce((a, r) => a + r.c.testing, 0),
      pass: sumPass, fail: sumFail, abort: sumAbort,
      yield: sumYield.pct, bad: rows.reduce((a, r) => a + r.bads, 0),
      err: rows.reduce((a, r) => a + r.errs, 0), util: ''
    };

    const tableHtml = DataTable.build(cols, rows, {
      rowClass: (r) => r.s.isBottleneck ? 'total-row' : ''
    }).replace('</tbody>',
      '<tr class="total-row">' +
      '<td>合计</td><td></td><td class="num"></td><td class="num"></td><td class="num"></td>' +
      '<td class="num">' + Util.num(bottom.used) + '</td>' +
      '<td class="num">' + Util.num(bottom.testing) + '</td>' +
      '<td class="num"><span style="color:#6ee787">' + Util.num(sumPass) + '</span></td>' +
      '<td class="num"><span style="color:#ff8b82">' + Util.num(sumFail) + '</span></td>' +
      '<td class="num"><span style="color:#b9aef5">' + Util.num(sumAbort) + '</span></td>' +
      '<td class="num">' + (sumYield.pct == null ? '--' : (sumYield.pct * 100).toFixed(2) + '%') + '</td>' +
      '<td class="num">' + Util.num(bottom.bad) + '</td>' +
      '<td class="num">' + Util.num(bottom.err) + '</td>' +
      '<td></td></tr></tbody>');

    Dom.html('dailyBody',
      '<div class="toolbar">' +
        '<span class="title">' + day + ' 当日报表</span>' +
        '<input type="date" class="form-input" id="dailyDate" style="width:160px" value="' + day + '">' +
        '<button class="btn" id="dailyToday">今天</button>' +
        '<span class="spacer" style="flex:1"></span>' +
        '<button class="btn" id="dailyExport">导出 CSV</button>' +
      '</div>' +

      '<div class="cards">' +
        '<div class="card"><div class="lbl">当前在制</div><div class="val">' +
          Util.num(totalUsed) + '</div><div class="sub">全工序盘位占用</div></div>' +
        '<div class="card"><div class="lbl">当日判定</div><div class="val">' +
          Util.num(sumPass + sumFail) + '</div>' +
          '<div class="sub">PASS ' + Util.num(sumPass) + ' · FAIL ' + Util.num(sumFail) + '</div></div>' +
        '<div class="card accent"><div class="lbl">当日良率</div>' +
          '<div class="val" style="color:' +
            (sumYield.pct == null ? 'var(--tx-3)' : sumYield.pct >= 0.95 ? 'var(--ok)' : 'var(--warn)') + '">' +
            (sumYield.pct == null ? '--' : (sumYield.pct * 100).toFixed(2) + '%') + '</div>' +
          '<div class="sub">' + sumYield.formula + '</div></div>' +
        '<div class="card"><div class="lbl">异常终止</div>' +
          '<div class="val" style="color:var(--abort)">' + Util.num(sumAbort) + '</div>' +
          '<div class="sub">数据不完整，不计入良率分母</div></div>' +
      '</div>' +

      '<div class="note">' +
        '<b>良率口径</b>：' + sumYield.formula + '。<br>' +
        '⚠️ 「异常终止」是断电 / 超时 / 中途取料导致的<b>数据不完整</b>，不是产品不合格，' +
        '因此单列且不进入分母。这条口径本身尚未经现场确认（规范 §10），如与实际不符请告知。' +
      '</div>' +

      tableHtml +

      '<div class="section-title">各工站当日判定明细</div>' +
      (recs.length
        ? DataTable.build([
            { key: 'time', label: '时间', fmt: v => Util.fmtFull(v) },
            { key: 'station', label: '工站' },
            { key: 'cabinetId', label: '机柜' },
            { key: 'serverId', label: '设备' },
            { key: 'sn', label: 'SN', cls: 'col-sn' },
            { key: 'pn', label: 'PN' },
            { key: 'result', label: '结果', html: v =>
              '<span class="pill ' + L.resultPill(v) + '">' + Util.esc(L.result(v)) + '</span>' },
            { key: 'errCode', label: '错误码', fmt: v => v || '--' }
          ], recs.slice().sort((a, b) => (b.time || 0) - (a.time || 0)).slice(0, 300),
          { emptyText: '当日无判定记录' })
        : '<div class="empty-tip">当日暂无测试记录。点击顶栏「生成模拟数据」可查看界面效果。</div>')
    );
  }

  function exportCsv() {
    const day = dayKey();
    const recs = (App.records || []).filter(r => r.day === day);
    const rows = recs.map(r => [
      r.day, r.time ? Util.fmtFull(r.time) : '', r.station, r.cabinetId, r.serverId,
      r.slotIndex == null ? '' : (r.slotIndex + 1), r.sn, r.pn, r.model, r.woNo,
      r.result, r.errCode, r.source
    ]);
    if (!rows.length) { Toast.warn('当日无记录可导出'); return; }
    Util.download('当日报表_' + day + '.csv', Util.toCsv(
      ['日期', '时间', '工站', '机柜', '设备', '位号', 'SN', 'PN', '型号', '工单',
       '结果', '错误码', '来源'], rows));
    Toast.ok('已导出 ' + rows.length + ' 条');
  }

  function bind() {
    Dom.delegate('dailyBody', 'change', '#dailyDate', (e, el) => {
      LocalStore.ui.set('dailyDate', el.value);
      render();
    });
    Dom.delegate('dailyBody', 'click', '#dailyToday', () => {
      LocalStore.ui.set('dailyDate', Util.todayKey());
      render();
    });
    Dom.delegate('dailyBody', 'click', '#dailyExport', exportCsv);
  }

  return { render, bind };
})();


/* ==========================================================================
   src/views/bad.js
   ========================================================================== */
/* ============================================================================
   不良记录 —— 以产品（内存/SSD）为主体的异常
   ----------------------------------------------------------------------------
   三个页签：全部 / 待确认 / 已确认
   待确认队列是判定引擎的出口：规则未命中的内容落到这里等人工处置。
   ============================================================================ */

const ViewBad = (() => {

  let _page = 1;

  async function render() {
    await App.ensureRecords('bad');
    const all = App.bad || [];
    const filter = LocalStore.ui.get('badFilter', 'all');
    const list = filter === 'pending' ? all.filter(b => !b.confirmed)
               : filter === 'confirmed' ? all.filter(b => b.confirmed)
               : all;

    /* 按类型汇总 */
    const byType = {};
    all.forEach(b => { byType[b.type || '未分类'] = (byType[b.type || '未分类'] || 0) + 1; });
    const typeItems = Object.keys(byType).sort((a, b) => byType[b] - byType[a])
      .map(k => ({ label: k, value: byType[k], color: 'var(--bad)' }));

    /* 按工站汇总 */
    const byStation = {};
    all.forEach(b => { byStation[b.station || '未知'] = (byStation[b.station || '未知'] || 0) + 1; });

    const pendingCount = all.filter(b => !b.confirmed).length;

    const cols = [
      { key: 'sel', label: '<input type="checkbox" id="badSelectAll">', width: '34px',
        html: (v, row) => row.confirmed ? ''
          : '<input type="checkbox" data-bad-select="' + row.id + '">' },
      { key: 'time', label: '时间', fmt: v => Util.fmtFull(v) },
      { key: 'station', label: '工站' },
      { key: 'cabinetId', label: '机柜', fmt: v => v || '--' },
      { key: 'serverId', label: '设备', fmt: v => v || '--' },
      { key: 'slotIndex', label: '位号', fmt: v => v == null ? '--' : ('位' + (v + 1)) },
      { key: 'sn', label: 'SN', cls: 'col-sn' },
      { key: 'pn', label: 'PN' },
      { key: 'type', label: '不良类型' },
      { key: 'errCode', label: '错误码', html: v => v
          ? '<span style="color:#ff8b82">' + Util.esc(v) + '</span>' : '--' },
      { key: 'verdict', label: '判定', html: v =>
          '<span class="pill ' + (v === 'functional' ? 'p-fail' : v === 'nonfunctional' ? 'p-wait' : 'p-warn') +
          '">' + Util.esc(L.verdict(v)) + '</span>' },
      { key: 'confirmed', label: '状态', html: (v, row) => v
          ? '<span class="pill p-pass">已确认</span>'
          : '<span class="pill p-wait">待确认</span>' },
      { key: 'act', label: '操作', html: (v, row) =>
          '<button class="btn xs" data-bad-trace="' + Util.esc(row.sn) + '">追溯</button>' +
          (row.confirmed ? '' :
            '<button class="btn xs" data-bad-confirm="' + row.id + '" style="margin-left:4px">确认</button>') }
    ];

    const sorted = list.slice().sort((a, b) => (b.time || 0) - (a.time || 0));
    const pg = DataTable.paginated(cols, sorted, _page);

    Dom.html('badBody',
      '<div class="toolbar">' +
        '<button class="btn ' + (filter === 'all' ? 'on' : '') + '" data-bad-filter="all">' +
          '全部 ' + all.length + '</button>' +
        '<button class="btn ' + (filter === 'pending' ? 'on' : '') + '" data-bad-filter="pending">' +
          '待确认 ' + pendingCount + '</button>' +
        '<button class="btn ' + (filter === 'confirmed' ? 'on' : '') + '" data-bad-filter="confirmed">' +
          '已确认 ' + (all.length - pendingCount) + '</button>' +
        '<span class="spacer" style="flex:1"></span>' +
        '<button class="btn" id="btnDefectRules">不良判定设置</button>' +
        '<button class="btn primary" id="btnBadBatchConfirm"' +
          (pendingCount ? '' : ' disabled') + '>批量确认</button>' +
        '<button class="btn" id="btnBadExport">导出 CSV</button>' +
        '<button class="btn" id="btnBadNew">记录不良</button>' +
      '</div>' +

      '<div class="cards">' +
        '<div class="card"><div class="lbl">不良总数</div>' +
          '<div class="val" style="color:var(--bad)">' + Util.num(all.length) + '</div></div>' +
        '<div class="card"><div class="lbl">待确认</div>' +
          '<div class="val" style="color:var(--warn)">' + Util.num(pendingCount) + '</div>' +
          '<div class="sub">规则未命中，等待人工判定</div></div>' +
        '<div class="card"><div class="lbl">已确认</div>' +
          '<div class="val" style="color:var(--ok)">' + Util.num(all.length - pendingCount) + '</div></div>' +
      '</div>' +

      (pendingCount
        ? '<div class="note warn">有 <b>' + pendingCount + '</b> 条不良未命中任何判定规则，' +
          '已进入待确认队列。可在「不良判定设置」里用样本文本试判定，' +
          '再补充关键词或错误码规则 —— 规则变更<b>只影响后续判定，不重算历史</b>。</div>'
        : '') +

      '<div class="section-title">按不良类型</div>' +
      (typeItems.length ? DataTable.summaryList(typeItems) : '<div class="empty-tip">暂无数据</div>') +

      '<div class="section-title">按工站</div>' +
      (Object.keys(byStation).length
        ? DataTable.summaryList(Object.keys(byStation).map(k => ({
            label: k, value: byStation[k], color: 'var(--warn)'
          })))
        : '<div class="empty-tip">暂无数据</div>') +

      '<div class="section-title">明细' + (filter !== 'all' ? '（' +
        (filter === 'pending' ? '待确认' : '已确认') + '）' : '') + '</div>' +
      pg.html
    );
    _page = pg.page;
  }

  /* 批量确认选中的待确认不良 */
  async function batchConfirm() {
    const ids = Dom.$$('[data-bad-select]:checked').map(x => x.dataset.badSelect);
    if (!ids.length) { Toast.warn('请先勾选待确认的记录'); return; }

    const by = await Modal.prompt({
      title: '批量确认不良',
      text: '请输入确认人姓名',
      value: LocalStore.get('lastOperator', '') || '',
      hint: '将确认 ' + ids.length + ' 条记录，确认动作会记入判定流水（含确认人与时间）。'
    });
    if (by == null) return;
    LocalStore.set('lastOperator', by);

    const n = await DefectEngine.confirm(ids, by, '批量确认', App.defectDeps());
    App.invalidate('bad');
    await App.ensureRecords('bad');
    render();
    Toast.ok('已确认 ' + n + ' 条');
  }

  async function confirmOne(id) {
    const by = await Modal.prompt({
      title: '确认不良', text: '请输入确认人姓名',
      value: LocalStore.get('lastOperator', '')
    });
    if (by == null) return;
    LocalStore.set('lastOperator', by);
    await DefectEngine.confirm([id], by, '', App.defectDeps());
    App.invalidate('bad');
    await App.ensureRecords('bad');
    render();
    Toast.ok('已确认');
  }

  function exportCsv() {
    const list = (App.bad || []).slice().sort((a, b) => (b.time || 0) - (a.time || 0));
    if (!list.length) { Toast.warn('暂无数据'); return; }
    const rows = list.map(b => [
      b.day, b.time ? Util.fmtFull(b.time) : '', b.station, b.cabinetId, b.serverId,
      b.slotIndex == null ? '' : (b.slotIndex + 1), b.sn, b.pn, b.model, b.woNo,
      b.type, b.errCode, L.verdict(b.verdict), b.confirmed ? '已确认' : '待确认',
      b.confirmedBy, b.confirmedAt ? Util.fmtFull(b.confirmedAt) : '', b.source, b.note
    ]);
    Util.download('不良记录_' + Util.tsTag() + '.csv', Util.toCsv(
      ['日期', '时间', '工站', '机柜', '设备', '位号', 'SN', 'PN', '型号', '工单',
       '不良类型', '错误码', '判定', '状态', '确认人', '确认时间', '来源', '备注'], rows));
    Toast.ok('已导出 ' + rows.length + ' 条');
  }

  /* 手工记录一条不良 */
  async function openNew() {
    const stations = Topology.effectiveStations(App.cfg);
    Modal.open({
      title: '记录不良', size: 'normal',
      body:
        '<div class="form-row">' +
          '<div class="form-group"><label class="form-label">工站</label>' +
            '<select class="form-select" id="nbStation">' +
              stations.map(s => '<option value="' + s.key + '">' + s.name + ' · ' + s.cn + '</option>').join('') +
            '</select></div>' +
          '<div class="form-group"><label class="form-label">不良类型</label>' +
            '<select class="form-select" id="nbType">' +
              DEFECT_TYPES.map(t => '<option>' + Util.esc(t) + '</option>').join('') +
            '</select></div>' +
        '</div>' +
        '<div class="form-row" style="margin-top:11px">' +
          '<div class="form-group"><label class="form-label">SN<span class="req">*</span></label>' +
            '<input class="form-input" id="nbSn" placeholder="产品序列号"></div>' +
          '<div class="form-group"><label class="form-label">PN</label>' +
            '<input class="form-input" id="nbPn"></div>' +
        '</div>' +
        '<div class="form-row" style="margin-top:11px">' +
          '<div class="form-group"><label class="form-label">错误码</label>' +
            '<input class="form-input" id="nbCode" placeholder="如 E-ESS-220"></div>' +
          '<div class="form-group"><label class="form-label">工单号</label>' +
            '<input class="form-input" id="nbWo"></div>' +
        '</div>' +
        '<div class="form-group" style="margin-top:11px">' +
          '<label class="form-label">备注 / 原始描述</label>' +
          '<textarea class="form-textarea" id="nbNote" placeholder="粘贴原始报错文本，判定引擎会据此匹配规则"></textarea>' +
        '</div>' +
        '<div class="note" style="margin-top:12px">保存时会走判定引擎：' +
          '命中规则则按规则结论归类，未命中则进入<b>待确认</b>队列并留下判定流水。</div>',
      footer: '<button class="btn" data-mclose="1">取消</button>' +
              '<button class="btn primary" id="nbSave">保存</button>',
      onMount(h) {
        h.el.addEventListener('click', async e => {
          if (!e.target.closest('#nbSave')) return;
          const sn = h.query('#nbSn').value.trim();
          if (!sn) { Toast.warn('SN 必填'); return; }
          const station = h.query('#nbStation').value;
          const code = h.query('#nbCode').value.trim() || ErrCodeRules.extract(h.query('#nbNote').value);
          const ctx = {
            source: 'manual', station, sn,
            pn: h.query('#nbPn').value.trim(),
            woNo: h.query('#nbWo').value.trim(),
            errCode: code,
            rawText: h.query('#nbNote').value.trim() || h.query('#nbType').value,
            note: h.query('#nbNote').value.trim(),
            time: Date.now()
          };
          const r = await DefectEngine.record(ctx, App.defectDeps());
          App.invalidate('bad');
          await App.ensureRecords('bad');
          h.close();
          render();
          Toast.ok('已记录 · 判定：' + L.verdict(r.verdict) +
                   (r.ruleId ? '（命中规则）' : '（未命中，进入待确认）'));
        });
      }
    });
  }

  function bind() {
    Dom.delegate('badBody', 'click', '[data-bad-filter]', (e, el) => {
      LocalStore.ui.set('badFilter', el.dataset.badFilter);
      _page = 1;
      render();
    });
    Dom.delegate('badBody', 'click', '[data-bad-confirm]', (e, el) => confirmOne(el.dataset.badConfirm));
    Dom.delegate('badBody', 'click', '[data-bad-trace]', (e, el) => {
      LocalStore.ui.set('traceQuery', el.dataset.badTrace);
      App.switchView('trace');
    });
    Dom.delegate('badBody', 'change', '#badSelectAll', (e, el) => {
      Dom.$$('[data-bad-select]').forEach(x => { x.checked = el.checked; });
    });
    Dom.delegate('badBody', 'click', '#btnBadBatchConfirm', batchConfirm);
    Dom.delegate('badBody', 'click', '#btnBadExport', exportCsv);
    Dom.delegate('badBody', 'click', '#btnBadNew', openNew);
    Dom.delegate('badBody', 'click', '#btnDefectRules', () => {
      if (typeof ModalDefectRules !== 'undefined') ModalDefectRules.open();
      else Toast.warn('不良判定设置将在阶段 2 提供');
    });
    Dom.delegate('badBody', 'click', '[data-pg]', (e, el) => {
      _page = DataTable.handlePage(el.dataset.pg, _page, (App.bad || []).length);
      render();
    });
  }

  return { render, bind };
})();


/* ==========================================================================
   src/views/error.js
   ========================================================================== */
/* ============================================================================
   报错记录 —— 以设备/机柜为主体的异常（区别于以产品为主体的不良记录）
   ----------------------------------------------------------------------------
   同一位置同类型同日期的报错会合并计数，避免连续巡检堆出成千上万条。
   ============================================================================ */

const ViewError = (() => {

  let _page = 1;
  let _filterHandled = 'all';

  async function render() {
    await App.ensureRecords('error');
    const all = App.error || [];
    const list = _filterHandled === 'open' ? all.filter(e => !e.handled)
               : _filterHandled === 'done' ? all.filter(e => e.handled)
               : all;

    const byType = {};
    all.forEach(e => { byType[e.type || '未分类'] = (byType[e.type || '未分类'] || 0) + 1; });
    const typeItems = Object.keys(byType).sort((a, b) => byType[b] - byType[a])
      .map(k => ({ label: k, value: byType[k], color: 'var(--warn)' }));

    const byCode = {};
    all.forEach(e => {
      const c = e.errCode || '(无错误码)';
      byCode[c] = (byCode[c] || 0) + (e.count || 1);
    });
    const codeRows = Object.keys(byCode).sort((a, b) => byCode[b] - byCode[a])
      .map(k => ({ code: k, count: byCode[k] }));

    const byCab = {};
    all.forEach(e => {
      const c = e.cabinetId || e.equipmentId || '(未知位置)';
      byCab[c] = (byCab[c] || 0) + (e.count || 1);
    });
    const cabItems = Object.keys(byCab).sort((a, b) => byCab[b] - byCab[a]).slice(0, 12)
      .map(k => ({ label: k, value: byCab[k], color: 'var(--abort)' }));

    const openCount = all.filter(e => !e.handled).length;

    const cols = [
      { key: 'time', label: '最近时间', fmt: v => Util.fmtFull(v) },
      { key: 'station', label: '工站' },
      { key: 'cabinetId', label: '机柜', fmt: v => v || '--' },
      { key: 'equipmentId', label: '设备', fmt: v => v || '--' },
      { key: 'type', label: '报错类型' },
      { key: 'message', label: '信息' },
      { key: 'errCode', label: '错误码', fmt: v => v || '--' },
      { key: 'count', label: '次数', cls: 'num', html: v =>
          v > 1 ? '<b style="color:#f5cd6b">' + v + '</b>' : v },
      { key: 'handled', label: '状态', html: v =>
          v ? '<span class="pill p-pass">已处理</span>' : '<span class="pill p-wait">待处理</span>' },
      { key: 'act', label: '操作', html: (v, row) =>
          (row.handled ? '' : '<button class="btn xs" data-err-handle="' + row.id + '">标记已处理</button>') }
    ];

    const sorted = list.slice().sort((a, b) => (b.lastTime || b.time || 0) - (a.lastTime || a.time || 0));
    const pg = DataTable.paginated(cols, sorted, _page);

    Dom.html('errorBody',
      '<div class="toolbar">' +
        '<button class="btn ' + (_filterHandled === 'all' ? 'on' : '') + '" data-err-filter="all">' +
          '全部 ' + all.length + '</button>' +
        '<button class="btn ' + (_filterHandled === 'open' ? 'on' : '') + '" data-err-filter="open">' +
          '待处理 ' + openCount + '</button>' +
        '<button class="btn ' + (_filterHandled === 'done' ? 'on' : '') + '" data-err-filter="done">' +
          '已处理 ' + (all.length - openCount) + '</button>' +
        '<span class="spacer" style="flex:1"></span>' +
        '<button class="btn" id="btnErrExport">导出 CSV</button>' +
        '<button class="btn" id="btnErrNew">记录报错</button>' +
      '</div>' +

      '<div class="cards">' +
        '<div class="card"><div class="lbl">报错条目</div>' +
          '<div class="val" style="color:var(--warn)">' + Util.num(all.length) + '</div></div>' +
        '<div class="card"><div class="lbl">累计次数</div>' +
          '<div class="val">' + Util.num(all.reduce((a, e) => a + (e.count || 1), 0)) + '</div>' +
          '<div class="sub">同一位置同类型同日合并计数</div></div>' +
        '<div class="card"><div class="lbl">待处理</div>' +
          '<div class="val" style="color:' + (openCount ? 'var(--bad)' : 'var(--ok)') + '">' +
          Util.num(openCount) + '</div></div>' +
        '<div class="card"><div class="lbl">涉及设备</div>' +
          '<div class="val">' + Util.num(Object.keys(byCab).length) + '</div></div>' +
      '</div>' +

      '<div class="section-title">错误码 TOP</div>' +
      (codeRows.length
        ? DataTable.build([
            { key: 'code', label: '错误码' },
            { key: 'count', label: '累计次数', cls: 'num' }
          ], codeRows.slice(0, 15), { emptyText: '暂无错误码' })
        : '<div class="empty-tip">暂无错误码（多数报错未携带错误码）</div>') +

      '<div class="section-title">报错类型分布</div>' +
      (typeItems.length ? DataTable.summaryList(typeItems) : '<div class="empty-tip">暂无数据</div>') +

      '<div class="section-title">报错集中的位置（TOP 12）</div>' +
      (cabItems.length ? DataTable.summaryList(cabItems) : '<div class="empty-tip">暂无数据</div>') +

      '<div class="section-title">明细</div>' + pg.html
    );
    _page = pg.page;
  }

  async function markHandled(id) {
    const list = App.error || [];
    const e = list.filter(x => x.id === id)[0];
    if (!e) return;
    e.handled = true;
    e.updatedAt = Date.now();
    await Repo.put('error', e);
    render();
    Toast.ok('已标记为已处理');
  }

  function exportCsv() {
    const list = (App.error || []).slice().sort((a, b) => (b.time || 0) - (a.time || 0));
    if (!list.length) { Toast.warn('暂无数据'); return; }
    const rows = list.map(e => [
      e.day, e.firstTime ? Util.fmtFull(e.firstTime) : '', e.lastTime ? Util.fmtFull(e.lastTime) : '',
      e.station, e.cabinetId, e.serverId, e.equipmentId, e.type, e.message, e.errCode,
      e.count, e.handled ? '已处理' : '待处理', e.sn, e.source
    ]);
    Util.download('报错记录_' + Util.tsTag() + '.csv', Util.toCsv(
      ['日期', '首次时间', '最近时间', '工站', '机柜', '设备', '设备ID', '报错类型',
       '信息', '错误码', '次数', '状态', 'SN', '来源'], rows));
    Toast.ok('已导出 ' + rows.length + ' 条');
  }

  async function openNew() {
    const stations = Topology.effectiveStations(App.cfg);
    Modal.open({
      title: '记录报错', size: 'normal',
      body:
        '<div class="form-row">' +
          '<div class="form-group"><label class="form-label">工站</label>' +
            '<select class="form-select" id="neStation">' +
              stations.map(s => '<option value="' + s.key + '">' + s.name + ' · ' + s.cn + '</option>').join('') +
            '</select></div>' +
          '<div class="form-group"><label class="form-label">报错类型</label>' +
            '<select class="form-select" id="neType">' +
              ERROR_TYPES.map(t => '<option>' + Util.esc(t) + '</option>').join('') +
            '</select></div>' +
        '</div>' +
        '<div class="form-row" style="margin-top:11px">' +
          '<div class="form-group"><label class="form-label">机柜号</label>' +
            '<input class="form-input" id="neCab" placeholder="如 CAB-N-01"></div>' +
          '<div class="form-group"><label class="form-label">设备号</label>' +
            '<input class="form-input" id="neEq" placeholder="如 SRV-N-001 / OVEN-B-01"></div>' +
        '</div>' +
        '<div class="form-group" style="margin-top:11px">' +
          '<label class="form-label">报错信息</label>' +
          '<textarea class="form-textarea" id="neMsg" placeholder="设备侧原始报错文本"></textarea>' +
        '</div>' +
        '<div class="form-group" style="margin-top:11px">' +
          '<label class="form-label">错误码</label>' +
          '<input class="form-input" id="neCode" placeholder="留空则自动从信息中提取">' +
          '<div class="form-hint">已知错误码会自动带出处置策略（是否允许复测、是否锁定 SN）</div>' +
        '</div>' +
        '<div id="neCodeHint"></div>',
      footer: '<button class="btn" data-mclose="1">取消</button>' +
              '<button class="btn primary" id="neSave">保存</button>',
      onMount(h) {
        const codeEl = h.query('#neCode');
        const msgEl = h.query('#neMsg');
        const updHint = () => {
          const c = codeEl.value.trim() || ErrCodeRules.extract(msgEl.value);
          const r = c ? ErrCodeRules.find(App.cfg, c) : null;
          h.query('#neCodeHint').innerHTML = c
            ? (r
              ? '<div class="note">识别到 <b>' + Util.esc(r.code) + ' ' + Util.esc(r.name) + '</b><br>' +
                '处置：' + Util.esc(r.action || '--') + '<br>' +
                '允许复测：' + (r.allowRetest ? '<b style="color:#6ee787">是</b>' : '否') +
                ' · 锁定 SN：' + (r.lockSn ? '<b style="color:#ff8b82">是</b>' : '否') + '</div>'
              : '<div class="note warn">未识别的错误码，将按人工判定处理</div>')
            : '';
        };
        codeEl.addEventListener('input', updHint);
        msgEl.addEventListener('input', updHint);

        h.el.addEventListener('click', async e => {
          if (!e.target.closest('#neSave')) return;
          const msg = msgEl.value.trim();
          if (!msg) { Toast.warn('报错信息必填'); return; }
          const code = codeEl.value.trim() || ErrCodeRules.extract(msg);
          const rec = Schema.newError({
            station: h.query('#neStation').value,
            type: h.query('#neType').value,
            cabinetId: h.query('#neCab').value.trim(),
            equipmentId: h.query('#neEq').value.trim(),
            message: msg, errCode: code,
            source: 'manual', time: Date.now()
          });
          // 同位置同类型同日期合并
          const dup = (App.error || []).filter(x =>
            !x.handled && x.type === rec.type && x.day === rec.day &&
            x.equipmentId === rec.equipmentId && x.cabinetId === rec.cabinetId)[0];
          if (dup) {
            dup.count = (dup.count || 1) + 1;
            dup.lastTime = Date.now();
            dup.message = msg;
            if (code) dup.errCode = code;
            await Repo.put('error', dup);
          } else {
            await Repo.put('error', rec);
          }
          App.invalidate('error');
          await App.ensureRecords('error');
          h.close();
          render();
          Toast.ok(dup ? '已合并到同类报错（次数 +1）' : '已记录报错');
        });
      }
    });
  }

  function bind() {
    Dom.delegate('errorBody', 'click', '[data-err-filter]', (e, el) => {
      _filterHandled = el.dataset.errFilter; _page = 1; render();
    });
    Dom.delegate('errorBody', 'click', '[data-err-handle]', (e, el) => markHandled(el.dataset.errHandle));
    Dom.delegate('errorBody', 'click', '#btnErrExport', exportCsv);
    Dom.delegate('errorBody', 'click', '#btnErrNew', openNew);
    Dom.delegate('errorBody', 'click', '[data-pg]', (e, el) => {
      _page = DataTable.handlePage(el.dataset.pg, _page, (App.error || []).length);
      render();
    });
  }

  return { render, bind };
})();


/* ==========================================================================
   src/views/pull.js
   ========================================================================== */
/* ============================================================================
   实时拉取中心 —— 四通道数据接入
   ----------------------------------------------------------------------------
   页面自己连不上 FTP / SSH / 本机目录，全部经桥接服务转发。
   本视图负责：配置、检测、扫描、拉取、看结果。
   ============================================================================ */

const ViewPull = (() => {

  let _scan = null;          // 最近一次扫描结果
  let _log = [];             // 运行日志（界面下方滚动区）
  let _pollTimer = null;
  let _renderSeq = 0;

  function log(msg, cls) {
    _log.unshift({ t: Util.nowStr(), msg, cls: cls || '' });
    if (_log.length > 200) _log.length = 200;
    const box = document.getElementById('pullRunLog');
    if (box) box.innerHTML = runLogHtml();
  }

  function runLogHtml() {
    if (!_log.length) return '<div class="hint" style="margin:0">暂无操作记录</div>';
    return _log.slice(0, 60).map(x =>
      '<div class="ft-runlog ' + x.cls + '">' +
        '<span class="t">' + Util.esc(x.t) + '</span>' + Util.esc(x.msg) +
      '</div>').join('');
  }

  /* --------------------------------------------------------------------------
     渲染
     -------------------------------------------------------------------------- */
  async function render(checkConnection = true) {
    const seq = ++_renderSeq;
    await App.ensureRecords('logindex');
    const cfg = App.cfg;
    const ch = cfg.channels || {};
    const h = Bridge.peekHealth();
    const st = await FtpChannel.status();
    if (seq !== _renderSeq) return;
    const sshSnap = Ssh.lastAt() ? { at: Ssh.lastAt() } : null;
    const sshSum = (App.state.lastSshSummary) || {};

    Dom.html('pullBody',
      '<div class="toolbar">' +
        '<span class="title">实时拉取</span>' +
        '<span class="' + Bridge.healthChipClass(h) + '" id="pullBridgeChip">' +
          Util.esc(Bridge.healthLabel(h)) + '</span>' +
        (h.version ? '<span class="chip">v' + Util.esc(h.version) + '</span>' : '') +
        (h.paramiko === false ? '<span class="chip warn" title="未装 paramiko 时 SSH 只能用密钥认证">' +
          'SSH 仅密钥</span>' : '') +
        '<span class="spacer" style="flex:1"></span>' +
        '<button class="btn" id="btnPullHelp">部署说明</button>' +
        '<button class="btn" id="btnPullSettings">接入设置</button>' +
        '<button class="btn" id="btnPullProbe">检测连接</button>' +
        '<button class="btn" id="btnPullSsh">立即巡检</button>' +
        '<button class="btn primary" id="btnPullNow">拉取日志</button>' +
      '</div>' +

      (h.ok ? '' :
        '<div class="note warn">' +
          (h.pending ? '<b>正在后台检测连接</b>。' : '<b>当前为离线模式</b>。' + Util.esc(h.error || '')) +
          '<br>可正常查看本地数据、导入设备台账、管理工单和导出备份。' +
          'SSH 巡检、FTP 和目录扫描需启动桥接服务；启动后点击「检测连接」。' +
        '</div>') +

      '<div class="cards">' +
        card('已入库盘位', Util.num(App.slots.size),
             '容量 ' + Util.num(Topology.all(cfg).totalSlots) +
             (Topology.hasRegistry() ? ' · 台账模式' : ' · 合成模式')) +
        card('设备台账', Util.num(App.devices.length),
             App.devices.length ? '已导入，可用于巡检与 IP 映射' : '未导入') +
        card('已拉取日志', Util.num((App.logindex || []).length), '份') +
        card('解析记录', Util.num((App.records || []).length), '条') +
        card('巡检机台', h.sshHosts ? Util.num(h.sshHosts) : '—',
             sshSnap ? '上次 ' + Util.fmtTime(sshSnap.at) : '尚未巡检',
             sshSum.online != null ? '在线 ' + sshSum.online + ' / 在测 ' + (sshSum.testing || 0) : '') +
        card('增量标记', Util.num(st.seenCount), '已见过的文件数') +
      '</div>' +

      '<div class="section-title">数据通道</div>' +
      '<div class="cards">' +
        chanCard('机台 SSH 直读', ch.ssh, 'ssh', h,
          '定时只读巡检机台，取在线/在测状态与最新日志时间') +
        chanCard('FTP 日志服务器', ch.ftp, 'ftp', h,
          '扫描并拉取集中存放的日志包；支持增量（只拉变化的）') +
        chanCard('本地目录 / 共享盘', ch.localDir, 'localDir', h,
          '从本机或共享盘的日志目录导入，无需网络接入') +
        chanCard('MES 系统接口', ch.webapp, 'webapp', h,
          '通过 HTTP API 从 MES / 上位系统取数（协议待现场提供）') +
      '</div>' +

      '<div class="section-title">操作' +
        '<span class="note-inline">扫描只读目录，不会修改任何远端文件</span></div>' +
      '<div class="toolbar">' +
        '<button class="btn" id="btnScanFtp">扫描 FTP</button>' +
        '<button class="btn" id="btnScanLocal">扫描本地目录</button>' +
        '<label class="legend-chk"><input type="checkbox" id="chkOnlyNew"' +
          (cfg.settings.onlyNew !== false ? ' checked' : '') + '> 仅拉取新增/变化的文件</label>' +
        '<span class="hint" style="margin:0">单轮最多 ' +
          (cfg.settings.maxFilesPerRun || 80) + ' 个文件</span>' +
      '</div>' +
      '<div id="pullScanResult">' + scanResultHtml() + '</div>' +

      '<div class="section-title">已拉取的日志</div>' +
      logIndexHtml() +

      '<div class="section-title">运行日志</div>' +
      '<div class="ft-runlog-box" id="pullRunLog">' + runLogHtml() + '</div>'
    );
    if (checkConnection) {
      Bridge.health().then(() => {
        App.refreshStatus();
        if (seq === _renderSeq && App.state.curView === 'pull') return render(false);
      }).catch(e => console.warn('[ViewPull] 状态更新失败：', e.message));
    }
  }

  function card(lbl, val, sub, extra) {
    return '<div class="card"><div class="lbl">' + Util.esc(lbl) + '</div>' +
      '<div class="val">' + val + '</div>' +
      (sub ? '<div class="sub">' + Util.esc(sub) + '</div>' : '') +
      (extra ? '<div class="sub">' + Util.esc(extra) + '</div>' : '') + '</div>';
  }

  function chanCard(title, conf, kind, h, desc) {
    const on = conf && conf.enabled;
    let detail = '未配置', state = '', stateCls = '';
    if (kind === 'ssh') {
      detail = (conf.user || '--') + '@' + (conf.logRoot || '未设根目录') + ' :' + (conf.port || 22);
      if (h.sshHosts) {
        state = h.sshReady ? '就绪' : (h.sshMessage || '未就绪');
        stateCls = h.sshReady ? 'ok' : 'warn';
      } else { state = '未下发机台清单'; stateCls = ''; }
    } else if (kind === 'ftp') {
      detail = (conf.host || '未填主机') + ' ' + (conf.basePath || '');
      if (h.ftpConfigured) {
        state = h.ftpConnected ? '已连接' : (h.ftpError || '连接失败');
        stateCls = h.ftpConnected ? 'ok' : 'bad';
      } else { state = '未配置'; }
    } else if (kind === 'localDir') {
      detail = conf.path || '未选目录';
      state = h.localReady ? '就绪' : '未配置';
      stateCls = h.localReady ? 'ok' : '';
    } else {
      detail = conf.baseUrl || '未填地址';
      state = conf.baseUrl ? '已配置（协议待确认）' : '未配置';
      stateCls = conf.baseUrl ? 'warn' : '';
    }

    return '<div class="card">' +
      '<div class="lbl" style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">' +
        Util.esc(title) +
        '<span class="chip ' + (on ? 'ok' : '') + '">' + (on ? '已启用' : '未启用') + '</span>' +
        (state ? '<span class="chip ' + stateCls + '">' + Util.esc(state) + '</span>' : '') +
      '</div>' +
      '<div style="font-size:11.5px;color:var(--tx-2);line-height:1.7;margin:7px 0;min-height:40px">' +
        Util.esc(desc) + '</div>' +
      '<div class="mono" style="font-size:11px;color:var(--tx-3);word-break:break-all">' +
        Util.esc(detail) + '</div>' +
    '</div>';
  }

  function scanResultHtml() {
    if (!_scan) return '<div class="hint">尚未扫描。点「扫描 FTP」或「扫描本地目录」查看可拉取的文件。</div>';
    if (!_scan.files.length) {
      return '<div class="note warn">扫描完成，未找到日志文件。' +
        '请检查通道配置里的根目录是否正确。</div>';
    }
    const show = _scan.files.slice(0, 60);
    return '<div class="note ok">扫描到 <b>' + Util.num(_scan.files.length) + '</b> 个文件' +
      (_scan.files.length > 60 ? '（仅列出前 60）' : '') + '。</div>' +
      DataTable.build([
        { key: 'name', label: '文件名' },
        { key: 'path', label: '路径', fmt: v => Util.truncate(v, 60) },
        { key: 'size', label: '大小', cls: 'num', fmt: v => v ? Util.bytes(v) : '--' },
        { key: 'mtime', label: '修改时间', fmt: v => v ? Util.fmtFull(v) : '--' }
      ], show);
  }

  function logIndexHtml() {
    const idx = App.logindex || [];
    if (!idx.length) return '<div class="empty-tip">尚未拉取任何日志</div>';
    return DataTable.build([
      { key: 'pulledAt', label: '拉取时间', fmt: v => Util.fmtFull(v) },
      { key: 'station', label: '工站', fmt: v => v || '--' },
      { key: 'name', label: '文件名' },
      { key: 'size', label: '大小', cls: 'num', fmt: v => v ? Util.bytes(v) : '--' },
      { key: 'parsed', label: '解析记录', cls: 'num' },
      { key: 'hits', label: '关键词命中', fmt: v =>
        Object.keys(v || {}).map(k => k + '=' + v[k]).join(', ') || '--' }
    ], idx.slice().sort((a, b) => (b.pulledAt || 0) - (a.pulledAt || 0)).slice(0, 100));
  }

  function refreshScan() {
    const el = document.getElementById('pullScanResult');
    if (el) el.innerHTML = scanResultHtml();
  }

  /* --------------------------------------------------------------------------
     动作
     -------------------------------------------------------------------------- */
  async function ensureConfigPushed() {
    if (!Bridge.configured()) {
      Toast.warn('请先在「接入设置」里填写桥接地址');
      return false;
    }
    const h = await Bridge.health();
    if (!h.ok) {
      Toast.warn('当前为离线模式。实时接入需启动桥接服务，再点击「检测连接」。');
      return false;
    }
    try { await Bridge.pushConfig(); return true; }
    catch (e) { Toast.error('下发配置失败：' + e.message); return false; }
  }

  async function probe() {
    log('开始检测桥接连接…');
    const h = await Bridge.health(true);
    App.refreshStatus();
    if (!h.ok) {
      log('桥接不可达：' + (h.error || ''), 'err');
      Toast.error(h.error || '桥接不可达');
      render();
      return;
    }
    log('桥接正常 v' + h.version, 'ok');
    try {
      const r = await Bridge.api('/api/net/selfcheck');
      (r.items || []).forEach(i => log(i.name + '：' + i.message, i.ok ? 'ok' : 'warn'));
    } catch (e) { log('自检失败：' + e.message, 'err'); }
    render();
  }

  async function doScan(kind) {
    if (!await ensureConfigPushed()) return;
    log('开始扫描 ' + (kind === 'local' ? '本地目录' : 'FTP') + '…');
    try {
      const r = await FtpChannel.scanAllRoots(kind);
      _scan = { kind, files: r.files, at: Date.now() };
      r.errors.forEach(e => log('根目录「' + e.root + '」失败：' + e.error, 'err'));
      log('扫描完成，' + r.files.length + ' 个文件', 'ok');
      refreshScan();
    } catch (e) {
      log('扫描失败：' + e.message, 'err');
      Toast.error('扫描失败：' + e.message);
    }
  }

  async function doPull() {
    if (!await ensureConfigPushed()) return;
    const kind = _scan ? _scan.kind : (/本地|local/i.test('') ? 'local' : 'ftp');
    log('开始拉取（' + (App.cfg.settings.onlyNew !== false ? '仅增量' : '全量') + '）…');
    const stat = await FtpChannel.pull(kind === 'local' ? 'local' : 'ftp', {
      onlyNew: App.cfg.settings.onlyNew !== false,
      files: _scan ? _scan.files : null
    });
    if (!stat) { log('拉取未完成', 'err'); return; }
    log('拉取 ' + stat.pulled + ' 个文件（' + Util.bytes(stat.bytes) + '），' +
        '解析 ' + stat.records + ' 条记录' + (stat.failed ? '，失败 ' + stat.failed : ''),
        stat.failed ? 'warn' : 'ok');
    (stat.errors || []).slice(0, 8).forEach(e =>
      log('  ' + (e.file || e.root || '') + '：' + e.error, 'err'));
    await App.loadAll();
    render();
  }

  async function doSsh() {
    if (!await ensureConfigPushed()) return;
    if (!App.devices.length) {
      Toast.warn('尚未导入设备台账，无法知道该巡检哪些 IP');
      return;
    }
    log('下发机台清单…');
    const r = await Bridge.pushHosts();
    log('已下发 ' + r.count + ' 个机台', 'ok');
    log('开始巡检（并发执行，请稍候）…');
    const snap = await Ssh.probeNow();
    if (!snap) { log('巡检失败', 'err'); return; }
    const s = snap.summary || {};
    App.state.lastSshSummary = s;
    log('巡检完成：在线 ' + s.online + ' · 离线 ' + s.offline +
        ' · 在测 ' + s.testing + ' · SSH异常 ' + s.sshError +
        '（' + s.elapsedSec + ' 秒）', s.sshError ? 'warn' : 'ok');
    if (App.state.eqIndexUnmatched) {
      log(' warn：有 ' + App.state.eqIndexUnmatched +
          ' 台机台的 IP 在设备台账里找不到对应设备', 'warn');
    }
    Bus.emit(EVT.SLOTS_CHANGED, { keys: null });
    render();
  }

  function openHelp() {
    const url = Bridge.base() || 'http://127.0.0.1:8770';
    Modal.open({
      title: '桥接服务部署说明',
      size: 'wide',
      body:
        '<div class="note">' +
          '浏览器<b>无法</b>直连 FTP、<b>无法</b>遍历本机任意目录、<b>无法</b> SSH 到机台。' +
          '所以现场数据必须由本机的一个小服务代劳 —— 这就是桥接服务。' +
        '</div>' +

        '<div class="section-title">一、启动</div>' +
        '<div class="hint" style="line-height:2">' +
          '1. 确认本机有 Python 3.8+（<code>python --version</code>）<br>' +
          '2. 双击 <code>bridge\\启动桥接服务.bat</code><br>' +
          '3. 看到「监听地址 http://127.0.0.1:8770」即启动成功，窗口保持开着<br>' +
          '4. 回到本页点「检测连接」' +
        '</div>' +

        '<div class="section-title">二、为什么建议用桥接打开页面</div>' +
        '<div class="note ok">' +
          '启动桥接后，直接访问 <b><a href="' + Util.esc(url) + '" target="_blank">' +
          Util.esc(url) + '</a></b> 打开看板，而不是双击 HTML 文件。<br><br>' +
          '原因：Chrome/Edge 在 <code>file://</code> 协议下会<b>禁用 IndexedDB</b>，' +
          '看板只能退回容量受限的降级存储模式（页面顶部会出现橙色横幅）。' +
          '而 <code>127.0.0.1</code> 是安全上下文，存储、目录授权等功能全部可用。' +
        '</div>' +

        '<div class="section-title">三、SSH 密码认证（可选）</div>' +
        '<div class="hint" style="line-height:2">' +
          '默认只用 Python 标准库，<b>零第三方依赖</b>。<br>' +
          'SSH 若要用密码登录（而不是密钥），需要额外装一个包：<br>' +
          '<code>pip install paramiko</code><br>' +
          (App.state && App.state.bridgeParamiko === false
            ? '<span style="color:var(--warn)">当前未安装，SSH 只能用密钥认证。</span>'
            : '') +
        '</div>' +

        '<div class="section-title">四、只读保证</div>' +
        '<div class="hint" style="line-height:2">' +
          '桥接<b>全链路只读</b>：不写远端、不删日志、不改配置。<br>' +
          'SSH 命令要过白名单校验，<code>rm</code> / <code>dd</code> / <code>&gt;</code> ' +
          '这类写操作一律拒绝。<br>' +
          '文件访问限制在配置的根目录内，<code>../</code> 穿越会被拦截。' +
        '</div>' +
        '<div class="hint" style="margin-top:10px">' +
          '默认<b>仅监听本机</b>。若需手机或其他电脑访问，' +
          '启动时加 <code>--allow-remote --token 你的令牌</code>，' +
          '并在本页「接入设置」里填入同样的令牌。' +
        '</div>',
      footer: '<button class="btn" data-mclose="1">知道了</button>'
    });
  }

  /* --------------------------------------------------------------------------
     事件
     -------------------------------------------------------------------------- */
  function bind() {
    Dom.delegate('pullBody', 'click', '#btnPullProbe', probe);
    Dom.delegate('pullBody', 'click', '#btnPullNow', doPull);
    Dom.delegate('pullBody', 'click', '#btnPullSsh', doSsh);
    Dom.delegate('pullBody', 'click', '#btnScanFtp', () => doScan('ftp'));
    Dom.delegate('pullBody', 'click', '#btnScanLocal', () => doScan('local'));
    Dom.delegate('pullBody', 'click', '#btnPullHelp', openHelp);
    Dom.delegate('pullBody', 'click', '#btnPullSettings', () => ModalSettings.open());
    Dom.delegate('pullBody', 'change', '#chkOnlyNew', (e, el) => {
      App.cfg.settings.onlyNew = el.checked;
      LocalStore.save();
      Toast.ok(el.checked ? '仅拉取新增/变化的文件' : '每轮全量拉取');
    });
  }

  /* 视图可见时若有桥接但从未探测过，自动探一次 */
  async function afterMount() {
    if (Bridge.configured() && !Ssh.lastAt()) {
      // 静默探测，不打扰用户
      Bridge.health().then(h => {
        App.state.bridgeParamiko = h.paramiko;
      });
    }
  }

  return { render, bind, afterMount };
})();


/* ==========================================================================
   src/views/wo.js
   ========================================================================== */
/* ============================================================================
   工单管理 —— 工序链进度、接单/开始/结单、结单归档
   ============================================================================ */

const ViewWo = (() => {

  async function render() {
    await App.ensureRecords('records');
    const list = App.workOrders || [];
    const sum = WorkOrder.summary(list);

    Dom.html('woBody',
      '<div class="toolbar">' +
        '<span class="title">工单管理</span>' +
        '<span class="spacer" style="flex:1"></span>' +
        '<button class="btn" id="btnWoExport">导出 CSV</button>' +
        '<button class="btn primary" id="btnWoNew">新建工单</button>' +
      '</div>' +

      '<div class="cards">' +
        '<div class="card"><div class="lbl">工单总数</div><div class="val">' +
          Util.num(sum.total) + '</div>' +
          '<div class="sub">合计 ' + Util.num(sum.qty) + ' 块</div></div>' +
        '<div class="card"><div class="lbl">待生产</div><div class="val">' + sum.wait + '</div></div>' +
        '<div class="card"><div class="lbl">已接单</div><div class="val">' + sum.accepted + '</div></div>' +
        '<div class="card accent"><div class="lbl">生产中</div>' +
          '<div class="val" style="color:var(--info)">' + sum.running + '</div></div>' +
        '<div class="card"><div class="lbl">已结单</div>' +
          '<div class="val" style="color:var(--ok)">' + sum.closed + '</div></div>' +
      '</div>' +

      (list.length
        ? list.map(woCard).join('')
        : '<div class="empty-tip">暂无工单。点击「新建工单」创建，' +
          '或到「实时拉取」从现场系统导入。</div>')
    );
  }

  function woCard(wo) {
    const recs = (App.records || []).filter(r => r.woId === wo.id);
    const actual = WorkOrder.actualOf(wo, recs);
    const prog = WorkOrder.progressOf(wo, actual);
    const chk = WorkOrder.checkClose(wo, actual, recs);
    const steps = WorkOrder.processWithOrt(wo.model || wo.pn);

    const stepHtml = steps.map(st => {
      const s = ST[st];
      const a = actual[st] || { tested: 0, pass: 0, fail: 0 };
      const need = (wo.plan || {})[st] || 0;
      const done = need > 0 && a.tested >= need;
      const active = !done && a.tested > 0;
      const isOrt = st === 'ORT';
      return '<div class="wo-step' + (done ? ' done' : active ? ' active' : '') + '"' +
          (isOrt ? ' style="opacity:.82"' : '') + '>' +
        '<div class="wo-step-name">' + Util.esc(s ? s.name : st) +
          (isOrt ? '<span style="font-size:9.5px;color:var(--tx-3)"> 旁路</span>' : '') + '</div>' +
        '<div class="wo-step-stat">' + Util.num(a.tested) + ' / ' + Util.num(need) + '</div>' +
        (a.fail ? '<div class="wo-step-stat" style="color:#ff8b82">FAIL ' + a.fail + '</div>' : '') +
      '</div>';
    }).join('');

    const canAccept = wo.status === 'wait';
    const canStart = wo.status === 'accepted' || wo.status === 'wait';
    const canClose = wo.status === 'running' || wo.status === 'accepted';
    const canReopen = wo.status === 'closed';

    return '<div class="wo-card" data-wo="' + Util.esc(wo.id) + '">' +
      '<div class="wo-card-head">' +
        '<span class="wo-no">' + Util.esc(wo.no) + '</span>' +
        '<span class="wo-badge ' + L.woPill(wo.status) + '">' + Util.esc(L.woState(wo.status)) + '</span>' +
        '<span style="font-size:11.5px;color:var(--tx-2)">' + Util.esc(wo.model || wo.pn) + '</span>' +
        (wo.customer ? '<span class="pill p-wait">' + Util.esc(wo.customer) + '</span>' : '') +
        '<span class="spacer" style="flex:1"></span>' +
        '<span style="font-size:11.5px;color:var(--tx-2)">' +
          Util.num(actual.__tested || recs.length) + ' / ' + Util.num(wo.qty) + ' 块</span>' +
      '</div>' +
      '<div class="wo-meta">' +
        'PN ' + Util.esc(wo.pn || '--') + ' · 数量 ' + Util.num(wo.qty) + ' · 创建 ' +
        Util.fmtFull(wo.createdAt) +
        (wo.acceptedBy ? ' · 接单 ' + Util.esc(wo.acceptedBy) : '') +
        (wo.closedAt ? ' · 结单 ' + Util.fmtFull(wo.closedAt) : '') +
      '</div>' +
      '<div class="wo-progress">' + stepHtml + '</div>' +
      '<div style="margin:8px 0 4px">' + DataTable.miniBar(prog) +
        '<span style="font-size:11px;color:var(--tx-3);margin-left:8px">工序完成度</span></div>' +
      (chk.ok
        ? '<div class="suggest-card ok" style="margin:8px 0">✓ 全部工序已完成，无未确认 FAIL，可以结单</div>'
        : '<div class="suggest-card warn" style="margin:8px 0">未满足结单条件：' +
          Util.esc(chk.issues.join('；')) + '</div>') +
      (chk.ortNote ? '<div class="hint" style="margin:0 0 6px">' + Util.esc(chk.ortNote) + '</div>' : '') +
      '<div class="wo-actions">' +
        (canAccept ? '<button class="btn sm" data-wo-accept="' + wo.id + '">接单</button>' : '') +
        (canStart ? '<button class="btn sm" data-wo-start="' + wo.id + '">开始生产</button>' : '') +
        (canClose ? '<button class="btn sm primary" data-wo-close="' + wo.id + '">结单</button>' : '') +
        (canReopen ? '<button class="btn sm warn" data-wo-reopen="' + wo.id + '">反结单</button>' : '') +
        '<button class="btn sm" data-wo-detail="' + wo.id + '">详情</button>' +
        '<span class="spacer" style="flex:1"></span>' +
        (wo.status === 'closed' ? '' : '<button class="btn sm danger" data-wo-del="' + wo.id + '">删除</button>') +
      '</div>' +
    '</div>';
  }

  async function save(list) {
    for (const wo of list) await Repo.put('workorders', wo);
    App.state.workOrders = list;
  }

  async function openNew() {
    const stations = Topology.effectiveStations(App.cfg);
    Modal.open({
      title: '新建工单', size: 'normal',
      body:
        '<div class="form-row">' +
          '<div class="form-group"><label class="form-label">工单号<span class="req">*</span></label>' +
            '<input class="form-input" id="woNo" placeholder="如 WO26092901"></div>' +
          '<div class="form-group"><label class="form-label">订单号</label>' +
            '<input class="form-input" id="woOrderNo"></div>' +
        '</div>' +
        '<div class="form-row" style="margin-top:11px">' +
          '<div class="form-group"><label class="form-label">PN<span class="req">*</span></label>' +
            '<input class="form-input" id="woPn" placeholder="如 LVA-SSD-1T92-B3"></div>' +
          '<div class="form-group"><label class="form-label">机型 / 系列</label>' +
            '<input class="form-input" id="woModel" placeholder="如 Lava 1.92T"></div>' +
        '</div>' +
        '<div class="form-row" style="margin-top:11px">' +
          '<div class="form-group"><label class="form-label">生产数量<span class="req">*</span></label>' +
            '<input type="number" class="form-input" id="woQty" min="1" value="1000"></div>' +
          '<div class="form-group"><label class="form-label">客户 / 备注</label>' +
            '<input class="form-input" id="woCustomer"></div>' +
        '</div>' +
        '<div class="note" style="margin-top:12px">' +
          '工序链按机型自动推导：<b>' + MAINLINE.join(' → ') + '</b>' +
          '（ORT 为旁路抽检，单独按 2.5% 计算抽样量）。<br>' +
          '计划数 = 批量；ORT 计划 = ⌈批量 × 2.5%⌉。</div>' +
        '<div id="woPlanPreview"></div>',
      footer: '<button class="btn" data-mclose="1">取消</button>' +
              '<button class="btn primary" id="woSave">创建</button>',
      onMount(h) {
        const qtyEl = h.query('#woQty');
        const upd = () => {
          const q = Number(qtyEl.value) || 0;
          const ort = Sampling.calc(q);
          h.query('#woPlanPreview').innerHTML = q > 0
            ? '<div class="note">计划预览：主线各站 ' + Util.num(q) + ' 块；' +
              'ORT 抽 <b>' + ort.sample + '</b> 块（' + ort.rounds + ' 台次）</div>' : '';
        };
        qtyEl.addEventListener('input', upd);
        upd();

        h.el.addEventListener('click', async e => {
          if (!e.target.closest('#woSave')) return;
          const wo = WorkOrder.create({
            no: h.query('#woNo').value.trim(),
            orderNo: h.query('#woOrderNo').value.trim(),
            pn: h.query('#woPn').value.trim(),
            model: h.query('#woModel').value.trim(),
            qty: Number(qtyEl.value) || 0,
            customer: h.query('#woCustomer').value.trim()
          });
          const v = WorkOrder.validate(wo, App.workOrders);
          if (!v.ok) { Toast.warn(v.errors.join('；')); return; }
          App.state.workOrders = (App.workOrders || []).concat([wo]);
          await save(App.state.workOrders);
          h.close();
          render();
          Toast.ok('工单 ' + wo.no + ' 已创建');
        });
      }
    });
  }

  async function openDetail(id) {
    const wo = (App.workOrders || []).filter(w => w.id === id)[0];
    if (!wo) return;
    const recs = (App.records || []).filter(r => r.woId === wo.id);
    const actual = WorkOrder.actualOf(wo, recs);
    const chk = WorkOrder.checkClose(wo, actual, recs);

    /* 按天统计 */
    const byDay = {};
    recs.forEach(r => {
      const d = byDay[r.day] = byDay[r.day] || { tested: 0, pass: 0, fail: 0 };
      d.tested++;
      const res = String(r.result).toUpperCase();
      if (res === 'PASS') d.pass++;
      else if (res === 'FAIL') d.fail++;
    });
    const dayRows = Object.keys(byDay).sort().map(d => Object.assign({ day: d }, byDay[d]));

    Modal.open({
      title: '工单详情 · ' + wo.no,
      sub: (wo.model || wo.pn) + ' · ' + Util.num(wo.qty) + ' 块 · ' + L.woState(wo.status),
      size: 'wide',
      body:
        '<div class="cards">' +
          '<div class="card"><div class="lbl">已测记录</div><div class="val">' +
            Util.num(recs.length) + '</div></div>' +
          '<div class="card"><div class="lbl">PASS</div>' +
            '<div class="val" style="color:var(--ok)">' +
            Util.num(recs.filter(r => String(r.result).toUpperCase() === 'PASS').length) + '</div></div>' +
          '<div class="card"><div class="lbl">FAIL</div>' +
            '<div class="val" style="color:var(--bad)">' +
            Util.num(recs.filter(r => String(r.result).toUpperCase() === 'FAIL').length) + '</div></div>' +
        '</div>' +
        '<div class="note ' + (chk.ok ? 'ok' : 'warn') + '">' +
          (chk.ok ? '✓ 可以结单' : '未满足结单条件：' + Util.esc(chk.issues.join('；'))) + '</div>' +
        '<div class="section-title">工序进度</div>' +
        DataTable.build([
          { key: 'st', label: '工序' },
          { key: 'plan', label: '计划', cls: 'num' },
          { key: 'tested', label: '已测', cls: 'num' },
          { key: 'pass', label: 'PASS', cls: 'num' },
          { key: 'fail', label: 'FAIL', cls: 'num' },
          { key: 'bar', label: '进度', html: (v, r) =>
            DataTable.miniBar(r.plan ? r.tested / r.plan : 0) }
        ], WorkOrder.processWithOrt(wo.model || wo.pn).map(st => {
          const a = actual[st] || { tested: 0, pass: 0, fail: 0 };
          return { st: st + ((wo.plan || {})[st] === undefined ? '（旁路）' : ''),
                   plan: (wo.plan || {})[st] || 0,
                   tested: a.tested, pass: a.pass, fail: a.fail };
        })) +
        '<div class="section-title">按日统计</div>' +
        (dayRows.length
          ? DataTable.build([
              { key: 'day', label: '日期' },
              { key: 'tested', label: '已测', cls: 'num' },
              { key: 'pass', label: 'PASS', cls: 'num' },
              { key: 'fail', label: 'FAIL', cls: 'num' }
            ], dayRows)
          : '<div class="empty-tip">暂无记录</div>') +
        '<div class="section-title">SN 明细（前 300 条）</div>' +
        (recs.length
          ? DataTable.build([
              { key: 'sn', label: 'SN', cls: 'col-sn' },
              { key: 'station', label: '工站' },
              { key: 'result', label: '结果', html: v =>
                '<span class="pill ' + L.resultPill(v) + '">' + Util.esc(L.result(v)) + '</span>' },
              { key: 'slotIndex', label: '位号', fmt: v => v == null ? '--' : ('位' + (v + 1)) },
              { key: 'time', label: '时间', fmt: v => Util.fmtFull(v) },
              { key: 'errCode', label: '错误码', fmt: v => v || '--' }
            ], recs.slice().sort((a, b) => (b.time || 0) - (a.time || 0)).slice(0, 300))
          : '<div class="empty-tip">暂无记录</div>'),
      footer: '<button class="btn" data-mclose="1">关闭</button>',
      size: 'wide'
    });
  }

  async function closeWo(id) {
    const wo = (App.workOrders || []).filter(w => w.id === id)[0];
    if (!wo) return;
    const recs = (App.records || []).filter(r => r.woId === wo.id);
    const actual = WorkOrder.actualOf(wo, recs);
    const chk = WorkOrder.checkClose(wo, actual, recs);
    if (!chk.ok) {
      Toast.warn('不满足结单条件：' + chk.issues.join('；'), '无法结单');
      return;
    }
    const by = await Modal.prompt({
      title: '结单确认', text: '请输入结单确认人',
      value: LocalStore.get('lastOperator', ''),
      hint: '⚠️ 结单会把该工单涉及的盘位归档后复位（清空 SN/结果），' +
            '物理状态（损坏/维护）保留。这一步是破坏性操作，可用「反结单」撤销状态但不会恢复盘位数据。'
    });
    if (by == null) return;
    LocalStore.set('lastOperator', by);

    // 归档 + 复位
    const involved = Array.from(App.slots.values()).filter(s => s.woNo === wo.no);
    const arcs = WorkOrder.buildArchives(wo, involved);
    for (const a of arcs) await Repo.put('archives', a);
    if (involved.length) {
      const reset = WorkOrder.resetSlots(involved);
      await App.saveSlots(reset);
    }
    WorkOrder.close(wo, by, '');
    await save(App.workOrders);
    App.invalidate();
    await App.ensureRecords('records');
    render();
    Toast.ok('已结单，归档 ' + arcs.length + ' 组，复位 ' + involved.length + ' 个盘位');
  }

  function bind() {
    Dom.delegate('woBody', 'click', '[data-wo-accept]', async (e, el) => {
      const wo = (App.workOrders || []).filter(w => w.id === el.dataset.woAccept)[0];
      if (!wo) return;
      const by = await Modal.prompt({ title: '接单', text: '请输入接单人',
        value: LocalStore.get('lastOperator', '') });
      if (by == null) return;
      LocalStore.set('lastOperator', by);
      WorkOrder.accept(wo, by);
      await save(App.workOrders);
      render();
      Toast.ok('已接单');
    });

    Dom.delegate('woBody', 'click', '[data-wo-start]', async (e, el) => {
      const wo = (App.workOrders || []).filter(w => w.id === el.dataset.woStart)[0];
      if (!wo) return;
      WorkOrder.start(wo);
      await save(App.workOrders);
      render();
      Toast.ok('已开始生产');
    });

    Dom.delegate('woBody', 'click', '[data-wo-close]', (e, el) => closeWo(el.dataset.woClose));
    Dom.delegate('woBody', 'click', '[data-wo-detail]', (e, el) => openDetail(el.dataset.woDetail));

    Dom.delegate('woBody', 'click', '[data-wo-reopen]', async (e, el) => {
      const wo = (App.workOrders || []).filter(w => w.id === el.dataset.woReopen)[0];
      if (!wo) return;
      const ok = await Modal.confirm({
        title: '反结单',
        html: '将把工单 <b>' + Util.esc(wo.no) + '</b> 恢复为「生产中」。<br><br>' +
              '注意：结单时已复位并归档的盘位数据<b>不会被恢复</b>，' +
              '该工单的工序进度将按剩余记录重新计算。',
        okText: '反结单', danger: true
      });
      if (!ok) return;
      WorkOrder.reopen(wo);
      await save(App.workOrders);
      render();
      Toast.ok('已反结单');
    });

    Dom.delegate('woBody', 'click', '[data-wo-del]', async (e, el) => {
      const wo = (App.workOrders || []).filter(w => w.id === el.dataset.woDel)[0];
      if (!wo) return;
      if (wo.status === 'closed') { Toast.warn('已结单的工单不可删除'); return; }
      const ok = await Modal.confirm({
        title: '删除工单', text: '确定删除「' + wo.no + '」？该操作不可撤销。',
        okText: '删除', danger: true
      });
      if (!ok) return;
      App.state.workOrders = App.workOrders.filter(w => w.id !== wo.id);
      await Repo.remove('workorders', wo.id);
      render();
      Toast.ok('已删除');
    });

    Dom.delegate('woBody', 'click', '#btnWoNew', openNew);

    Dom.delegate('woBody', 'click', '#btnWoExport', () => {
      const list = App.workOrders || [];
      if (!list.length) { Toast.warn('暂无工单'); return; }
      const rows = list.map(wo => [
        wo.no, wo.orderNo, wo.pn, wo.model, wo.qty, L.woState(wo.status),
        WorkOrder.processWithOrt(wo.model || wo.pn).join(' > '),
        wo.acceptedBy, wo.acceptedAt ? Util.fmtFull(wo.acceptedAt) : '',
        wo.closedBy, wo.closedAt ? Util.fmtFull(wo.closedAt) : '',
        wo.closeNote, Util.fmtFull(wo.createdAt)
      ]);
      Util.download('工单导出_' + Util.todayKey() + '.csv', Util.toCsv(
        ['工单号', '订单号', '料号', '机型', '生产数量', '状态', '工序链',
         '接单人', '接单时间', '结单确认人', '结单时间', '结单备注', '创建时间'], rows));
      Toast.ok('已导出 ' + rows.length + ' 条');
    });
  }

  return { render, bind };
})();

   src/views/log.js

/* ============================================================================
   日志分析 —— 关键词扫描、高亮、定位原始行、规则可配置
   ============================================================================ */

const ViewLog = (() => {

  let _cur = null;      // 当前扫描结果
  let _text = '';       // 当前日志正文

  async function render() {
    await App.ensureRecords('logindex');
    const idx = App.logindex || [];
    const rules = Highlight.rules(App.cfg);

    Dom.html('logBody',
      '<div class="toolbar">' +
        '<span class="title">日志分析</span>' +
        '<select class="form-select" id="logPick" style="width:380px">' +
          '<option value="">— 选择已拉取的日志文件 —</option>' +
          idx.map(l => '<option value="' + Util.esc(l.path) + '">' +
            Util.esc(l.station + ' · ' + l.name) + '</option>').join('') +
        '</select>' +
        '<button class="btn" id="btnLogAnalyze">分析</button>' +
        '<button class="btn" id="btnLogRules">关键词规则 (' + rules.length + ')</button>' +
        '<span class="spacer" style="flex:1"></span>' +
        '<button class="btn" id="btnLogExport">导出</button>' +
      '</div>' +

      '<div class="note">' +
        '可直接把日志文本粘贴到下面的输入框分析，无需先接入数据源。' +
        '关键词规则可在「关键词规则」里配置 —— 每行一条 <code>名称 | 正则</code>，清空即恢复默认。' +
      '</div>' +

      '<div class="form-group" style="margin-bottom:12px">' +
        '<label class="form-label">日志正文（粘贴或从上方选择文件）</label>' +
        '<textarea class="form-textarea" id="logInput" style="min-height:150px" ' +
          'placeholder="把测试日志粘贴到这里，然后点「分析」"></textarea>' +
      '</div>' +

      '<div id="logStat"></div>' +
      '<div id="logHits"></div>' +
      '<div id="logContentBox"></div>'
    );
  }

  function analyze(text, sourceName) {
    _text = text || '';
    if (!_text.trim()) { Toast.warn('日志内容为空'); return; }
    const r = Highlight.scan(App.cfg, _text, 800);
    _cur = r;

    const summaryRows = Object.keys(r.summary).map(k => {
      const rule = Highlight.rules(App.cfg).filter(x => x.key === k)[0] || {};
      return { key: k, name: rule.name || k, count: r.summary[k] };
    }).sort((a, b) => b.count - a.count);

    Dom.html('logStat',
      '<div class="cards">' +
        '<div class="card"><div class="lbl">日志行数</div>' +
          '<div class="val">' + Util.num(r.lineCount) + '</div></div>' +
        '<div class="card"><div class="lbl">命中行数</div>' +
          '<div class="val" style="color:var(--warn)">' + Util.num(r.total) + '</div>' +
          '<div class="sub">' + (r.lineCount ? (r.total / r.lineCount * 100).toFixed(1) : 0) + '% 的行命中关键词</div></div>' +
        (summaryRows.slice(0, 3).map(x =>
          '<div class="card"><div class="lbl">' + Util.esc(x.name) + '</div>' +
          '<div class="val">' + Util.num(x.count) + '</div></div>').join('')) +
      '</div>' +
      (sourceName ? '<div class="hint">来源：' + Util.esc(sourceName) + '</div>' : '')
    );

    Dom.html('logHits',
      '<div class="section-title">命中明细' +
        '<span class="note-inline">点击行号可定位到原文</span></div>' +
      Highlight.hitsHtml(r.hits));

    Dom.html('logContentBox',
      '<div class="section-title">原文（高亮）</div>' +
      '<div class="log-view" id="logContent">' + Highlight.render(App.cfg, _text) + '</div>'
    );
  }

  /* 关键词规则编辑 */
  async function editRules() {
    const cur = (App.cfg.woKeywordRules || []);
    const text = cur.length
      ? cur.map(r => r.name + ' | ' + r.re).join('\n')
      : Highlight.DEFAULT_RULES.map(r => r.name + ' | ' + r.re).join('\n');

    Modal.open({
      title: '关键词规则',
      size: 'wide',
      body:
        '<div class="hint">每行一条，格式：<code>名称 | 正则</code>。' +
        '留空保存即恢复内置默认规则。正则语法错误的那一行会被跳过，不影响其它规则。</div>' +
        '<textarea class="form-textarea" id="kwRules" style="min-height:280px">' +
          Util.esc(text) + '</textarea>' +
        '<div class="section-title">内置默认规则</div>' +
        DataTable.build([
          { key: 'key', label: '标识' },
          { key: 'name', label: '名称' },
          { key: 're', label: '正则', cls: 'col-sn' }
        ], Highlight.DEFAULT_RULES),
      footer: '<button class="btn" data-mclose="1">取消</button>' +
              '<button class="btn warn" id="kwReset">恢复默认</button>' +
              '<button class="btn primary" id="kwSave">保存</button>',
      onMount(h) {
        h.el.addEventListener('click', e => {
          if (e.target.closest('#kwReset')) {
            h.query('#kwRules').value = Highlight.DEFAULT_RULES.map(r => r.name + ' | ' + r.re).join('\n');
            return;
          }
          if (!e.target.closest('#kwSave')) return;
          const lines = h.query('#kwRules').value.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
          const bad = [];
          const rules = [];
          lines.forEach((ln, i) => {
            const p = ln.split('|');
            if (p.length < 2) { bad.push('第 ' + (i + 1) + ' 行格式不对'); return; }
            const name = p[0].trim();
            const re = p.slice(1).join('|').trim();
            try { new RegExp(re, 'i'); } catch (err) { bad.push('第 ' + (i + 1) + ' 行正则非法'); return; }
            rules.push({ key: 'K' + i, name, re });
          });
          if (bad.length) { Toast.warn(bad.slice(0, 3).join('；')); return; }
          App.cfg.woKeywordRules = rules;
          LocalStore.save();
          h.close();
          render();
          if (_text) analyze(_text);
          Toast.ok('已保存 ' + rules.length + ' 条规则');
        });
      }
    });
  }

  function exportResult() {
    if (!_cur) { Toast.warn('请先分析日志'); return; }
    const rows = _cur.hits.map(h => [h.line, h.name, h.key, h.text]);
    Util.download('日志分析_' + Util.tsTag() + '.csv', Util.toCsv(
      ['行号', '关键词', '标识', '内容'], rows));
    Toast.ok('已导出 ' + rows.length + ' 条命中');
  }

  function bind() {
    Dom.delegate('logBody', 'click', '#btnLogAnalyze', () => {
      analyze(document.getElementById('logInput').value, '手工粘贴');
    });

    Dom.delegate('logBody', 'change', '#logPick', async (e, el) => {
      const path = el.value;
      if (!path) return;
      const rec = (App.logindex || []).filter(l => l.path === path)[0];
      /* 日志正文需要从数据源读取；当前未接入时给出提示并展示索引里的摘要 */
      Toast.info('日志正文需从数据源读取。已接入 SSH / FTP / 本地目录后可直接拉取全文。');
      if (rec) {
        const stub = '（演示内容）日志索引：' + rec.name + '\n' +
          '工站：' + rec.station + '\n' +
          '大小：' + Util.bytes(rec.size) + '\n' +
          '解析记录：' + rec.parsed + ' 条\n' +
          '关键词命中：' + Object.keys(rec.hits || {}).map(k => k + '=' + rec.hits[k]).join(', ') + '\n\n' +
          '接入真实数据源后，此处会显示日志全文并支持关键词高亮定位。';
        document.getElementById('logInput').value = stub;
        analyze(stub, rec.name);
      }
    });

    Dom.delegate('logBody', 'click', '#btnLogRules', editRules);
    Dom.delegate('logBody', 'click', '#btnLogExport', exportResult);

    /* 点击命中行 → 滚动到原文对应行 */
    Dom.delegate('logBody', 'click', '[data-log-line]', (e, el) => {
      const line = Number(el.dataset.logLine);
      const box = document.getElementById('logContent');
      if (!box) return;
      const lines = box.innerHTML.split('\n');
      if (line > 0 && line <= lines.length) {
        /* 高亮目标行：用等宽字号估算滚动位置 */
        const total = lines.length;
        box.scrollTop = (line / total) * box.scrollHeight - box.clientHeight / 3;
      }
    });
  }

  return { render, bind, analyze };
})();
