            };
            up.onerror = () => {
              if (settled) return;
              console.error('[Idb] 升级失败，将重建数据库');
              _recreate(resolve, reject, missing);
            };
            return;
          }

          if (missing.length) {
            _recreate(resolve, reject, missing);
            return;
          }

          _db = db;
          _db.onversionchange = () => { try { _db.close(); } catch (e) { } _db = null; };
          settled = true;
          resolve(_db);
        };

        req.onerror = () => {
          if (settled) return;
          settled = true;
          _openPromise = null;
          reject(req.error || new Error('IndexedDB 打开失败'));
        };

        setTimeout(() => {
          if (settled) return;
          settled = true;
          _openPromise = null;
          reject(new Error('IndexedDB 打开超时'));
        }, 3000);

      } catch (e) {
        _openPromise = null;
        reject(e);
      }
    });

    return _openPromise;
  }

  /* ---------- 事务封装 ---------- */
  function tx(storeNames, mode) {
    return open().then(db => db.transaction(storeNames, mode || 'readonly'));
  }
  /* 把 IDBRequest 包成 Promise */
  function req(request) {
    return new Promise((resolve, reject) => {
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  /* ---------- 单条操作 ---------- */
  async function get(store, key) {
    const t = await tx([store]);
    return req(t.objectStore(store).get(key));
  }
  async function put(store, value) {
    const t = await tx([store], 'readwrite');
    const r = await req(t.objectStore(store).put(value));
    return r;
  }
  async function del(store, key) {
    const t = await tx([store], 'readwrite');
    return req(t.objectStore(store).delete(key));
  }
  async function count(store) {
    const t = await tx([store]);
    return req(t.objectStore(store).count());
  }
  async function clear(store) {
    const t = await tx([store], 'readwrite');
    return req(t.objectStore(store).clear());
  }
  async function getAll(store, limit) {
    const t = await tx([store]);
    const os = t.objectStore(store);
    if (limit) {
      // 用游标限量，避免把整表读进内存
      return new Promise((resolve, reject) => {
        const out = [];
        const cr = os.openCursor();
        cr.onsuccess = () => {
          const c = cr.result;
          if (!c || out.length >= limit) return resolve(out);
          out.push(c.value);
          c.continue();
        };
        cr.onerror = () => reject(cr.error);
      });
    }
    return req(os.getAll());
  }

  /* ---------- 批量写 ----------
     12,737 个盘位逐个事务写会非常慢，必须走单事务 bulkPut。 */
  async function bulkPut(store, values, chunkSize) {
    const arr = values || [];
    if (!arr.length) return 0;
    const CH = chunkSize || 2000;
    let written = 0;
    for (let i = 0; i < arr.length; i += CH) {
      const slice = arr.slice(i, i + CH);
      const t = await tx([store], 'readwrite');
      const os = t.objectStore(store);
      await new Promise((resolve, reject) => {
        t.oncomplete = resolve;
        t.onerror = () => reject(t.error);
        t.onabort = () => reject(t.error || new Error('事务中止'));
        slice.forEach(v => { try { os.put(v); } catch (e) { /* 单条失败不中断整批 */ } });
      });
      written += slice.length;
    }
    return written;
  }

  /* ---------- 按索引查询 ----------
     filter 为 {index, value} 或 {index, lower, upper}（范围） */
  async function query(store, filter, opts) {
    const o = opts || {};
    const t = await tx([store]);
    const os = t.objectStore(store);
    let source = os;
    let range = null;

    if (filter && filter.index) {
      const ix = os.index(filter.index);
      source = ix;
      if (filter.lower !== undefined) {
        range = IDBKeyRange.bound(filter.lower, filter.upper, !!filter.lowerOpen, !!filter.upperOpen);
      } else if (filter.value !== undefined) {
        range = IDBKeyRange.only(filter.value);
      }
    }

    return new Promise((resolve, reject) => {
      const out = [];
      const cr = source.openCursor(range, o.desc ? 'prev' : 'next');
      cr.onsuccess = () => {
        const c = cr.result;
        if (!c) return resolve(out);
        if (!o.filter || o.filter(c.value)) {
          out.push(c.value);
          if (o.limit && out.length >= o.limit) return resolve(out);
        }
        c.continue();
      };
      cr.onerror = () => reject(cr.error);
    });
  }

  /* ---------- 幂等台账 ----------
     add() 在唯一索引冲突时会抛错 —— 正好用来拦截重复入库 */
  async function ledgerSeen(dedupKey) {
    const v = await get('ledger', dedupKey);
    return !!v;
  }
  async function ledgerMark(dedupKey, extra) {
    try {
      await put('ledger', Object.assign({ dedupKey, at: Date.now() }, extra || {}));
      return true;
    } catch (e) { return false; }
  }
  /* 批量标记，返回真正新增的键（已存在的不计入） */
  async function ledgerMarkMany(keys) {
    const fresh = [];
    const seen = await ledgerFilter(keys);
    keys.forEach(k => { if (!seen.has(k)) fresh.push(k); });
    if (fresh.length) {
      await bulkPut('ledger', fresh.map(k => ({ dedupKey: k, at: Date.now() })));
    }
    return fresh;
  }
  async function ledgerFilter(keys) {
    const set = new Set();
    const t = await tx(['ledger']);
    const os = t.objectStore('ledger');
    await new Promise(resolve => {
      const cr = os.openCursor();
      cr.onsuccess = () => {
        const c = cr.result;
        if (!c) return resolve();
        set.add(c.value.dedupKey);
        c.continue();
      };
      cr.onerror = () => resolve();
    });
    return new Set(keys.filter(k => set.has(k)));
  }

  /* ---------- meta 键值 ---------- */
  async function metaGet(k, d) {
    const v = await get('meta', k);
    return v ? v.v : d;
  }
  async function metaSet(k, v) {
    return put('meta', { k, v, at: Date.now() });
  }

  /* ---------- 容量估算 ---------- */
  async function estimate() {
    try {
      if (navigator.storage && navigator.storage.estimate) {
        const e = await navigator.storage.estimate();
        return { usage: e.usage || 0, quota: e.quota || 0,
                 usedPct: e.quota ? (e.usage / e.quota) : 0 };
      }
    } catch (e) { }
    return { usage: 0, quota: 0, usedPct: 0 };
  }

  async function clearAll() {
    const names = Object.keys(STORES);
    for (const n of names) { try { await clear(n); } catch (e) { } }
    return names.length;
  }

  function isOpen() { return !!_db; }

  return {
    available, open, isOpen,
    get, put, del, count, clear, getAll,
    bulkPut, query,
    ledgerSeen, ledgerMark, ledgerMarkMany, ledgerFilter,
    metaGet, metaSet,
    estimate, clearAll,
    STORES
  };
})();


/* ==========================================================================
   src/store/migrate.js
   ========================================================================== */
/* ============================================================================
   版本迁移
   ----------------------------------------------------------------------------
   RDIMM 的教训：它的 STORAGE_KEY 带版本号（..._v5），升级靠换键名，
   结果是老数据在新版里直接不可见（源码解析 §10.2）。
   这里改为「同键 + schemaVersion 字段 + 显式迁移函数」。

   新增版本时：
     1. 改 core/constants.js 的 SCHEMA_VERSION
     2. 在 MIGRATIONS 里加 n → n+1 的迁移
     3. 迁移必须是幂等的（重复执行不出错）
   ============================================================================ */

const Migrate = (() => {

  /* 配置层迁移链：键为「起始版本」，值为把该版本升到下一版的函数 */
  const MIGRATIONS = {
    /* 示例（暂无历史版本）：
       1: (cfg) => { cfg.newField = []; return cfg; } */
  };

  /* 配置层迁移 */
  function config(cfg) {
    if (!cfg) return cfg;
    let v = Number(cfg.schemaVersion || 0);
    const def = Schema.defaultConfig();
    if (!v) {
      // 无版本号 = 首次或极老存档，套用默认值兜底
      cfg.schemaVersion = SCHEMA_VERSION;
      return cfg;
    }
    let guard = 0;
    while (v < SCHEMA_VERSION && guard++ < 50) {
      const fn = MIGRATIONS[v];
      if (fn) {
        try { cfg = fn(cfg) || cfg; }
        catch (e) { console.error('[Migrate] 配置 v' + v + ' 迁移失败：', e); break; }
      }
      v++;
      cfg.schemaVersion = v;
    }
    // 迁移后补默认值（新增配置项对老存档生效）
    return cfg;
  }

  /* IndexedDB 结构迁移（由 Idb 的 onupgradeneeded 调用） */
  function onUpgrade(db, fromVersion, toVersion) {
    console.info('[Migrate] IndexedDB v' + fromVersion + ' → v' + toVersion);
    /* 目前只有 v1，无需结构迁移。
       将来加对象仓/索引时在这里按 fromVersion 分支处理。 */
  }

  return { config, onUpgrade, MIGRATIONS };
})();


/* ==========================================================================
   src/store/repository.js
   ========================================================================== */
/* ============================================================================
   存储门面（Repository）—— 上层只调这里，不感知底层后端
   ----------------------------------------------------------------------------
   后端选择顺序：
     0. SQLite  Python 本地服务     桌面版使用，失败时明确报错，不切换数据源
     1. Idb      IndexedDB         独立 HTML 首选，容量大、按索引查询
     2. Local    紧凑 localStorage  降级（file:// 下 Chrome 禁用 IDB 时）
     3. Memory   纯内存             兜底（localStorage 也写不进时）

   为什么需要降级：
     Chrome / Edge 在 file:// 协议下把页面当作不透明来源，IndexedDB 不可用。
     本项目现场部署可能是「双击 HTML」，因此必须有降级路径。

   生产建议：由 Python 桥接托管页面到 http://127.0.0.1:8770/，
            属安全上下文，IndexedDB 全功能可用。

   盘位压缩编码（Local 后端用）：
     cabinetId / serverId / boxId 都可由 (station, equipmentId) 经 Topology 推导，
     因此不必落盘 —— 这是把 12,737 条压进 localStorage 的关键。
     数组位: [state, sn, pn, woNo, result, errCode, startTime, retestRound]
   ============================================================================ */

const Repo = (() => {

  let _backend = null;          // 'idb' | 'local' | 'memory'
  let _ready = null;            // Promise
  let _stats = { slotsWritten: 0, writes: 0 };

  const LS_SLOTS = 'lava_test_slots_v1';
  const LS_TABLES = 'lava_test_tables_v1';
  const LOCAL_TABLE_CAP = 5000;    // 降级后端下每张表的条数上限

  /* 内存镜像：降级后端与读缓存共用。
     key = slotKey → slot 对象（仅存非空盘位；空盘位不占内存不落盘） */
  const _slotMem = new Map();
  const _tableMem = {};            // store 名 → 数组

  /* ==========================================================================
     后端探测与初始化
     ========================================================================== */
  function init() {
    if (_ready) return _ready;
    _ready = (async () => {
      if (Sqlite.enabled()) {
        await Sqlite.call('info');
        _backend = 'sqlite';
        console.info('[Repo] 存储后端：SQLite');
        return _backend;
      }
      const hasIdb = await Idb.available();
      if (hasIdb) {
        try {
          await Idb.open();
          _backend = 'idb';
          console.info('[Repo] 存储后端：IndexedDB');
          return _backend;
        } catch (e) {
          console.warn('[Repo] IndexedDB 打开失败，降级：', e.message);
        }
      }
      if (LocalStore.available()) {
        _backend = 'local';
        loadLocalSlots();
        loadLocalTables();
        console.warn('[Repo] 存储后端：紧凑 localStorage（降级模式）');
        console.warn('       → 建议由桥接服务托管页面（http://127.0.0.1:8770/）以获得完整容量');
      } else {
        _backend = 'memory';
        console.warn('[Repo] 存储后端：内存（刷新即失，请及时导出备份）');
      }
      return _backend;
    })();
    return _ready;
  }

  function backend() { return _backend || 'uninit'; }
  function isDegraded() { return _backend === 'local' || _backend === 'memory'; }
  function backendLabel() {
    return { sqlite: 'SQLite（本地数据库）', idb: 'IndexedDB（完整）', local: '本地存储（降级）', memory: '内存（不持久）', uninit: '未初始化' }[_backend] || '未知';
  }

  /* ==========================================================================
     Local 后端：盘位紧凑读写
     ========================================================================== */
  /* 盘位对象 → 紧凑数组 */
  function packSlot(s) {
    return [
      s.state || 'empty',
      s.sn || '',
      s.pn || '',
      s.woNo || '',
      s.result || '',
      s.errCode || '',
      s.startTime || 0,
      s.retestRound || 0,
      s.source || '',
      s.endTime || 0
    ];
  }
  /* 紧凑数组 → 盘位对象（归属字段由 Topology 反推） */
  function unpackSlot(key, arr) {
    const p = Schema.parseSlotKey(key);
    const eqs = Topology.all(LocalStore.load()).stationsMap[p.station] || [];
    let eq = null;
    for (let i = 0; i < eqs.length; i++) { if (eqs[i].id === p.equipmentId) { eq = eqs[i]; break; } }
    return {
      key,
      station: p.station,
      equipmentId: p.equipmentId,
      slotIndex: p.slotIndex,
      cabinetId: eq ? eq.cabinetId : '',
      serverId: eq ? eq.serverId : '',
      boxId: eq ? eq.boxId : '',
      state: arr[0] || 'empty',
      sn: arr[1] || '',
      pn: arr[2] || '',
      model: '',                     // 可由 PN 经 MatchEngine 推导，不落盘
      woNo: arr[3] || '',
      lot: '',
      result: arr[4] || '',
      errCode: arr[5] || '',
      verdict: '',
      confirmed: undefined,
      startTime: arr[6] || null,
      endTime: arr[9] || null,
      cycleMs: null,
      retestRound: arr[7] || 0,
      source: arr[8] || '',
      updatedAt: Date.now()
    };
  }

  function loadLocalSlots() {
    try {
      const raw = localStorage.getItem(LS_SLOTS);
      if (!raw) return;
      const obj = JSON.parse(raw);
      Object.keys(obj).forEach(k => _slotMem.set(k, unpackSlot(k, obj[k])));
      console.info('[Repo] 已载入 ' + _slotMem.size.toLocaleString() + ' 个非空盘位');
    } catch (e) {
      console.error('[Repo] 盘位数据载入失败：', e);
    }
  }
  function saveLocalSlots() {
    if (_backend !== 'local') return { ok: false, reason: 'not-local' };
    try {
      const obj = {};
      _slotMem.forEach((v, k) => { obj[k] = packSlot(v); });
      localStorage.setItem(LS_SLOTS, JSON.stringify(obj));
      return { ok: true, count: _slotMem.size };
    } catch (e) {
      const isQuota = e && (e.name === 'QuotaExceededError' || e.code === 22);
      if (isQuota) {
        console.error('[Repo] 盘位写入超出配额');
        if (typeof Toast !== 'undefined') {
          Toast.error('盘位数据超出浏览器存储配额。请到「导出中心」备份 JSON，并考虑改用桥接托管模式。');
        }
        return { ok: false, reason: 'quota' };
      }
      return { ok: false, reason: 'error', error: e };
    }
  }
  const saveLocalSlotsSoon = Util.debounce(saveLocalSlots, 800);

  function loadLocalTables() {
    try {
      const raw = localStorage.getItem(LS_TABLES);
      if (!raw) return;
      const obj = JSON.parse(raw);
      Object.keys(obj).forEach(k => { _tableMem[k] = obj[k] || []; });
    } catch (e) {
      console.error('[Repo] 表数据载入失败：', e);
    }
  }
  const saveLocalTablesSoon = Util.debounce(function () {
    if (_backend !== 'local') return;
    try { localStorage.setItem(LS_TABLES, JSON.stringify(_tableMem)); }
    catch (e) {
      const isQuota = e && (e.name === 'QuotaExceededError' || e.code === 22);
      if (isQuota && typeof Toast !== 'undefined') {
        Toast.error('记录数据超出配额，请导出备份后清理旧记录。');
      }
    }
  }, 800);

  /* ==========================================================================
     盘位读写（统一接口）
     ========================================================================== */

  /* 批量读取指定 key 的盘位。返回 Map<key, slot>（只含存在的） */
  async function getSlotsByKeys(keys) {
    await init();
    const out = new Map();
    if (!keys || !keys.length) return out;
    if (_backend === 'sqlite') {
      (await Sqlite.get('slots', keys)).forEach(s => out.set(s.key, s));
      return out;
    }

    if (_backend === 'idb') {
      // 分块读，避免单个事务过大
      const CH = 3000;
      for (let i = 0; i < keys.length; i += CH) {
        const slice = keys.slice(i, i + CH);
        const t = await Idb.open().then(db => db.transaction(['slots']));
        const os = t.objectStore('slots');
        await new Promise(resolve => {
          t.oncomplete = resolve;
          t.onerror = resolve;
          slice.forEach(k => {
            const r = os.get(k);
            r.onsuccess = () => { if (r.result) out.set(k, r.result); };
          });
        });
      }
      return out;
    }
    keys.forEach(k => { const v = _slotMem.get(k); if (v) out.set(k, v); });
    return out;
  }

  async function getAllSlots() {
    await init();
    if (_backend === 'sqlite') return Sqlite.query('slots');
    if (_backend === 'idb') return Idb.getAll('slots');
    return Array.from(_slotMem.values());
  }

  /* 按工站读盘位（IDB 走索引，降级走内存过滤） */
  async function getSlotsByStation(station) {
    await init();
    if (_backend === 'sqlite') return Sqlite.query('slots', { index: 'station', value: station });
    if (_backend === 'idb') {
      return Idb.query('slots', { index: 'station', value: station });
    }
    const out = [];
    _slotMem.forEach(v => { if (v.station === station) out.push(v); });
    return out;
  }

  /* 批量写盘位。传入的是完整 slot 对象数组 */
  async function putSlots(slots) {
    await init();
    const arr = (slots || []).filter(Boolean);
    if (!arr.length) return 0;
    _stats.writes++;

    arr.forEach(s => { if (!s.updatedAt) s.updatedAt = Date.now(); });
    if (_backend === 'sqlite') return Sqlite.putMany('slots', arr);

    if (_backend === 'idb') {
      return Idb.bulkPut('slots', arr);
    }
    // 降级：空盘位从内存移除（省空间），非空盘位写入
    arr.forEach(s => {
      if (s.state === 'empty' && !s.sn) _slotMem.delete(s.key);
      else _slotMem.set(s.key, s);
    });
    _stats.slotsWritten += arr.length;
    saveLocalSlotsSoon();
    return arr.length;
  }

  /* 清空所有盘位（复位用） */
  async function clearSlots() {
    await init();
    if (_backend === 'sqlite') return Sqlite.call('clear', 'slots');
    if (_backend === 'idb') return Idb.clear('slots');
    _slotMem.clear();
    saveLocalSlotsSoon();
    return 0;
  }

  /* 盘位统计：由 Topology 的容量减去非空盘位，得空位数 */
  async function slotCounts() {
    await init();
    if (_backend === 'sqlite') return { occupied: await Sqlite.call('count', 'slots') };
    if (_backend === 'idb') {
      return { occupied: await Idb.count('slots') };
    }
    return { occupied: _slotMem.size };
  }

  /* ==========================================================================
     通用表读写（records / bad / error / judgements / archives / logindex）
     ========================================================================== */
  const KEY_PATH = {
    slots: 'key', ledger: 'dedupKey', meta: 'k',
    records: 'dedupKey', bad: 'id', error: 'id', judgements: 'id',
    archives: 'id', workorders: 'id', devices: 'id', logindex: 'id', rawfiles: 'path'
  };

  async function put(store, rec) {
    await init();
    if (_backend === 'sqlite') {
      await Sqlite.putMany(store, [rec]);
      return rec[KEY_PATH[store] || 'id'];
    }
    if (_backend === 'idb') return Idb.put(store, rec);
    const kp = KEY_PATH[store] || 'id';
    const list = _tableMem[store] = _tableMem[store] || [];
    const i = list.findIndex(x => x[kp] === rec[kp]);
    if (i >= 0) list[i] = rec; else list.unshift(rec);
    if (list.length > LOCAL_TABLE_CAP) list.length = LOCAL_TABLE_CAP;
    saveLocalTablesSoon();
    return rec[kp];
  }

  async function putMany(store, recs) {
    await init();
    const arr = recs || [];
    if (!arr.length) return 0;
    if (_backend === 'sqlite') return Sqlite.putMany(store, arr);
    if (_backend === 'idb') return Idb.bulkPut(store, arr);
    const kp = KEY_PATH[store] || 'id';
    const list = _tableMem[store] = _tableMem[store] || [];
    const idx = new Map();
    list.forEach((x, i) => idx.set(x[kp], i));
    arr.forEach(r => {
      const i = idx.get(r[kp]);
      if (i != null) list[i] = r; else { list.unshift(r); idx.set(r[kp], list.length - 1); }
    });
    if (list.length > LOCAL_TABLE_CAP) list.length = LOCAL_TABLE_CAP;
    saveLocalTablesSoon();
    return arr.length;
  }

  async function query(store, filter, opts) {
    await init();
    if (_backend === 'sqlite') return Sqlite.query(store, filter, opts);
    if (_backend === 'idb') {
      try {
        return await Idb.query(store, filter, opts);
      } catch (e) {
        // 对象仓缺失不该让整个视图崩掉 —— 记下来，返回空集，界面照常渲染
        if (e && /object store/i.test(e.message || '')) {
          console.error('[Repo] 对象仓「' + store + '」不存在：', e.message);
          return [];
        }
        throw e;
      }
    }
    let list = (_tableMem[store] || []).slice();
    if (filter && filter.where) {
      list = list.filter(filter.where);
    } else if (filter && filter.index && filter.value !== undefined) {
      list = list.filter(x => x[filter.index] === filter.value);
    }
    if (filter && filter.from != null) {
      list = list.filter(x => (x[filter.index || 'time'] || 0) >= filter.from);
    }
    if (opts && opts.desc) {
      const f = (opts.sortBy || filter && filter.index || 'time');
      list.sort((a, b) => (b[f] || 0) - (a[f] || 0));
    }
    if (opts && opts.limit) list = list.slice(0, opts.limit);
    return list;
  }

  async function count(store, where) {
    await init();
    if (_backend === 'sqlite') return where
      ? (await Sqlite.query(store, { where })).length : Sqlite.call('count', store);
    if (_backend === 'idb') {
      if (!where) return Idb.count(store);
      const all = await Idb.query(store, null, { filter: where });
      return all.length;
    }
    const list = _tableMem[store] || [];
    return where ? list.filter(where).length : list.length;
  }

  async function remove(store, id) {
    await init();
    if (_backend === 'sqlite') return Sqlite.keysAction('delete', store, [id]);
    if (_backend === 'idb') return Idb.del(store, id);
    const kp = KEY_PATH[store] || 'id';
    const list = _tableMem[store] = _tableMem[store] || [];
    const i = list.findIndex(x => x[kp] === id);
    if (i >= 0) list.splice(i, 1);
    saveLocalTablesSoon();
    return i >= 0;
  }

  async function removeWhere(store, where) {
    await init();
    if (_backend === 'sqlite') {
      const hits = await Sqlite.query(store, { where });
      return Sqlite.keysAction('deleteMany', store, hits.map(h => h[KEY_PATH[store] || 'id']));
    }
    if (_backend === 'idb') {
      const hits = await Idb.query(store, null, { filter: where });
      for (const h of hits) {
        const kp = KEY_PATH[store] || 'id';
        await Idb.del(store, h[kp]);
      }
      return hits.length;
    }
    const list = _tableMem[store] = _tableMem[store] || [];
    const before = list.length;
    _tableMem[store] = list.filter(x => !where(x));
    saveLocalTablesSoon();
    return before - _tableMem[store].length;
  }

  async function clearTable(store) {
    await init();
    if (_backend === 'sqlite') return Sqlite.call('clear', store);
    if (_backend === 'idb') return Idb.clear(store);
    _tableMem[store] = [];
    saveLocalTablesSoon();
    return 0;
  }

  /* ==========================================================================
     幂等台账
     ========================================================================== */
  async function ledgerFilter(keys) {
    await init();
    if (!keys || !keys.length) return [];
    if (_backend === 'sqlite') return Sqlite.keysAction('ledgerFilter', 'ledger', keys);
    if (_backend === 'idb') {
      const seen = await Idb.ledgerFilter(keys);
      return keys.filter(k => seen.has(k));
    }
    const set = new Set((_tableMem.__ledger || []).map(x => x.dedupKey));
    return keys.filter(k => set.has(k));
  }
  async function ledgerMark(keys) {
    await init();
    const arr = Array.isArray(keys) ? keys : [keys];
    if (!arr.length) return 0;
    if (_backend === 'sqlite') return Sqlite.keysAction('ledgerMark', 'ledger', arr);
    if (_backend === 'idb') return (await Idb.ledgerMarkMany(arr)).length;
    const list = _tableMem.__ledger = _tableMem.__ledger || [];
    const set = new Set(list.map(x => x.dedupKey));
    let n = 0;
    arr.forEach(k => {
      if (set.has(k)) return;
      list.unshift({ dedupKey: k, at: Date.now() });
      set.add(k); n++;
    });
    if (list.length > LOCAL_TABLE_CAP * 4) list.length = LOCAL_TABLE_CAP * 4;
    saveLocalTablesSoon();
    return n;
  }

  /* ==========================================================================
     meta 键值
     ========================================================================== */
  async function metaGet(k, d) {
    await init();
    if (_backend === 'sqlite') {
      const rows = await Sqlite.get('meta', [k]);
      return rows.length ? rows[0].v : d;
    }
    if (_backend === 'idb') return Idb.metaGet(k, d);
    const list = _tableMem.__meta || [];
    const hit = list.filter(x => x.k === k)[0];
    return hit ? hit.v : d;
  }
  async function metaSet(k, v) {
    await init();
    if (_backend === 'sqlite') {
      await Sqlite.putMany('meta', [{ k, v, at: Date.now() }]);
      return v;
    }
    if (_backend === 'idb') return Idb.metaSet(k, v);
    const list = _tableMem.__meta = _tableMem.__meta || [];
    const hit = list.filter(x => x.k === k)[0];
    if (hit) hit.v = v; else list.unshift({ k, v, at: Date.now() });
    saveLocalTablesSoon();
    return v;
  }

  /* ==========================================================================
     容量与维护
     ========================================================================== */
  async function estimate() {
    await init();
    if (_backend === 'sqlite') return Sqlite.call('info');
    if (_backend === 'idb') return Idb.estimate();
    // 降级模式：汇报 localStorage 占用
    let used = 0;
    try {
      used = (localStorage.getItem(LS_SLOTS) || '').length * 2 +
             (localStorage.getItem(LS_TABLES) || '').length * 2 +
             LocalStore.size();
    } catch (e) { }
    return { usage: used, quota: 5 * 1024 * 1024, usedPct: used / (5 * 1024 * 1024) };
  }

  async function clearAll() {
    await init();
    if (_backend === 'sqlite') return Sqlite.call('clearAll');
    _slotMem.clear();
    Object.keys(_tableMem).forEach(k => { _tableMem[k] = []; });
    if (_backend === 'idb') await Idb.clearAll();
    try {
      localStorage.removeItem(LS_SLOTS);
      localStorage.removeItem(LS_TABLES);
    } catch (e) { }
    return true;
  }

  /* 立即落盘（关闭页面前调用） */
  function flush() {
    if (_backend === 'local') {
      saveLocalSlots();
      try { localStorage.setItem(LS_TABLES, JSON.stringify(_tableMem)); } catch (e) { }
    }
  }

  function stats() { return Util.clone(_stats); }

  return {
    init, backend, backendLabel, isDegraded, flush, stats,
    getSlotsByKeys, getAllSlots, getSlotsByStation, putSlots, clearSlots, slotCounts,
    put, putMany, query, count, remove, removeWhere, clearTable,
    ledgerFilter, ledgerMark, metaGet, metaSet,
    estimate, clearAll
  };
})();


/* ==========================================================================
   src/store/backup.js
   ========================================================================== */
/* ============================================================================
   备份与恢复
   ----------------------------------------------------------------------------
   RDIMM 的教训：它把「导出完整 JSON」当作唯一的可靠恢复手段，但 12,737 个
   盘位的裸 JSON 有数 MB，JSON.stringify 峰值内存高、单文件下载体验差。

   这里分三种粒度：
     1. 配置备份   只导规则/设置（几十 KB）—— 换电脑最快
     2. 状态快照   拓扑 + 非空盘位（约 1-2 MB）
     3. 全量备份   状态 + 记录表（可能数十 MB，导出前提示体积）
   ============================================================================ */

const Backup = (() => {

  const FORMAT = 'lava-test-backup';
  const FORMAT_VERSION = 1;

  /* 盘位对象压缩为数组。
     首列必须是 key（'station|equipmentId|slotIndex'）—— cabinetId/serverId/boxId
     都能由它经 Topology 推导，而 key 本身是恢复时的唯一定位依据。
     ⚠️ 不能靠「顺序对齐」重建 key：拓扑一改（如 FINAL 设备数变动）就会整体错位。 */
  const SLOT_COLS = ['key', 'state', 'sn', 'pn', 'woNo', 'result', 'errCode',
                     'startTime', 'endTime', 'retestRound', 'source'];

  function packSlots(slots) {
    return (slots || []).map(s => SLOT_COLS.map(c => s[c] == null ? '' : s[c]));
  }
  function unpackSlots(rows) {
    return (rows || []).map(r => {
      const o = {};
      SLOT_COLS.forEach((c, i) => {
        let v = r[i];
        if (v === '') v = null;
        o[c] = v;
      });
      o.state = o.state || 'empty';
      return o;
    });
  }

  /* --------------------------------------------------------------------------
     导出
       scope: 'config' | 'snapshot' | 'full'
     -------------------------------------------------------------------------- */
  async function exportData(scope, cfg, extra) {
    const s = scope || 'snapshot';
    const t0 = Date.now();

    const manifest = {
      format: FORMAT,
      formatVersion: FORMAT_VERSION,
      schemaVersion: SCHEMA_VERSION,
      app: APP_NAME,
      appVersion: APP_VERSION,
      scope: s,
      builtAt: Date.now(),
      builtAtText: Util.nowStr(),
      stationOverride: cfg.stationOverride || {},
      counts: {}
    };

    const out = { manifest };

    /* --- 配置层 --- */
    out.config = {
      stationOverride: cfg.stationOverride,
      defectRules: cfg.defectRules,
      errorCodeRules: cfg.errorCodeRules,
      matchRules: cfg.matchRules,
      pnPresets: cfg.pnPresets,
      fieldMapping: cfg.fieldMapping,
      fieldDefs: cfg.fieldDefs,
      channels: cfg.channels,
      scanRoots: cfg.scanRoots,
      parseRules: cfg.parseRules,
      settings: cfg.settings,
      ui: cfg.ui
    };

    if (s === 'config') {
      manifest.counts = { slots: 0, records: 0 };
      out.slotColumns = SLOT_COLS;
      out.slots = [];
      return finish(out, manifest, t0);
    }

    /* --- 盘位 --- */
    const allSlots = await Repo.getAllSlots();
    const nonEmpty = allSlots.filter(x => x.state && x.state !== 'empty');
    out.slotColumns = SLOT_COLS;
    out.slots = packSlots(nonEmpty);
    manifest.counts.slots = nonEmpty.length;
    manifest.counts.slotCapacity = Topology.all(cfg).totalSlots;

    /* --- 记录表 --- */
    if (s === 'full') {
      out.records    = await Repo.query('records', null, { limit: 200000 });
      out.bad        = await Repo.query('bad', null, { limit: 200000 });
      out.error      = await Repo.query('error', null, { limit: 200000 });
      out.judgements = await Repo.query('judgements', null, { limit: 200000 });
      out.archives   = await Repo.query('archives', null, { limit: 200000 });
      out.logindex   = await Repo.query('logindex', null, { limit: 200000 });
      out.workOrders = (extra && extra.workOrders) || [];
      manifest.counts.records    = out.records.length;
      manifest.counts.bad        = out.bad.length;
      manifest.counts.error      = out.error.length;
      manifest.counts.judgements = out.judgements.length;
      manifest.counts.workOrders = out.workOrders.length;
    } else {
      // 快照也带上工单与未确认不良，否则恢复后看不到待办
      out.workOrders = (extra && extra.workOrders) || [];
      out.bad = (await Repo.query('bad', null, { limit: 200000 })).filter(b => !b.confirmed);
      manifest.counts.workOrders = out.workOrders.length;
      manifest.counts.bad = out.bad.length;
    }

    manifest.elapsedMs = Date.now() - t0;
    return finish(out, manifest, t0);
  }

  function finish(obj, manifest, t0) {
    manifest.elapsedMs = Date.now() - t0;
    const text = JSON.stringify(obj, null, 0);
    return { json: text, manifest, size: text.length };
  }

  /* 文件名 */
  function filename(scope) {
    const tag = { config: '配置', snapshot: '快照', full: '全量' }[scope] || '备份';
    return 'lava_test_' + tag + '_' + Util.tsTag() + '.json';
  }

  /* 一键导出（含体积提示） */
  async function download(scope, cfg, extra) {
    const s = scope || 'snapshot';
    Toast.info('正在打包' + ({ config: '配置', snapshot: '状态快照', full: '全量备份' }[s]) + '…');
    // 让提示先渲染出来再做重活
    await new Promise(r => setTimeout(r, 50));
    try {
      const r = await exportData(s, cfg, extra);
      if (s === 'full' && r.size > 20 * 1024 * 1024) {
        const go = await Modal.confirm({
          title: '备份体积较大',
          html: '全量备份约 <b>' + Util.bytes(r.size) + '</b>，生成与下载可能较慢。<br>确定继续吗？',
          okText: '继续导出'
        });
        if (!go) return null;
      }
      Util.download(filename(s), r.json, 'application/json;charset=utf-8');
      Toast.ok('已导出 ' + Util.bytes(r.size) +
               '（盘位 ' + Util.num(r.manifest.counts.slots || 0) + ' 条）');
      return r;
    } catch (e) {
      console.error('[Backup] 导出失败：', e);
      Toast.error('导出失败：' + e.message);
      return null;
    }
  }

  /* --------------------------------------------------------------------------
     导入
       mode: 'replace' | 'merge'
         replace  清空现有数据后导入（默认）
         merge    按幂等键合并，不删除已有数据
     -------------------------------------------------------------------------- */
  async function importJson(text, mode, cfg) {
    let o;
    try { o = JSON.parse(text); }
    catch (e) { throw new Error('JSON 解析失败：' + e.message); }

    if (!o || o.manifest == null) throw new Error('不是 Lava_test 备份文件（缺少 manifest）');
    if (o.manifest.format && o.manifest.format !== FORMAT) {
      throw new Error('备份格式不匹配：' + o.manifest.format);
    }

    const m = o.manifest;
    const result = { slots: 0, config: false, records: 0, bad: 0, error: 0,
                     judgements: 0, workOrders: 0, warnings: [] };

    /* --- 配置 --- */
    if (o.config) {
      const keepUi = mode === 'merge';
      Object.keys(o.config).forEach(k => {
        if (k === 'ui' && keepUi) return;         // 合并时不覆盖当前界面偏好
        if (o.config[k] !== undefined) cfg[k] = Util.clone(o.config[k]);
      });
      result.config = true;
      // 拓扑可能因配置变化而改变，必须失效缓存
      Topology.invalidate();
    }

    /* --- 盘位 --- */
    if (Array.isArray(o.slots) && o.slots.length) {
      if (mode === 'replace') await Repo.clearSlots();

      const cols = o.slotColumns || SLOT_COLS;
      const rows = o.slots.map(r => {
        const obj = {};
        cols.forEach((c, i) => { obj[c] = (r[i] === '' ? null : r[i]); });
        return obj;
      });

      const topo = Topology.all(cfg);
      // 拓扑容量与备份不一致时给出警告，但不中断（仍按 key 精确恢复）
      if (m.counts && m.counts.slotCapacity && m.counts.slotCapacity !== topo.totalSlots) {
        result.warnings.push(
          '备份的盘位总容量（' + m.counts.slotCapacity + '）与当前拓扑（' + topo.totalSlots +
          '）不一致。盘位按 key 精确恢复，超出当前拓扑的条目会被跳过；' +
          '建议先应用备份中的工站配置再导入。');
      }

      const validKeys = new Set();
      const toWrite = [];
      rows.forEach(obj => {
        const key = obj.key;
        if (!key) return;
        const p = Schema.parseSlotKey(key);
        const eqs = topo.stationsMap[p.station];
        if (!eqs) { result.warnings.push('备份含未知工站 ' + p.station + '，已跳过'); return; }
        const eq = eqs.filter(e => e.id === p.equipmentId)[0];
        if (!eq || p.slotIndex >= eq.capacity) {
          result.warnings.push('备份含当前拓扑不存在的盘位 ' + key + '，已跳过');
          return;
        }
        validKeys.add(key);
        toWrite.push(Schema.newSlot(Object.assign({
          station: p.station, equipmentId: p.equipmentId, slotIndex: p.slotIndex
        }, obj)));
      });

      // 分块写，避免一次性构造上万个对象卡住主线程
      const CH = 3000;
      for (let i = 0; i < toWrite.length; i += CH) {
        await Repo.putSlots(toWrite.slice(i, i + CH));
      }
      result.slots = toWrite.length;
      result.skipped = rows.length - toWrite.length;
    } else if (mode === 'replace') {
      await Repo.clearSlots();
    }

    /* --- 记录表 --- */
    async function putTable(store, key, list) {
      if (!Array.isArray(list) || !list.length) return 0;
      if (mode === 'replace') await Repo.clearTable(store);
      let n = 0;
      const CH = 2000;
      for (let i = 0; i < list.length; i += CH) {
        n += await Repo.putMany(store, list.slice(i, i + CH));
      }
      return n;
    }
    result.records    = await putTable('records', null, o.records);
    result.bad        = await putTable('bad', null, o.bad);
    result.error      = await putTable('error', null, o.error);
    result.judgements = await putTable('judgements', null, o.judgements);
    if (o.archives)   await putTable('archives', null, o.archives);
    if (o.logindex)   await putTable('logindex', null, o.logindex);

    if (Array.isArray(o.workOrders)) {
      result.workOrders = o.workOrders.length;
    }

    result.manifest = m;
    return result;
  }

  /* 从文件读入并导入 */
  function pickAndImport(cfg, mode) {
    return new Promise(resolve => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json,application/json';
      input.onchange = async () => {
        const f = input.files && input.files[0];
        if (!f) return resolve(null);
        try {
          Toast.info('正在读取 ' + f.name + '（' + Util.bytes(f.size) + '）…');
          const text = await f.text();
          const r = await importJson(text, mode || 'replace', cfg);
          resolve(r);
        } catch (e) {
          console.error('[Backup] 导入失败：', e);
          Toast.error('导入失败：' + e.message);
          resolve(null);
        }
      };
      input.click();
    });
  }

  return {
    FORMAT, FORMAT_VERSION, SLOT_COLS,
    exportData, download, importJson, pickAndImport, filename,
    packSlots, unpackSlots
  };
})();


/* ==========================================================================
   src/domain/topology.js
   ========================================================================== */
/* ============================================================================
   领域拓扑 —— 工站 → 机柜/设备 → 服务器/箱体 → 盘位
   ----------------------------------------------------------------------------
   纯函数，不碰 DOM，不碰存储。给定工站配置，产出确定的物理拓扑。

   盘位总数（真实车间配置）：
     ICT        1 × 1    =     1
     FUNCTION  12 × 16   =   192   (2 机柜)
     BIST      14 × 256  = 3,584
     ESS       12 × 128  = 1,536
     FINAL    400 × 16   = 6,400   (45 机柜)
     ORT       32 × 16   =   512   (4 机柜)
     CUS       32 × 16   =   512   (4 机柜)
                          ─────────
                          12,737
   ============================================================================ */

const Topology = (() => {

  /* 应用配置覆盖：现场改设备数/周期不必改代码 */
  function effectiveStations(cfg) {
    const ov = (cfg && cfg.stationOverride) || {};
    return STATIONS.map(s => {
      const o = ov[s.key];
      if (!o) return s;
      const merged = Object.assign({}, s);
      if (o.count != null)     merged.count = Math.max(0, Number(o.count));
      if (o.cycleMin != null)  merged.cycleMin = Math.max(0.001, Number(o.cycleMin));
      if (o.capacity != null)  merged.capacity = Math.max(1, Number(o.capacity));
      merged.overridden = true;
      return merged;
    });
  }
  function stationOf(key, cfg) {
    return effectiveStations(cfg).filter(s => s.key === key)[0] || null;
  }

  function cabPrefix(key) { return 'CAB-' + STATION_CODE[key]; }
  function srvPrefix(key) { return 'SRV-' + STATION_CODE[key]; }
  function flatPrefix(key) {
    if (key === 'ICT')  return 'ICT';
    if (key === 'BIST') return 'OVEN-B';
    return 'ESS-E';
  }

  /* --------------------------------------------------------------------------
     生成一个工站的设备清单
     返回 Equipment[]：
       { id, station, capacity, layout,
         cabinetId?, serverId?, boxId?,          // 三种归属，按 layout 取用
         slotKeys: [...] }                       // 预生成盘位 key，避免重复拼接
     -------------------------------------------------------------------------- */
  function buildStation(station) {
    const out = [];
    const n = station.count;
    const padW = n > 99 ? 3 : 2;

    if (station.layout === 'flat') {
      const pre = flatPrefix(station.key);
      for (let i = 1; i <= n; i++) {
        const id = pre + '-' + Util.pad(i, padW);
        const eq = {
          id, station: station.key, capacity: station.capacity,
          layout: 'flat', cabinetId: '', serverId: '', boxId: '',
          slotKeys: []
        };
        // 箱类设备（BIST/ESS）带箱号，供「同箱追溯」
        if (station.capacity >= 100) eq.boxId = id;
        for (let k = 0; k < station.capacity; k++) {
          eq.slotKeys.push(Schema.slotKey(station.key, id, k));
        }
        out.push(eq);
      }
      return out;
    }

    /* cabinet 布局：机柜（每柜 CAB_SIZE 台服务器）→ 服务器（DISK_PER_SRV 盘位） */
    const srvPre = srvPrefix(station.key);
    const cabPre = cabPrefix(station.key);
    for (let i = 1; i <= n; i++) {
      const ci = Math.floor((i - 1) / CAB_SIZE) + 1;
      const id = srvPre + '-' + Util.pad(i, padW);
      const eq = {
        id, station: station.key, capacity: station.capacity,
        layout: 'cabinet',
        cabinetId: cabPre + '-' + Util.pad(ci, 2),
        serverId: id,
        boxId: '',
        cabIndex: ci,
        slotKeys: []
      };
      for (let k = 0; k < station.capacity; k++) {
        eq.slotKeys.push(Schema.slotKey(station.key, id, k));
      }
      out.push(eq);
    }
    return out;
  }

  /* --------------------------------------------------------------------------
     拓扑来源
     ----------------------------------------------------------------------------
     有真实设备台账时用台账（设备编号 = 真实机柜号+位号），否则按工站配置合成。
     台账模式让看板上的编号与现场标号一致，桥接才能把巡检到的 IP 对应到设备。

     用模块级 _registry 而不是给每个函数加参数：Topology 的调用点遍布各视图
     （summary/cabinets/locate/siblings…），逐个传参既啰嗦又容易漏。
     -------------------------------------------------------------------------- */
  let _registry = null;
  let _cache = null;
  let _cacheKey = '';

  function setRegistry(devices) {
    _registry = (devices && devices.length) ? devices : null;
    invalidate();
  }
  function hasRegistry() { return !!_registry; }
  function registrySize() { return _registry ? _registry.length : 0; }

  function all(cfg) {
    const stations = effectiveStations(cfg);
    const stationKey = stations.map(s => s.key + ':' + s.count + ':' + s.capacity).join(',');
    // 台账模式下缓存键要含台账指纹，否则换了台账仍返回旧拓扑
    const key = (_registry
      ? 'reg:' + _registry.length + ':' + _registry.map(d => d.id).join(',').length + ':' +
        (_registry[0] ? _registry[0].id : '')
      : 'syn') + '|' + stationKey;
    if (_cache && _cacheKey === key) return _cache;

    if (_registry) {
      _cache = Registry.buildTopology(_registry, cfg);
    } else {
      const stationsMap = {};
      const equipment = [];
      let totalSlots = 0;
      stations.forEach(s => {
        const eqs = buildStation(s);
        stationsMap[s.key] = eqs;
        equipment.push.apply(equipment, eqs);
        totalSlots += eqs.length * s.capacity;
      });
      _cache = { stations, stationsMap, equipment, totalSlots, source: 'synthetic' };
    }
    _cacheKey = key;
    return _cache;
  }

  function invalidate() { _cache = null; _cacheKey = ''; }

  /* --------------------------------------------------------------------------
     机柜视图：把同一 cabinetId 的服务器聚在一起
     返回 [{ id, station, servers:[...] }]
     -------------------------------------------------------------------------- */
  function cabinets(cfg, stationKey) {
    const topo = all(cfg);
    const list = stationKey ? (topo.stationsMap[stationKey] || []) : topo.equipment;
    const byCab = {};
    list.forEach(eq => {
      if (!eq.cabinetId) return;
      (byCab[eq.cabinetId] = byCab[eq.cabinetId] || []).push(eq);
    });
    return Object.keys(byCab).sort().map(id => {
      const servers = byCab[id].sort((a, b) => a.id.localeCompare(b.id));
      return {
        id,
        station: servers[0].station,
        servers,
        slotCount: servers.reduce((a, s) => a + s.capacity, 0)
      };
    });
  }

  function cabinetCount(cfg, stationKey) {
    return cabinets(cfg, stationKey).length;
  }

  /* --------------------------------------------------------------------------
     定位：给定盘位 key 返回完整位置描述
     -------------------------------------------------------------------------- */
  function locate(cfg, slotKey) {
    const p = Schema.parseSlotKey(slotKey);
    const s = stationOf(p.station, cfg);
    if (!s) return null;
    const eqs = all(cfg).stationsMap[p.station] || [];
    const eq = eqs.filter(e => e.id === p.equipmentId)[0];
    if (!eq) return null;
    return {
      station: p.station, stationName: s.name, stationCn: s.cn,
      equipmentId: eq.id, equipment: eq,
      slotIndex: p.slotIndex,
      cabinetId: eq.cabinetId || '',
      serverId: eq.serverId || '',
      boxId: eq.boxId || '',
      // 人类可读的位置串
      label: [
        s.name,
        eq.cabinetId ? eq.cabinetId : '',
        eq.id,
        '位' + (p.slotIndex + 1)
      ].filter(Boolean).join(' · ')
    };
  }

  /* 反向：给定工站 + 设备 + 盘位序号，返回 key */
  function keyOf(station, equipmentId, slotIndex) {
    return Schema.slotKey(station, equipmentId, slotIndex);
  }

  /* 某台设备的盘位 key 列表 */
  function slotKeysOf(cfg, station, equipmentId) {
    const eqs = all(cfg).stationsMap[station] || [];
    const eq = eqs.filter(e => e.id === equipmentId)[0];
    return eq ? eq.slotKeys : [];
  }

  /* 某工站全部盘位 key */
  function stationSlotKeys(cfg, station) {
    const eqs = all(cfg).stationsMap[station] || [];
    const out = [];
    eqs.forEach(e => { for (let i = 0; i < e.capacity; i++) out.push(e.slotKeys[i]); });
    return out;
  }

  /* 同箱：返回同属一个箱体/机柜的全部盘位 key（用于连带判定）
     scope='box'   BIST/ESS 箱体
     scope='server' 单台服务器
     scope='cabinet' 整个机柜（9 台服务器） */
  function siblings(cfg, slotKey, scope) {
    const loc = locate(cfg, slotKey);
    if (!loc) return [];
    const s = scope || (loc.boxId ? 'box' : 'cabinet');
    if (s === 'server') return loc.equipment.slotKeys.slice();
    if (s === 'box')    return loc.equipment.slotKeys.slice();
    // cabinet：该柜下所有服务器
    const cabs = cabinets(cfg, loc.station);
    const cab = cabs.filter(c => c.id === loc.cabinetId)[0];
    if (!cab) return loc.equipment.slotKeys.slice();
    const out = [];
    cab.servers.forEach(sv => { for (let i = 0; i < sv.capacity; i++) out.push(sv.slotKeys[i]); });
    return out;
  }

  /* --------------------------------------------------------------------------
     汇总：拓扑层面的容量数字（不依赖运行时数据）
     -------------------------------------------------------------------------- */
  function summary(cfg) {
    const topo = all(cfg);
    return topo.stations.map(s => {
      const eqs = topo.stationsMap[s.key] || [];
      const online = eqs.length * s.capacity;
      const daily = s.cycleMin > 0 ? online * (1440 / s.cycleMin) : 0;
      const cabs = s.layout === 'cabinet' ? cabinetCount(cfg, s.key) : 0;
      return {
        station: s.key, name: s.name, cn: s.cn, color: s.color,
        layout: s.layout, unit: s.unit,
        eqCount: eqs.length, cabCount: cabs,
        capacityPerUnit: s.capacity, online,
        cycleMin: s.cycleMin, daily,
        sampling: s.sampling || null,
        bypass: !!s.bypass,
        note: s.note || ''
      };
    });
  }

  return {
    effectiveStations, stationOf,
    buildStation, all, invalidate,
    setRegistry, hasRegistry, registrySize,
    cabinets, cabinetCount,
    locate, keyOf, slotKeysOf, stationSlotKeys, siblings,
    summary,
    cabPrefix, srvPrefix, flatPrefix
  };
})();


/* ==========================================================================
   src/domain/registry.js
   ========================================================================== */
/* ============================================================================
   设备台账（Registry）—— 真实设备的身份与位置
   ----------------------------------------------------------------------------
   拓扑有两条来源，优先级：**真实台账 > 按工站配置合成**

     合成模式（Topology 现有逻辑）：设备叫 SRV-N-001，机柜叫 CAB-N-01，
       只是按「N 台服务器」这个数量生成的占位结构。
     台账模式（本模块）：设备叫 S35#-3（真实机柜号 + 柜内位号），
       带真实 IP 与型号 —— 现场看到的标号和看板上的一致。

   导入真实台账后应当切到台账模式，否则看板显示的编号现场对不上，
   桥接阶段也没法把巡检到的 IP 对应到具体设备。

   ⚠️ 台账里两类工站的物理形态不同：
        服务器类（FUNCTION/FINAL/ORT/CUS）→ 机柜号 + 柜内位号
        箱体类（BIST/ESS）              → 区域名 + 箱号
      设备 id 因此有两种构成方式，但对外统一成 {station, equipmentId}。 */

const Registry = (() => {

  const SERVER_STATIONS = ['FUNCTION', 'FINAL', 'ORT', 'CUS'];

  /* --------------------------------------------------------------------------
     设备 id 生成
       服务器类：S35#-3   （机柜号 + 柜内位号）
       箱体类：  BIST-61# （区域 + 箱号）
       都缺时退化为 工站-序号

     ⚠️ 台账的「服务器位置」列并不总是数字 —— 有时写的是工站名（'Function'）。
        直接拿来拼 id 会得到 S36#-Function 这种编号，而且同一柜内多行会重名。
        因此只有「看起来是位号」的值才用，否则回退到序号。
     -------------------------------------------------------------------------- */
  const POS_RE = /^\d{1,3}$/;
  function isPos(v) { return POS_RE.test(String(v || '').trim()); }

  function makeId(d, seq) {
    if (d.cabinet && isPos(d.pos)) return d.cabinet + '-' + Number(d.pos);
    if (d.zone && d.box) return d.zone + '-' + d.box;
    if (d.cabinet) return d.cabinet + '-' + (seq + 1);
    if (d.zone) return d.zone + '-' + (seq + 1);
    return (d.station || 'DEV') + '-' + String(seq + 1).padStart(3, '0');
  }

  /* --------------------------------------------------------------------------
     从 Ledger 解析结果生成设备台账
       parsed 为 Ledger.parse() 的返回值
       返回 { devices, stats, warnings }
     -------------------------------------------------------------------------- */
  /* 故障/维修/报废区 —— 这些设备不参与生产统计与排产 */
  const FAULTY_RE = /故障|维修|报废|停用|待修/;

  function fromLedger(parsed, opts) {
    const o = opts || {};
    const devices = [];
    const seen = new Set();
    const warnings = [];
    let faultyCount = 0;

    /* 序号兜底要**按柜（或按区域）独立计数**。
       台账的「服务器位置」列经常不是数字（写的是工站名 'Function'），
       这时只能退回序号；若跨柜累加，同一柜内会得到 S36#-13/S36#-14 这种跳号。 */
    const seqByGroup = {};

    (parsed.active || []).forEach((d, i) => {
      const groupKey = (d.station || '') + '|' + (d.cabinet || d.zone || '');
      seqByGroup[groupKey] = (seqByGroup[groupKey] || 0) + 1;

      const faulty = FAULTY_RE.test((d.zone || '') + ' ' + (d.cabinet || ''));
      if (faulty) { faultyCount++; if (o.skipFaulty !== false) return; }

      const rec = {
        id: makeId(d, seqByGroup[groupKey] - 1),
        station: d.station || '',
        cabinet: d.cabinet || '',
        zone: d.zone || '',
        pos: isPos(d.pos) ? String(Number(d.pos)) : '',
        posRaw: d.pos || '',
        box: d.box || '',
        ip: d.ip || d.ipAlt || '',
        ipAlt: d.ipAlt || '',
        model: d.model || '',
        borrowed: !!d.borrowed,
        faulty,
        // 台账里的原始行号，便于回溯核对
        srcRow: d.row,
        active: true
      };
      // id 冲突时加后缀（同一柜内位号重复等异常数据）
      let id = rec.id, k = 1;
      while (seen.has(id)) { id = rec.id + '_' + (++k); }
      seen.add(id);
      rec.id = id;
      devices.push(rec);
    });

    /* 校验 */
    const byStation = {};
    const ipOwner = {};
    const dupIps = [];
    devices.forEach(d => {
      byStation[d.station || '(未识别)'] = (byStation[d.station || '(未识别)'] || 0) + 1;
      if (!d.ip) return;
      if (ipOwner[d.ip]) dupIps.push({ ip: d.ip, a: ipOwner[d.ip].id, b: d.id });
      else ipOwner[d.ip] = d;
    });
    if (dupIps.length) warnings.push('有 ' + dupIps.length + ' 个 IP 被多台设备占用');
    const noIp = devices.filter(d => !d.ip).length;
    if (noIp) warnings.push('有 ' + noIp + ' 台设备没有 IP，无法接入');
    const noStation = devices.filter(d => !d.station).length;
    if (noStation) warnings.push('有 ' + noStation + ' 台设备未识别工站');
    if (faultyCount) {
      warnings.push('台账里有 ' + faultyCount + ' 台设备位于故障/维修区域，' +
        (o.skipFaulty !== false ? '已排除' : '已保留'));
    }
    const borrowedCount = devices.filter(d => d.borrowed).length;
    if (borrowedCount) warnings.push('其中 ' + borrowedCount + ' 台为借用设备（按在产处理）');

    return {
      devices,
      stats: {
        total: devices.length,
        byStation,
        ipCount: Object.keys(ipOwner).length,
        dupIps,
        noIp,
        noStation,
        cabinetCount: new Set(devices.map(d => d.cabinet).filter(Boolean)).size,
        zoneCount: new Set(devices.map(d => d.zone).filter(Boolean)).size,
        borrowed: devices.filter(d => d.borrowed).length,
        models: countModels(devices)
      },
      warnings
    };
  }

  function countModels(devices) {
    const out = {};
    devices.forEach(d => { if (d.model) out[d.model] = (out[d.model] || 0) + 1; });
    return out;
  }

  /* --------------------------------------------------------------------------
     由台账生成拓扑 —— 与 Topology.all() 同构，可直接喂给现有视图
       返回 { stations, stationsMap, equipment, totalSlots, source:'registry' }
     -------------------------------------------------------------------------- */
  function buildTopology(devices, cfg) {
    const stations = Topology.effectiveStations(cfg);
    const stationsMap = {};
    stations.forEach(s => { stationsMap[s.key] = []; });

    /* 按工站分组，组内保持稳定顺序：
       服务器类按 机柜号 + 位号，箱体类按 区域 + 箱号 */
    const groups = {};
    devices.forEach(d => {
      if (!d.station || !stationsMap[d.station]) return;   // 未识别工站的设备不进拓扑
      (groups[d.station] = groups[d.station] || []).push(d);
    });

    Object.keys(groups).forEach(st => {
      const s = ST[st];
      if (!s) return;
      const cap = s.capacity;
      const list = groups[st].slice().sort((a, b) => {
        const ca = a.cabinet || a.zone || '', cb = b.cabinet || b.zone || '';
        if (ca !== cb) {
          // 规范机柜号（S35#）排在自定义区域名（客户验证/FA验证机）之前
          const ra = /^[A-Za-z]{1,4}\d/.test(ca) ? 0 : 1;
          const rb = /^[A-Za-z]{1,4}\d/.test(cb) ? 0 : 1;
          if (ra !== rb) return ra - rb;
          return ca.localeCompare(cb, 'zh-CN', { numeric: true });
        }
        const pa = parseInt(a.pos || a.box, 10) || 0;
        const pb = parseInt(b.pos || b.box, 10) || 0;
        return pa - pb;
      });

      list.forEach(d => {
        const eq = {
          id: d.id,
          station: st,
          capacity: cap,
          layout: s.layout,
          cabinetId: d.cabinet || '',
          serverId: SERVER_STATIONS.indexOf(st) >= 0 ? d.id : '',
          boxId: SERVER_STATIONS.indexOf(st) < 0 ? d.id : '',
          zone: d.zone || '',
          ip: d.ip || '',
          ipAlt: d.ipAlt || '',
          model: d.model || '',
          borrowed: !!d.borrowed,
          slotKeys: []
        };
        for (let k = 0; k < cap; k++) eq.slotKeys.push(Schema.slotKey(st, d.id, k));
        stationsMap[st].push(eq);
      });
    });

    /* ⚠️ 台账没覆盖的工站要按配置补出来。
       设备台账记录的是「机柜里的服务器」，像 ICT 这种单机台根本不在里面；
       若只按台账建拓扑，ICT 会变成 0 台，整条线的节拍源就消失了。 */
    let synthesized = 0;
    stations.forEach(s => {
      if (stationsMap[s.key] && stationsMap[s.key].length) return;
      if (!s.count) return;
      const eqs = Topology.buildStation(s);
      stationsMap[s.key] = eqs;
      synthesized += eqs.length;
    });

    const equipment = [];
    let totalSlots = 0;
    stations.forEach(s => {
      const list = stationsMap[s.key] || [];
      equipment.push.apply(equipment, list);
      totalSlots += list.length * s.capacity;
    });

    return {
      stations, stationsMap, equipment, totalSlots,
      source: synthesized ? 'registry+synthetic' : 'registry',
      synthesized
    };
  }

  /* --------------------------------------------------------------------------
     设备台账 ↔ 工站配置 的台数对比（导入时给用户看差异）
     -------------------------------------------------------------------------- */
  function diffCounts(devices, cfg) {
    const stations = Topology.effectiveStations(cfg);
    const byStation = {};
    devices.forEach(d => {
      if (!d.station) return;
      byStation[d.station] = (byStation[d.station] || 0) + 1;
    });
    return stations.map(s => {
      const led = byStation[s.key] || 0;
      return {
        key: s.key, name: s.name, cn: s.cn, color: s.color,
        configured: s.count, ledger: led,
        diff: led - s.count,
        capacityPerUnit: s.capacity,
        online: led * s.capacity
      };
    });
  }

  /* 由台账推导各工站设备数（用于「按台账更新工站配置」） */
  function countsFromLedger(devices) {
    const out = {};
    devices.forEach(d => {
      if (!d.station) return;
      out[d.station] = (out[d.station] || 0) + 1;
    });
    return out;
  }

  /* --------------------------------------------------------------------------
     IP 映射相关
     -------------------------------------------------------------------------- */

  /* 校验：返回问题清单，供界面高亮 */
  function validate(devices) {
    const issues = { dupIp: {}, invalidIp: {}, noIp: [], sameIpBothCols: [] };
    const owner = {};
    devices.forEach(d => {
      const ip = String(d.ip || '').trim();
      if (!ip) { issues.noIp.push(d.id); return; }
      if (!Util.isIp(ip)) { (issues.invalidIp[d.id] = ip); return; }
      if (owner[ip] && owner[ip] !== d.id) {
        (issues.dupIp[ip] = issues.dupIp[ip] || [owner[ip]]).push(d.id);
      } else {
        owner[ip] = d.id;
      }
      // 上位机 IP 与服务器 IP 相同 —— 通常是填错
      if (d.ipAlt && d.ip === d.ipAlt) issues.sameIpBothCols.push(d.id);
    });
    return issues;
  }

  /* 导出为 CSV（供桥接服务直接读） */
  function toCsv(devices, headers) {
    const rows = devices.map(d => [
      d.station, d.cabinet, d.zone, d.pos, d.box, d.id, d.ip, d.ipAlt, d.model,
      d.borrowed ? '借用' : '自有', d.srcRow
    ]);
    return Util.toCsv(headers || [
      '工站', '机柜', '区域', '位号', '箱号', '设备编号', 'IP', '备用IP', '型号', '归属', '台账行号'
    ], rows);
  }

  /* 导出为桥接服务用的简洁清单 */
  function toBridgeList(devices) {
    return devices.filter(d => d.ip && d.station).map(d => ({
      ip: d.ip,
      station: d.station,
      equipmentId: d.id,
      cabinet: d.cabinet,
      zone: d.zone
    }));
  }

  return {
    SERVER_STATIONS, makeId,
    fromLedger, buildTopology, diffCounts, countsFromLedger,
    validate, toCsv, toBridgeList, countModels
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = Registry;


/* ==========================================================================
   src/domain/capacity.js
   ========================================================================== */
/* ============================================================================
   产能计算 —— 纯函数
   ----------------------------------------------------------------------------
   日产能 = 设备数 × 单台容量 × (1440 分钟 ÷ 单轮时长)

   ⚠️ 良率口径未定（规范 §10 🔴#4）：
      「良率 = 一次通过率」还是「含复测」结果差别很大。
      这里把口径显式参数化，默认 firstPass，界面须标注口径来源。
      口径确定后只改 DEFAULT_YIELD_MODE 一处。
   ============================================================================ */

const Capacity = (() => {

  const DEFAULT_YIELD_MODE = 'firstPass';   // firstPass | includeRetest

  /* 理论日产能（不考虑换料/停机/复测） */
  function dailyThroughput(station) {
    if (!station || !station.cycleMin) return 0;
    return station.count * station.capacity * (1440 / station.cycleMin);
  }

  /* --------------------------------------------------------------------------
     产能概览
     ----------------------------------------------------------------------------
     整线节拍有两种确定方式：
       1) **有节拍源（gate）** —— 以该工序的实测日产能为整线节拍。
          本项目 ICT 即节拍源（现场明确「所有产能都跟 ICT 走」）。这时
          其它工序的「理论产能」只用于判断**跟不跟得上**，不用于定节拍。
       2) 无节拍源时退化为「取各工序理论日产能的最小值」。

     为什么不能一律取最小值：
       理论产能用的是纯测试时间，不含上下料。ICT 标称 6 秒/块 → 理论 14,400/天，
       但含上下料的实测只有 3000/天（28.8 秒/块）。若取理论最小值，
       ICT 会被算成产能大户，真瓶颈反而被掩盖。
     -------------------------------------------------------------------------- */
  function overview(cfg) {
    const rows = Topology.summary(cfg).map(s => {
      const st = Topology.stationOf(s.station, cfg) || {};
      const theoretical = s.daily;
      const measured = st.ratePerDay || null;
      // 有效日产能：有实测值用实测，否则用理论
      const effective = measured != null ? measured : theoretical;
      return Object.assign({}, s, {
        /* daily 一律表示**有效日产能**（有实测用实测，否则用理论）——
           视图层拿它直接显示，不该关心用的是哪套数。
           理论值另存 theoretical，仅在需要说明「理论≠实际」时使用。 */
        daily: effective,
        theoretical,
        measured,
        effective,
        isGate: !!st.isGate,
        hasMeasured: measured != null,
        // 实测与理论的差距（用于提示「理论值不可直接用于排产」）
        measureGap: measured != null && theoretical > 0
          ? 1 - measured / theoretical : null
      });
    });

    const gate = rows.filter(r => r.isGate)[0] || null;
    const others = rows.filter(r => !r.isGate && !r.bypass);

    // 相对最弱的工序（决定是否跟得上）
    const weakest = others.length
      ? others.reduce((a, b) => (a.effective < b.effective ? a : b))
      : null;

    const lineRate = gate ? gate.effective : (weakest ? weakest.effective : 0);
    const maxDaily = rows.reduce((a, b) => Math.max(a, b.effective), 1);

    rows.forEach(r => {
      // 节拍源存在时，它才是「决定整线节拍的那道工序」
      r.isBottleneck = gate ? r.isGate : (weakest && r.station === weakest.station);
      r.ratioToLine = lineRate ? r.effective / lineRate : 0;
      r.barPct = maxDaily ? r.effective / maxDaily : 0;
      // 跟不上整线节拍的工序 —— 这才是真正要盯的
      r.shortfall = !r.bypass && !r.isGate && lineRate > 0 && r.effective < lineRate;
      r.gapToLine = r.effective - lineRate;
    });

    return {
      rows,
      gate,
      weakest,
      bottleneck: gate || weakest,
      lineRate,
      shortfalls: rows.filter(r => r.shortfall)
    };
  }

  /* 单站利用率 = 已占用盘位 / 同时在线容量 */
  function utilization(stat) {
    if (!stat || !stat.online) return 0;
    return stat.used / stat.online;
  }

  /* --------------------------------------------------------------------------
     良率
     ⚠️ 关键口径：异常终止（abort）不计入分母。
        abort 是数据不完整（断电/超时/取料），不是产品不合格。
        混入分母会让良率失真 —— 见《产品执行规范》§6.1
     -------------------------------------------------------------------------- */
  function yieldOf(counts, mode) {
    const c = counts || {};
    const pass = c.pass || 0;
    const fail = c.fail || 0;
    const denom = pass + fail;             // 分母不含 abort / empty
    if (!denom) return { pct: null, pass, fail, abort: c.abort || 0, denom: 0, mode: mode || DEFAULT_YIELD_MODE };
    return {
      pct: pass / denom,
      pass, fail,
      abort: c.abort || 0,
      denom,
      mode: mode || DEFAULT_YIELD_MODE,
      // 口径说明，界面上必须显示，避免不同人理解不同
      formula: 'PASS ÷ (PASS + FAIL)，不含异常终止'
    };
  }

  /* 盘点一组盘位记录 */
  function countSlots(slots) {
    const c = { total: 0, empty: 0, used: 0, testing: 0, pass: 0, fail: 0, abort: 0, other: 0 };
    (slots || []).forEach(s => {
      c.total++;
      const st = s.state;
      if (st === 'empty') c.empty++;
      else c.used++;
      if (st === 'testing') c.testing++;
      else if (st === 'pass') c.pass++;
      else if (st === 'fail') c.fail++;
      else if (st === 'abort') c.abort++;
      else if (st !== 'empty') c.other++;
    });
    return c;
  }

  /* --------------------------------------------------------------------------
     瓶颈分析 / 优化建议
     -------------------------------------------------------------------------- */
  function advice(cfg, stats) {
    const ov = overview(cfg);
    const out = [];
    if (!ov.lineRate) return out;

    /* ① 说明节拍是从哪来的 —— 这决定了后面所有判断的依据 */
    const gate = ov.gate;
    if (gate) {
      out.push({
        level: 'info',
        text: `整线节拍以 <b>${gate.name}</b> 为基准：<b>${Math.round(ov.lineRate).toLocaleString()} 块/天</b>` +
              (gate.hasMeasured
                ? `（实测值；理论值 ${Math.round(gate.theoretical).toLocaleString()} 块/天用的是纯测试时间，` +
                  `未含上下料，不能直接用于排产）`
                : '') + '。'
      });
    }

    /* ② 跟不上的工序 —— 最关键的一条，优先级最高 */
    ov.shortfalls.forEach(r => {
      const need = Math.ceil(r.eqCount * ov.lineRate / r.effective) - r.eqCount;
      out.push({
        level: 'bad',
        text: `<b>${r.name}（${r.cn}）跟不上整线节拍</b>：当前 ${r.eqCount} ${r.unit} 只有 ` +
              `<b>${Math.round(r.effective).toLocaleString()}</b> 块/天，` +
              `而整线需要 ${Math.round(ov.lineRate).toLocaleString()}，缺口 ` +
              `${Math.round(ov.lineRate - r.effective).toLocaleString()} 块/天（仅达 ` +
              `${(r.ratioToLine * 100).toFixed(0)}%）。` +
              (need > 0 ? `约需再增加 <b>${need} ${r.unit}</b>，或压缩单轮时长。` : '')
      });
    });

    /* ③ 紧贴节拍的工序 —— 距 15% 以内，任一波动就掉队 */
    ov.rows.forEach(r => {
      if (r.bypass || r.isGate) return;
      if (r.shortfall) return;                       // 已在 ② 里报过
      if (r.ratioToLine < 1.15) {
        out.push({
          level: 'warn',
          text: `<b>${r.name}</b> 为整线需求的 ${r.ratioToLine.toFixed(2)} 倍` +
                `（${Math.round(r.effective).toLocaleString()} 块/天），余量偏紧 —— ` +
                `停机、换型或复测增加都可能直接压线。`
        });
      }
    });

    /* ④ 节拍源本身的单点风险 */
    if (gate) {
      out.push({
        level: 'warn',
        text: `<b>${gate.name} 单点风险</b>：只有 ${gate.eqCount} ${gate.unit}，且是整线节拍源 —— ` +
              `它停机不是「产能下降」，而是<b>整线断料</b>。` +
              `应当是优先级最高的预防性维护对象，建议配备机或应急方案。`
      });
    }

    /* ⑤ 冗余提示 */
    ov.rows.forEach(r => {
      if (r.bypass || r.isGate) return;
      if (r.ratioToLine >= 2) {
        out.push({
          level: 'info',
          text: `${r.name} 配置 ${r.eqCount} ${r.unit}，可支撑 ${Math.round(r.effective).toLocaleString()} 块/天` +
                `（整线需求的 ${r.ratioToLine.toFixed(1)} 倍），余量充足。`
        });
      }
    });

    return out;
  }

  /* 给定批量，估算通过整线所需天数（串行部分，不含 ORT 旁路） */
  function leadTimeDays(cfg, qty) {
    const ov = overview(cfg);
    if (!ov.lineRate) return null;
    const cycleSum = MAINLINE.reduce((a, k) => {
      const s = Topology.stationOf(k, cfg);
      return a + (s ? s.cycleMin : 0);
    }, 0);
    return (qty / ov.lineRate) + (cycleSum / 1440);
  }

  return {
    DEFAULT_YIELD_MODE,
    dailyThroughput, overview, utilization,
    yieldOf, countSlots, advice, leadTimeDays
  };
})();


/* ==========================================================================
   src/domain/sampling.js
   ========================================================================== */
/* ============================================================================
   ORT 抽样（2.5%）—— Lava_test 特有，纯函数
   ----------------------------------------------------------------------------
   规范 §5.1：
     抽样数 = ⌈批次数量 × 2.5%⌉
     ORT 台次 = ⌈抽样数 ÷ 16⌉

   ⚠️ 容量自洽性：ORT 32 台 × 16 盘位 ÷ 7 天 = 73 块/天，
      恰好等于主线 2836 块/天的 2.5%（71 块），匹配度 96.9%。
      这反证了 ORT 是「旁路抽检」而非串行工序 —— 若串行，73 块/天的吞吐
      会成为整线瓶颈（比 ESS 还低 40 倍），产线无法运转。

   ⚠️ 抽样方式（随机/等距）、失效后的停线判据均未定（规范 §10 🔴#3、🟡#10）。
      本模块只做计算与展示，**不做自动停线、不做自动派工**，避免误调度。
   ============================================================================ */

const Sampling = (() => {

  const DEFAULT_RATIO = 0.025;

  /* 抽样量计算 */
  function calc(qty, ratio) {
    const r = ratio == null ? DEFAULT_RATIO : ratio;
    const n = Math.max(0, Math.ceil(Number(qty || 0) * r));
    const perServer = ST.ORT ? ST.ORT.capacity : 16;
    const rounds = n > 0 ? Math.ceil(n / perServer) : 0;
    return {
      qty: Number(qty || 0),
      ratio: r,
      sample: n,
      perServer,
      rounds,
      // 最后一轮的实际装载数（允许不满载）
      lastRoundLoad: n > 0 ? (n % perServer === 0 ? perServer : n % perServer) : 0,
      desc: n > 0
        ? `抽 ${n} 块 → 占用 ORT ${rounds} 台次（${perServer} 盘位/台）`
        : '批量不足，无需抽样'
    };
  }

  /* 一批或多批的排轮汇总 */
  function plan(items, ratio) {
    const list = (items || []).map(it => Object.assign({ id: it.id, no: it.no }, calc(it.qty, ratio)));
    const totalSample = list.reduce((a, x) => a + x.sample, 0);
    const totalRounds = list.reduce((a, x) => a + x.rounds, 0);
    const capacity = (ST.ORT ? ST.ORT.count * ST.ORT.capacity : 0);
    const cycleDays = ST.ORT ? ST.ORT.cycleMin / 1440 : 7;
    // 同期在测占用：总台次 × 单轮时长 ÷ 排轮窗口
    const concurrent = capacity ? Math.min(capacity, totalSample) : 0;
    return {
      list, totalSample, totalRounds,
      capacity,
      cycleDays,
      concurrent,
      // 若同时投产所有批次，ORT 是否够用
      enough: capacity >= concurrent,
      desc: `共需抽 ${totalSample} 块 / ${totalRounds} 台次；ORT 总容量 ${capacity} 盘位，单轮 ${cycleDays} 天`
    };
  }

  /* ORT 日产能与主线需求的匹配度（自洽性检查） */
  function consistency(cfg) {
    const ov = Capacity.overview(cfg);
    const lineRate = ov.lineRate;                                  // 主线日产能
    const demand = lineRate * DEFAULT_RATIO;                       // ORT 日需求
    const st = Topology.stationOf('ORT', cfg);
    const capacity = st ? st.count * st.capacity * (1440 / st.cycleMin) : 0;   // ORT 日能力
    return {
      lineRate, demand, capacity,
      match: capacity ? demand / capacity : 0,
      ok: capacity ? Math.abs(demand / capacity - 1) < 0.15 : false,
      desc: `主线 ${Math.round(lineRate).toLocaleString()} 块/天 × 2.5% = ${Math.round(demand)} 块/天；` +
            `ORT 能力 ${Math.round(capacity)} 块/天`
    };
  }

  /* 判定某块 SN 是否被 ORT 抽中（确定性，便于追溯一致） */
  function isSampled(sn, ratio) {
    const r = ratio == null ? DEFAULT_RATIO : ratio;
    return (Util.hashCode(sn) % 1000) < Math.round(r * 1000);
  }

  /* 从一批 SN 中按确定性规则抽样本（不依赖随机，可复现） */
  function pick(sns, qty, ratio) {
    const n = calc(qty, ratio).sample;
    const sorted = (sns || []).slice().sort((a, b) => Util.hashCode(a) - Util.hashCode(b));
    return sorted.slice(0, n);
  }

  /* ⚠️ 失效处置：仅给出建议，不自动停线（规范 §10 🔴#3 未定） */
  function failureAdvice(failCount, lotSize) {
    if (!failCount) {
      return { escalated: false, stopLine: false, text: '全数通过，批次可放行' };
    }
    if (failCount === 1) {
      const widen = calc(lotSize, 0.10);
      return {
        escalated: true, stopLine: false,
        text: `出现 1 块失效 → 建议扩大抽样至 10%（约 ${widen.sample} 块）复验`,
        note: '⚠️ 扩大倍数与是否停线为推定值，须现场确认（规范 §5.3）'
      };
    }
    return {
      escalated: true, stopLine: false,   // 不自动停线
      text: `${failCount} 块失效 → 建议该批次冻结并转工程分析（FA）`,
      note: '⚠️ 停线判据未定，请人工决策。本系统只提示，不自动停线（规范 §10 🔴#3）'
    };
  }

  return {
    DEFAULT_RATIO,
    calc, plan, consistency, isSampled, pick, failureAdvice
  };
})();


/* ==========================================================================
   src/domain/errcode-rules.js
   ========================================================================== */
/* ============================================================================
   错误码规则引擎 —— 每条码带「处置策略」而不只是文案
   ----------------------------------------------------------------------------
   对应 RDIMM 的 ERROR_CODE_RULES。策略决定：是否允许复测、是否锁定 SN。
   ⚠️ 具体错误码待现场提供（规范 §10）。现场可用「系统设置 → 错误码规则」覆盖。
   ============================================================================ */

const ErrCodeRules = (() => {

  /* 生效规则 = 内置 + 配置覆盖（按 code 合并） */
  function effective(cfg) {
    const over = (cfg && cfg.errorCodeRules) || [];
    if (!over.length) return ERROR_CODE_RULES.slice();
    const map = new Map();
    ERROR_CODE_RULES.forEach(r => map.set(r.code, Object.assign({}, r)));
    over.forEach(r => {
      if (!r || !r.code) return;
      const base = map.get(r.code) || {};
      map.set(r.code, Object.assign({}, base, r));
    });
    return Array.from(map.values());
  }

  function find(cfg, code) {
    if (!code) return null;
    const c = String(code).trim().toUpperCase();
    return effective(cfg).filter(r => String(r.code).toUpperCase() === c)[0] || null;
  }

  /* 从任意文本里提取错误码
     ⚠️ 占位模式：现有 E-XXX-nnn 与 0xXXXX 两种形态，现场确定后收紧 */
  const CODE_RES = [
    /\bE-[A-Z]{2,6}-\d{2,4}\b/i,          // E-ICT-102 / E-BIST-407
    /\b0x[0-9A-F]{4}\b/i,                 // 0x000B 一类
    /\bERR[-_]?\d{3,5}\b/i                // ERR-1234
  ];
  /* 归一化：十六进制只大写数字部分，保留小写 x（'0X000B' 显示很别扭）；
     其余形态整体大写。判定时都按大写比较，故不影响匹配。 */
  function normalizeCode(c) {
    const s = String(c || '');
    if (/^0x/i.test(s)) return '0x' + s.slice(2).toUpperCase();
    return s.toUpperCase();
  }
  function extract(text) {
    if (!text) return '';
    const s = String(text);
    for (let i = 0; i < CODE_RES.length; i++) {
      const m = s.match(CODE_RES[i]);
      if (m) return normalizeCode(m[0]);
    }
    return '';
  }

  /* 该错误码是否允许复测 */
  function allowRetest(cfg, code) {
    const r = find(cfg, code);
    return r ? !!r.allowRetest : false;   // 未知码一律不允许复测，走人工
  }
  /* 该错误码是否应锁定 SN */
  function lockSn(cfg, code) {
    const r = find(cfg, code);
    return r ? !!r.lockSn : false;
  }
  /* 处置动作文案 */
  function actionOf(cfg, code) {
    const r = find(cfg, code);
    return r ? (r.action || '') : '未知错误码，请人工判定';
  }
  function nameOf(cfg, code) {
    const r = find(cfg, code);
    return r ? (r.name || r.code) : '';
  }

  /* 复测裁决：给定当前复测轮次与错误码，返回是否可再测 */
  function canRetest(cfg, code, retestRound) {
    const round = retestRound || 0;
    if (!allowRetest(cfg, code)) {
      return { ok: false, reason: '该错误码不允许复测，须直接转 FA' };
    }
    const MAX = 1;   // 🟡 推定上限 1 次（规范 §6.2，待现场确认）
    if (round >= MAX) {
      return { ok: false, reason: `已达复测上限（${MAX} 次）` };
    }
    return { ok: true, reason: '', action: actionOf(cfg, code) };
  }

  return { effective, find, extract, normalizeCode, allowRetest, lockSn, actionOf, nameOf, canRetest };
})();


/* ==========================================================================
   src/domain/defect-engine.js
   ========================================================================== */
/* ============================================================================
   不良判定引擎 —— 规则表 + 判定流水 + 待确认队列
   ----------------------------------------------------------------------------
   对应 RDIMM 的 classifyDefect / recordDefectJudgement。

   三态结论（VERDICT）：
     functional    功能性不良 → 写不良记录且自动 confirmed=true
     nonfunctional 非功能性   → 只留流水，不写不良记录（机柜侧事件等）
     unknown       待确认     → 写不良记录但 confirmed=false，等人工确认

   设计要点（沿用 RDIMM 并被其源码解析肯定的做法）：
     · 规则按 priority 升序，首个命中即返回
     · 每次判定都写流水（不可变审计），可回溯原文、命中规则、确认人
     · 规则变更只影响后续判定，**不重算历史** —— 这是有意为之
   ============================================================================ */

const DefectEngine = (() => {

  /* 首次使用时把内置规则展开为完整规则对象 */
  function ensureRules(cfg) {
    if (!cfg.defectRules || !cfg.defectRules.length) {
      cfg.defectRules = DEFAULT_DEFECT_RULES.map((x, i) => ({
        id: 'dr_' + Util.uid('r'),
        priority: (i + 1) * 10,
        enabled: true,
        matchType: x[0],
        pattern: x[1],
        verdict: x[2],
        defectType: x[3],
        note: '内置规则',
        hitCount: 0,
        createdAt: Util.nowStr(),
        updatedAt: Util.nowStr()
      }));
    }
    return cfg.defectRules;
  }

  function rules(cfg) { return ensureRules(cfg); }

  function sortedEnabled(cfg) {
    return rules(cfg).filter(r => r.enabled)
      .slice()
      .sort((a, b) => (a.priority || 100) - (b.priority || 100));
  }

  /* --------------------------------------------------------------------------
     核心判定：首个命中即返回
     返回 { verdict, defectType, ruleId, confidence }
       confidence: 'rule' 命中规则 | 'none' 未命中（进待确认）
     -------------------------------------------------------------------------- */
  function classify(cfg, rawText, errCode, station) {
    const txt = String(rawText || '');
    const list = sortedEnabled(cfg);

    for (let i = 0; i < list.length; i++) {
      const r = list[i];
      const p = String(r.pattern || '');
      let hit = false;

      if (r.matchType === 'errcode') {
        hit = !!errCode && String(errCode).toUpperCase() === p.toUpperCase();
      } else if (r.matchType === 'station') {
        hit = !!station && String(station).toUpperCase().indexOf(p.toUpperCase()) >= 0;
      } else if (r.matchType === 'keyword') {
        if (!p) hit = false;                      // 空关键词不参与匹配，防止误命中
        else if (/^\/.*\/$/.test(p)) {            // /正则/ 形式
          try { hit = new RegExp(p.slice(1, -1), 'i').test(txt); } catch (e) { hit = false; }
        } else {
          hit = txt.toUpperCase().indexOf(p.toUpperCase()) >= 0;
        }
      } else if (r.matchType === 'any') {
        hit = true;                               // 兜底
      }

      if (hit) {
        r.hitCount = (r.hitCount || 0) + 1;
        r.updatedAt = Util.nowStr();
        return {
          verdict: r.verdict || 'unknown',
          defectType: r.defectType || p || '未分类',
          ruleId: r.id,
          confidence: 'rule',
          rule: r
        };
      }
    }
    return { verdict: 'unknown', defectType: '待确认', ruleId: '', confidence: 'none', rule: null };
  }

  /* 试判定：不动命中计数，供「不良判定设置」界面预览用 */
  function dryRun(cfg, rawText, errCode, station) {
    const list = sortedEnabled(cfg);
    const txt = String(rawText || '');
    for (let i = 0; i < list.length; i++) {
      const r = list[i];
      const p = String(r.pattern || '');
      let hit = false;
      if (r.matchType === 'errcode') hit = !!errCode && String(errCode).toUpperCase() === p.toUpperCase();
      else if (r.matchType === 'station') hit = !!station && String(station).toUpperCase().indexOf(p.toUpperCase()) >= 0;
      else if (r.matchType === 'keyword') {
        if (p) {
          if (/^\/.*\/$/.test(p)) { try { hit = new RegExp(p.slice(1, -1), 'i').test(txt); } catch (e) { } }
          else hit = txt.toUpperCase().indexOf(p.toUpperCase()) >= 0;
        }
      } else if (r.matchType === 'any') hit = true;
      if (hit) return { verdict: r.verdict, defectType: r.defectType, ruleId: r.id, confidence: 'rule', rule: r };
    }
    return { verdict: 'unknown', defectType: '待确认', ruleId: '', confidence: 'none', rule: null };
  }

  /* --------------------------------------------------------------------------
     记录判定：写流水 + 按需写不良记录
     ctx: { source, rawText, errCode, station, sn, pn, model, woNo,
            cabinetId, serverId, slotIndex, boxId, time, note }
     返回 { judgementId, badId, verdict, defectType, ruleId, confidence }
     -------------------------------------------------------------------------- */
  async function record(ctx, deps) {
    const cfg = deps.cfg;
    const c = ctx || {};
    const raw = String(c.rawText || c.note || c.type || '');
    const code = c.errCode || ErrCodeRules.extract(raw) || '';
    const j = classify(cfg, raw, code, c.station || '');
    const v = VERDICT[j.verdict] || VERDICT.unknown;
    const day = c.day || Util.todayKey(new Date(c.time || Date.now()));

    const judgementId = Util.uid('jdg');
    let badId = '';

    /* --- 写不良记录 ---
       非功能性不良（如机柜侧事件）不进不良表，只留流水 */
    if (v.toBad && c.sn) {
      // 去重键：工站 + 位置 + SN + 日期（同一块盘同一天同一站只留一条）
      const existing = (await deps.findBad(c)).filter(b =>
        b.sn === c.sn && b.station === (c.station || '') &&
        b.day === day &&
        String(b.slotIndex == null ? '' : b.slotIndex) === String(c.slotIndex == null ? '' : c.slotIndex)
      )[0];

      if (existing) {
        badId = existing.id;
        existing.verdict = j.verdict;
        existing.errCode = code;
        existing.type = j.defectType;
        existing.judgementId = judgementId;
        // 已人工确认过的不被自动判定覆盖
        if (existing.confirmedBy) {
          existing.confirmed = true;
        } else {
          existing.confirmed = v.autoConfirm;
        }
        existing.updatedAt = Date.now();
        await deps.saveBad(existing);
      } else {
        const bad = Schema.newBad({
          day, time: c.time || Date.now(),
          station: c.station || '', cabinetId: c.cabinetId || '',
          serverId: c.serverId || '', slotIndex: c.slotIndex,
          boxId: c.boxId || '',
          sn: c.sn, pn: c.pn || '', model: c.model || '', woNo: c.woNo || '',
          type: j.defectType, errCode: code, verdict: j.verdict,
          confirmed: v.autoConfirm,
          judgementId, note: c.note || raw, source: c.source || 'manual'
        });
        badId = bad.id;
        await deps.saveBad(bad);
      }
    }

    /* --- 写流水（不可变审计，只增不改） --- */
    const jdg = Schema.newJudgement({
      id: judgementId,
      at: c.time || Date.now(),
      source: c.source || 'manual',
      rawText: raw, errCode: code, station: c.station || '',
      cabinetId: c.cabinetId || '', slotIndex: c.slotIndex,
      sn: c.sn || '', verdict: j.verdict, ruleId: j.ruleId,
      confidence: j.confidence,
      confirmed: j.verdict === 'functional',
      badId
    });
    await deps.saveJudgement(jdg);

    return {
      judgementId, badId,
      verdict: j.verdict, defectType: j.defectType,
      ruleId: j.ruleId, confidence: j.confidence
    };
  }

  /* --------------------------------------------------------------------------
     待确认队列
     -------------------------------------------------------------------------- */
  async function pending(deps, limit) {
    const list = await deps.listBad({ confirmed: false }, { desc: true, limit: limit || 500 });
    return list;
  }

  /* 批量确认 */
  async function confirm(ids, by, note, deps) {
    const arr = Array.isArray(ids) ? ids : [ids];
    let n = 0;
    for (const id of arr) {
      const b = await deps.getBad(id);
      if (!b || b.confirmed) continue;
      b.confirmed = true;
      b.confirmedBy = by || '';
      b.confirmedAt = Date.now();
      if (note) b.note = (b.note ? b.note + ' | ' : '') + note;
