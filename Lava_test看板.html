            '响应原样返回，字段映射后续再配。</div>' +
          '<div class="form-row-3">' +
            '<div class="form-group"><label class="form-label">服务地址</label>' +
              '<input class="form-input" id="cfgMesUrl" placeholder="http://10.0.0.10:8080" value="' +
                Util.esc((cfg.channels.webapp || {}).baseUrl || '') + '"></div>' +
            '<div class="form-group"><label class="form-label">认证头</label>' +
              '<input class="form-input" id="cfgMesHeader" placeholder="Authorization" value="' +
                Util.esc((cfg.channels.webapp || {}).authHeader || 'Authorization') + '"></div>' +
            '<div class="form-group"><label class="form-label">令牌</label>' +
              '<input class="form-input" id="cfgMesToken" placeholder="留空表示不需要认证" value="' +
                Util.esc((cfg.channels.webapp || {}).token || '') + '"></div>' +
          '</div>' +
          '<div class="form-group" style="margin-top:9px">' +
            '<label class="form-label">端点（每行一条：名称 = 路径）</label>' +
            '<textarea class="form-textarea" id="cfgMesEps" style="min-height:70px">' +
              Util.esc(mesEndpointsText(cfg)) + '</textarea>' +
            '<div class="form-hint">名称是调用时用的标识，路径是相对服务地址的 URL。' +
              '例如 <code>workorders = /api/workorder-options</code></div>' +
          '</div>' +
        '</div>' +

        '<div class="settings-card">' +
          '<div class="settings-card-title">扫描根目录' +
            '<span class="note-inline">拉取时按这些路径找日志</span></div>' +
          '<div class="desc">每个根目录对应现场的一处日志存放位置。' +
            '关掉的不会被扫描。工站字段用于把日志归到对应工序。</div>' +
          '<div id="cfgRoots"></div>' +
          '<div class="toolbar" style="margin:9px 0 0">' +
            '<button class="btn sm" id="cfgRootAdd">新增根目录</button>' +
          '</div>' +
        '</div>' +

        '<div class="section-title">节拍与刷新</div>' +
        '<div class="form-row-3">' +
          '<div class="form-group"><label class="form-label">拉取间隔（秒）</label>' +
            '<input type="number" class="form-input" id="cfgRefresh" value="' +
              (cfg.settings.refreshSec || 60) + '"></div>' +
          '<div class="form-group"><label class="form-label">单轮最多拉取文件数</label>' +
            '<input type="number" class="form-input" id="cfgMaxFiles" value="' +
              (cfg.settings.maxFilesPerRun || 80) + '"></div>' +
          '<div class="form-group"><label class="form-label">原始日志留档天数</label>' +
            '<input type="number" class="form-input" id="cfgKeepRaw" value="' +
              (cfg.settings.keepRawDays || 30) + '"></div>' +
        '</div>' +

        '<div class="section-title">存储信息</div>' +
        '<div id="storageInfo"></div>' +
        '<div class="toolbar" style="margin-top:9px">' +
          '<button class="btn" id="cfgExportConfig">导出配置</button>' +
          '<button class="btn danger" id="cfgResetAll">恢复出厂设置</button>' +
        '</div>',
      footer: '<button class="btn" data-mclose="1">关闭</button>' +
              '<button class="btn primary" id="cfgSaveAll">保存设置</button>',
      onMount(h) {
        renderStorageInfo(h);
        renderRoots();
        h.el.addEventListener('click', async e => {
          /* 扫描根目录：增 / 删 */
          if (e.target.closest('#cfgRootAdd')) {
            App.cfg.scanRoots = App.cfg.scanRoots || [];
            App.cfg.scanRoots.push({
              id: 'r_' + Util.uid('root'), name: '新目录', path: '', kind: 'log', enabled: false
            });
            renderRoots();
            return;
          }
          const del = e.target.closest('[data-root-del]');
          if (del) {
            const i = Number(del.dataset.rootDel);
            App.cfg.scanRoots.splice(i, 1);
            renderRoots();
            return;
          }
          if (e.target.closest('#cfgSave') || e.target.closest('#cfgSaveAll')) {
            saveAll(h);
            return;
          }
          if (e.target.closest('#cfgReset')) {
            const ok = await Modal.confirm({
              title: '恢复默认工站配置', text: '将把设备数与单轮时长恢复为规范中的出厂值。',
              okText: '恢复', danger: true
            });
            if (!ok) return;
            App.cfg.stationOverride = {};
            LocalStore.save();
            Topology.invalidate();
            h.close(); open();
            App.switchView(App.state.curView);
            Toast.ok('已恢复默认工站配置');
            return;
          }
          if (e.target.closest('#cfgExportConfig')) {
            await Backup.download('config', App.cfg);
            return;
          }
          if (e.target.closest('#cfgResetAll')) {
            const ok = await Modal.confirm({
              title: '恢复出厂设置',
              html: '将清空<b>全部设置与规则</b>并恢复到初始状态。<br>' +
                    '⚠️ 盘位与记录数据<b>不受影响</b>，但判定规则会重置。',
              okText: '恢复', danger: true
            });
            if (!ok) return;
            LocalStore.reset();
            App.state.cfg = LocalStore.load();
            Topology.invalidate();
            h.close();
            App.switchView(App.state.curView);
            Toast.ok('已恢复出厂设置');
          }
        });
      }
    });
  }

  async function renderStorageInfo(h) {
    const el = h.query('#storageInfo');
    if (!el) return;
    const est = await Repo.estimate();
    el.innerHTML =
      '<div class="hint">' +
        '存储后端：<b>' + Util.esc(Repo.backendLabel()) + '</b>' +
        (Repo.isDegraded()
          ? '<br><span style="color:var(--warn)">⚠️ 当前为降级模式。' +
            '若页面以 file:// 打开，浏览器会禁用 IndexedDB。' +
            '改用桥接托管地址 <code>http://127.0.0.1:8770/</code> 可获得完整容量。</span>'
          : '') +
        '<br>已用：' + Util.bytes(est.usage) +
        (est.quota ? ' / ' + Util.bytes(est.quota) +
          '（' + (est.usedPct * 100).toFixed(1) + '%）' : '') +
        '<br>非空盘位：' + Util.num(App.slots.size) +
        ' / ' + Util.num(Topology.all(App.cfg).totalSlots) +
        '<br>记录：' + Util.num((App.records || []).length) +
        ' · 不良：' + Util.num((App.bad || []).length) +
        ' · 报错：' + Util.num((App.error || []).length) +
      '</div>';
  }

  function saveAll(h) {
    const cfg = App.cfg;
    /* 工站覆盖 */
    const ov = {};
    h.queryAll('[data-cfg-count]').forEach(inp => {
      const k = inp.dataset.cfgCount;
      ov[k] = ov[k] || {};
      ov[k].count = Number(inp.value);
    });
    h.queryAll('[data-cfg-cycle]').forEach(inp => {
      const k = inp.dataset.cfgCycle;
      ov[k] = ov[k] || {};
      ov[k].cycleMin = Number(inp.value);
    });
    // 与出厂值一致的就不必存
    Object.keys(ov).forEach(k => {
      const base = ST[k];
      if (!base) return;
      if (ov[k].count === base.count) delete ov[k].count;
      if (ov[k].cycleMin === base.cycleMin) delete ov[k].cycleMin;
      if (!Object.keys(ov[k]).length) delete ov[k];
    });
    cfg.stationOverride = ov;

    /* 通道 */
    cfg.channels.ftp = cfg.channels.ftp || {};
    cfg.channels.ftp.bridgeUrl = h.query('#cfgBridge').value.trim();
    cfg.channels.ftp.host = h.query('#cfgFtpHost').value.trim();
    cfg.channels.ftp.port = Number(h.query('#cfgFtpPort').value) || 21;
    cfg.channels.ftp.basePath = h.query('#cfgFtpBase').value.trim();

    cfg.channels.ssh = cfg.channels.ssh || {};
    cfg.channels.ssh.user = h.query('#cfgSshUser').value.trim();
    cfg.channels.ssh.port = Number(h.query('#cfgSshPort').value) || 22;
    cfg.channels.ssh.logRoot = h.query('#cfgSshRoot').value.trim();

    /* MES 通道 */
    cfg.channels.webapp = cfg.channels.webapp || {};
    cfg.channels.webapp.baseUrl = (h.query('#cfgMesUrl').value || '').trim();
    cfg.channels.webapp.authHeader = (h.query('#cfgMesHeader').value || '').trim() || 'Authorization';
    cfg.channels.webapp.token = (h.query('#cfgMesToken').value || '').trim();
    cfg.channels.webapp.endpoints = parseEndpoints(h.query('#cfgMesEps').value);

    /* 扫描根目录：从表格里逐个读回 */
    const roots = cfg.scanRoots || [];
    roots.forEach((r, i) => {
      const en = document.querySelector('[data-root-en="' + i + '"]');
      const nm = document.querySelector('[data-root-name="' + i + '"]');
      const pa = document.querySelector('[data-root-path="' + i + '"]');
      const st = document.querySelector('[data-root-station="' + i + '"]');
      const kd = document.querySelector('[data-root-kind="' + i + '"]');
      if (en) r.enabled = en.checked;
      if (nm) r.name = nm.value.trim();
      if (pa) r.path = pa.value.trim();
      if (st) r.station = st.value;
      if (kd) r.kind = kd.value;
    });
    // 丢掉路径为空的空行
    cfg.scanRoots = roots.filter(r => r.path);

    /* 节拍 */
    cfg.settings.refreshSec = Number(h.query('#cfgRefresh').value) || 60;
    cfg.settings.maxFilesPerRun = Number(h.query('#cfgMaxFiles').value) || 80;
    cfg.settings.keepRawDays = Number(h.query('#cfgKeepRaw').value) || 30;

    const r = LocalStore.save();
    Topology.invalidate();

    if (!r.ok) {
      Toast.error('配置保存失败' + (r.reason === 'quota' ? '（存储空间不足）' : ''));
      return;
    }
    h.close();
    App.refreshStatus();
    App.switchView(App.state.curView);
    Toast.ok('设置已保存');
  }

  return { open };
})();


/* ==========================================================================
   src/modals/ledger.js
   ========================================================================== */
/* ============================================================================
   设备台账 —— 导入 xlsx + IP 映射维护
   ----------------------------------------------------------------------------
   两个页签：
     导入   选/拖 xlsx → 解析 → 预览差异 → 应用
     台账   设备清单（位置 / IP / 型号），带校验与编辑，可导出

   导入之后「拓扑来源」从合成切到台账：设备编号变成真实机柜号+位号，
   现场标号与看板一致，桥接阶段才能把巡检到的 IP 对应到设备。
   ============================================================================ */

const ModalLedger = (() => {

  let _tab = 'import';
  let _parsed = null;        // Ledger.parse 结果
  let _registry = null;      // Registry.fromLedger 结果
  let _fileName = '';
  let _busy = false;
  let _page = 1;
  let _filter = { station: '', keyword: '', onlyIssue: false };

  const OPTS = {
    includeBorrowed: true,
    skipFaulty: true,
    applyCounts: true
  };

  function open(tab) {
    _tab = tab || 'import';
    render();
  }

  /* ==========================================================================
     外壳
     ========================================================================== */
  function render() {
    const t = _tab;
    Modal.open({
      id: 'ledger',
      title: '设备台账',
      sub: '导入 Excel 台账 · 维护设备 IP 映射',
      size: 'full',
      body:
        '<div class="tabs-inline">' +
          '<button class="btn ' + (t === 'import' ? 'on' : '') + '" data-led-tab="import">导入台账</button>' +
          '<button class="btn ' + (t === 'list' ? 'on' : '') + '" data-led-tab="list">' +
            '设备清单' + (App.devices.length ? '（' + Util.num(App.devices.length) + '）' : '') + '</button>' +
          '<span class="spacer" style="flex:1"></span>' +
          statusChip() +
        '</div>' +
        '<div id="ledBody"></div>',
      footer: '<button class="btn" data-mclose="1">关闭</button>',
      onMount(h) {
        h.el.addEventListener('click', e => {
          const tb = e.target.closest('[data-led-tab]');
          if (tb) { _tab = tb.dataset.ledTab; render(); }
        });
        renderBody();
      }
    });
  }

  function statusChip() {
    if (Repo.isDegraded()) return '<span class="chip warn">存储降级模式</span>';
    return '<span class="chip ' + (App.devices.length ? 'ok' : '') + '">' +
      (App.devices.length ? '台账已导入' : '未导入台账') + '</span>';
  }

  function renderBody() {
    const box = document.getElementById('ledBody');
    if (!box) return;
    box.innerHTML = _tab === 'import' ? importHtml() : listHtml();
    if (_tab === 'list') bindList();
  }

  /* ==========================================================================
     页签一：导入
     ========================================================================== */
  function importHtml() {
    if (_busy) {
      return '<div class="loading"><span class="spinner"></span>正在解析台账…</div>';
    }
    if (!_parsed) {
      return '' +
        '<div class="drop-zone" id="ledDrop">' +
          '<div class="dz-icon">📄</div>' +
          '<div class="dz-title">把设备台账拖到这里，或点击选择文件</div>' +
          '<div class="dz-sub">支持 .xlsx（Excel 工作簿）。解析在本地完成，文件不会上传到任何地方。</div>' +
          '<input type="file" id="ledFile" accept=".xlsx" style="display:none">' +
        '</div>' +
        '<div class="note">' +
          '<b>台账里需要有什么</b>：一张含「机柜号 / 设备型号 / 服务器位置 / 工位 / IP」等列的明细表。' +
          '解析器按表头名定位列，列顺序随意；一张工作表里有多张子表（如服务器表 + 箱体表）也能识别。<br>' +
          '导入后设备编号会变成<b>真实机柜号 + 位号</b>（如 S35#-3），与现场标号一致。' +
        '</div>' +
        (App.devices.length
          ? '<div class="note warn">当前已有 ' + Util.num(App.devices.length) +
            ' 台设备台账。再次导入会<b>整体替换</b>。</div>'
          : '');
    }
    return previewHtml();
  }

  function previewHtml() {
    const p = _parsed, r = _registry;
    const d = Registry.diffCounts(r.devices, App.cfg);
    const s = r.stats;

    const diffRows = d.map(x => ({
      name: x.name, cn: x.cn, color: x.color,
      configured: x.configured, ledger: x.ledger, diff: x.diff,
      online: x.online
    }));

    const diffCols = [
      { key: 'name', label: '工序' },
      { key: 'cn', label: '中文' },
      { key: 'configured', label: '看板配置', cls: 'num' },
      { key: 'ledger', label: '台账台数', cls: 'num' },
      { key: 'diff', label: '差异', cls: 'num', html: v =>
          v === 0 ? '<span class="muted">一致</span>'
            : '<b style="color:' + (v > 0 ? 'var(--ok)' : 'var(--bad)') + '">' +
              (v > 0 ? '+' : '') + v + '</b>' },
      { key: 'online', label: '同时在线', cls: 'num', fmt: v => Util.num(v) }
    ];

    return '' +
      '<div class="note ok">已解析 <b>' + Util.esc(_fileName) + '</b>：' +
        '识别到 <b>' + p.tables.length + '</b> 张子表，' +
        '<b>' + Util.num(s.total) + '</b> 台设备、' +
        '<b>' + Util.num(s.ipCount) + '</b> 个 IP、' +
        '<b>' + s.cabinetCount + '</b> 个机柜' +
        (s.zoneCount ? '、' + s.zoneCount + ' 个区域' : '') + '。' +
      '</div>' +

      (r.warnings.length || p.warnings.length
        ? '<div class="section-title">解析提示</div>' +
          r.warnings.concat(p.warnings).map(w =>
            '<div class="note warn" style="margin:6px 0">' + Util.esc(w) + '</div>').join('')
        : '') +

      '<div class="section-title">工站台数对比' +
        '<span class="note-inline">台账实测 vs 看板当前配置</span></div>' +
      DataTable.build(diffCols, diffRows) +

      '<div class="section-title">导入选项</div>' +
      '<div class="settings-card">' +
        opt('includeBorrowed', '纳入借用设备',
            '台账里标记为「WTS借用设备」的条目。现场确认这些是调拨给本产线在用的。', s.borrowed) +
        opt('skipFaulty', '排除故障/维修区域',
            '位于「故障机台」「维修」等区域的设备，不参与生产统计。') +
        opt('applyCounts', '按台账更新工站设备数',
            '把各工站的设备数改为台账实测值（影响产能与瓶颈计算）。' +
            '不勾选则只导入设备清单与 IP，不改动工站配置。') +
      '</div>' +

      '<div class="section-title">设备抽样（前 12 台）</div>' +
      DataTable.build([
        { key: 'station', label: '工序' },
        { key: 'cabinet', label: '机柜' },
        { key: 'pos', label: '位号' },
        { key: 'box', label: '箱号' },
        { key: 'id', label: '设备编号', cls: 'col-sn' },
        { key: 'ip', label: 'IP', cls: 'col-sn' },
        { key: 'model', label: '型号' },
        { key: 'borrowed', label: '归属', html: v =>
            v ? '<span class="pill p-warn">借用</span>' : '<span class="pill p-wait">自有</span>' }
      ], r.devices.slice(0, 12)) +

      '<div class="toolbar" style="margin-top:14px">' +
        '<button class="btn primary" id="ledApply">应用导入</button>' +
        '<button class="btn" id="ledCancel">重新选择文件</button>' +
      '</div>';
  }

  function opt(key, label, desc, count) {
    return '<label class="opt-row">' +
      '<input type="checkbox" data-led-opt="' + key + '"' + (OPTS[key] ? ' checked' : '') + '>' +
      '<span class="opt-text"><b>' + Util.esc(label) + '</b>' +
        (count ? ' <span class="pill p-warn">' + count + ' 台</span>' : '') +
        '<span class="opt-desc">' + Util.esc(desc) + '</span></span>' +
    '</label>';
  }

  /* ==========================================================================
     页签二：设备清单（IP 映射）
     ========================================================================== */
  function listHtml() {
    const all = App.devices;
    if (!all.length) {
      return '<div class="empty-tip">尚未导入设备台账。切到「导入台账」页签选择 xlsx 文件。</div>';
    }
    const issues = Registry.validate(all);

    /* 过滤 */
    let list = all.slice();
    if (_filter.station) list = list.filter(d => d.station === _filter.station);
    if (_filter.keyword) {
      const kw = _filter.keyword.toUpperCase();
      list = list.filter(d =>
        String(d.id).toUpperCase().indexOf(kw) >= 0 ||
        String(d.ip).indexOf(kw) >= 0 ||
        String(d.cabinet).toUpperCase().indexOf(kw) >= 0 ||
        String(d.model).toUpperCase().indexOf(kw) >= 0);
    }
    if (_filter.onlyIssue) {
      list = list.filter(d => !d.ip || issues.dupIp[d.ip] || issues.invalidIp[d.id]);
    }

    const byStation = {};
    all.forEach(d => { byStation[d.station || '(未识别)'] = (byStation[d.station || '(未识别)'] || 0) + 1; });

    const cols = [
      { key: 'station', label: '工序' },
      { key: 'cabinet', label: '机柜', fmt: v => v || '--' },
      { key: 'zone', label: '区域', fmt: v => v || '--' },
      { key: 'pos', label: '位号', fmt: v => v || '--' },
      { key: 'box', label: '箱号', fmt: v => v || '--' },
      { key: 'id', label: '设备编号', cls: 'col-sn' },
      { key: 'ip', label: 'IP', cls: 'col-sn', html: (v, row) => {
          if (!v) return '<span style="color:var(--bad)">未填</span>';
          if (!Util.isIp(v)) return '<span style="color:var(--bad)">格式错：' + Util.esc(v) + '</span>';
          if (issues.dupIp[v]) return '<span style="color:var(--warn)" title="与 ' +
            Util.esc(issues.dupIp[v].filter(x => x !== row.id).join('、')) + ' 重复">' +
            Util.esc(v) + ' ⚠</span>';
          return Util.esc(v);
        } },
      { key: 'model', label: '型号', fmt: v => v || '--' },
      { key: 'borrowed', label: '归属', html: v =>
          v ? '<span class="pill p-warn">借用</span>' : '<span class="pill p-wait">自有</span>' },
      { key: 'act', label: '操作', html: (v, row) =>
          '<button class="btn xs" data-led-edit="' + Util.esc(row.id) + '">改IP</button>' }
    ];

    const pg = DataTable.paginated(cols, list, _page, 200);

    const dupCount = Object.keys(issues.dupIp).length;
    const invalidCount = Object.keys(issues.invalidIp).length;
    const noIpCount = issues.noIp.length;

    return '' +
      '<div class="cards">' +
        '<div class="card"><div class="lbl">设备总数</div>' +
          '<div class="val">' + Util.num(all.length) + '</div>' +
          '<div class="sub">' + Object.keys(byStation).length + ' 个工站</div></div>' +
        '<div class="card"><div class="lbl">已配 IP</div>' +
          '<div class="val" style="color:var(--ok)">' + Util.num(all.length - noIpCount) + '</div>' +
          '<div class="sub">可接入桥接</div></div>' +
        '<div class="card"><div class="lbl">缺 IP</div>' +
          '<div class="val" style="color:' + (noIpCount ? 'var(--bad)' : 'var(--tx-3)') + '">' +
            Util.num(noIpCount) + '</div></div>' +
        '<div class="card"><div class="lbl">IP 重复 / 格式错</div>' +
          '<div class="val" style="color:' + ((dupCount || invalidCount) ? 'var(--warn)' : 'var(--tx-3)') + '">' +
            dupCount + ' / ' + invalidCount + '</div></div>' +
        '<div class="card"><div class="lbl">借用设备</div>' +
          '<div class="val">' + Util.num(all.filter(d => d.borrowed).length) + '</div></div>' +
      '</div>' +

      (dupCount || invalidCount || noIpCount
        ? '<div class="note warn">存在 ' + (dupCount + invalidCount + noIpCount) +
          ' 处问题，点「只看异常」筛选后逐条修正。IP 重复会导致桥接把数据归到错误的设备上。</div>'
        : '<div class="note ok">IP 映射无异常，可作为桥接服务的连接清单。</div>') +

      '<div class="toolbar">' +
        '<select class="form-select" id="ledFStation" style="width:150px">' +
          '<option value="">全部工序</option>' +
          Object.keys(byStation).sort().map(k =>
            '<option value="' + Util.esc(k) + '"' + (_filter.station === k ? ' selected' : '') + '>' +
            Util.esc(k) + '（' + byStation[k] + '）</option>').join('') +
        '</select>' +
        '<input class="form-input" id="ledFKw" style="width:200px" placeholder="搜编号 / IP / 机柜 / 型号" value="' +
          Util.esc(_filter.keyword) + '">' +
        '<label class="legend-chk"><input type="checkbox" id="ledFIssue"' +
          (_filter.onlyIssue ? ' checked' : '') + '> 只看异常</label>' +
        '<span class="spacer" style="flex:1"></span>' +
        '<button class="btn" id="ledExportCsv">导出 CSV</button>' +
        '<button class="btn" id="ledExportBridge">导出桥接清单</button>' +
        '<button class="btn danger" id="ledClear">清空台账</button>' +
      '</div>' +

      pg.html;
  }

  function bindList() {
    const body = document.getElementById('ledBody');
    if (!body) return;

    const st = body.querySelector('#ledFStation');
    if (st) st.onchange = () => { _filter.station = st.value; _page = 1; renderBody(); };
    const kw = body.querySelector('#ledFKw');
    if (kw) kw.oninput = Util.debounce(() => {
      _filter.keyword = kw.value.trim(); _page = 1; renderBody();
    }, 300);
    const is = body.querySelector('#ledFIssue');
    if (is) is.onchange = () => { _filter.onlyIssue = is.checked; _page = 1; renderBody(); };

    body.addEventListener('click', async e => {
      if (e.target.closest('#ledExportCsv')) {
        Util.download('设备台账_' + Util.tsTag() + '.csv', Registry.toCsv(App.devices));
        Toast.ok('已导出 ' + App.devices.length + ' 台设备');
        return;
      }
      if (e.target.closest('#ledExportBridge')) {
        const list = Registry.toBridgeList(App.devices);
        Util.download('桥接连接清单_' + Util.tsTag() + '.json',
          JSON.stringify({
            说明: '供桥接服务用的机台连接清单：每项含 IP 与所属工站/设备',
            生成时间: Util.nowStr(),
            总数: list.length,
            机台: list
          }, null, 2), 'application/json;charset=utf-8');
        Toast.ok('已导出 ' + list.length + ' 个机台');
        return;
      }
      if (e.target.closest('#ledClear')) {
        const ok = await Modal.confirm({
          title: '清空设备台账',
          html: '将删除设备清单与 IP 映射，拓扑退回「按工站配置合成」模式。<br>' +
                '⚙️ 盘位测试数据与记录<b>不受影响</b>。',
          okText: '清空', danger: true
        });
        if (!ok) return;
        await App.saveDevices([]);
        Topology.setRegistry(null);
        render();
        App.switchView(App.state.curView);
        Toast.ok('已清空设备台账');
        return;
      }
      const ed = e.target.closest('[data-led-edit]');
      if (ed) { editIp(ed.dataset.ledEdit); return; }
      const pg = e.target.closest('[data-pg]');
      if (pg) {
        _page = DataTable.handlePage(pg.dataset.pg, _page, App.devices.length, 200);
        renderBody();
      }
    });
  }

  async function editIp(id) {
    const d = App.devices.filter(x => x.id === id)[0];
    if (!d) return;
    const v = await Modal.prompt({
      title: '修改设备 IP',
      text: d.id + '（' + d.station + (d.cabinet ? ' · ' + d.cabinet : '') + '）',
      value: d.ip,
      hint: '留空表示该设备暂不接入。格式须为 IPv4。'
    });
    if (v == null) return;
    const ip = String(v).trim();
    if (ip && !Util.isIp(ip)) { Toast.warn('IP 格式不正确'); return; }
    const dup = App.devices.filter(x => x.ip === ip && x.id !== id)[0];
    if (dup) {
      const go = await Modal.confirm({
        title: 'IP 重复', html: 'IP <b>' + Util.esc(ip) + '</b> 已被 <b>' + Util.esc(dup.id) +
          '</b> 占用。仍然保存吗？', okText: '仍然保存', danger: true
      });
      if (!go) return;
    }
    d.ip = ip;
    await App.saveDevices(App.devices);
    renderBody();
    Toast.ok('已更新');
  }

  /* ==========================================================================
     文件选择与解析
     ========================================================================== */
  function pickFile() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.xlsx';
    input.onchange = () => { if (input.files[0]) handleFile(input.files[0]); };
    input.click();
  }

  async function handleFile(file) {
    if (!/\.xlsx$/i.test(file.name)) {
      Toast.error('只支持 .xlsx 格式（老式 .xls 请另存为 .xlsx）');
      return;
    }
    _busy = true; _fileName = file.name; renderBody();
    try {
      const buf = await file.arrayBuffer();
      const wb = await Xlsx.parse(buf);
      if (!wb.sheets.length) throw new Error('工作簿里没有工作表');
      // 取第一张有内容的表；本项目台账都是单表
      const sheet = wb.sheets.reduce((a, b) =>
        (b.rows && b.rows.length > (a.rows ? a.rows.length : 0)) ? b : a, wb.sheets[0]);
      _parsed = Ledger.parse(sheet);
      _registry = Registry.fromLedger(_parsed, { skipFaulty: OPTS.skipFaulty });
      _busy = false;
      renderBody();
    } catch (e) {
      _busy = false; _parsed = null; _registry = null;
      console.error('[Ledger] 解析失败：', e);
      Toast.error('解析失败：' + e.message, file.name);
      renderBody();
    }
  }

  /* ==========================================================================
     应用导入
     ========================================================================== */
  async function apply() {
    if (!_registry) return;
    const go = await Modal.confirm({
      title: '应用设备台账',
      html: '将写入 <b>' + Util.num(_registry.devices.length) + '</b> 台设备' +
            (OPTS.applyCounts ? '，并把各工站设备数改为台账实测值' : '（不改动工站配置）') +
            '。<br><br>⚠️ 设备编号会变为真实机柜号+位号（如 S35#-3）。' +
            '已存在的盘位测试数据按<b>旧编号</b>存储，切换后不会自动迁移，' +
            '建议先到「导出中心」备份。',
      okText: '确认应用'
    });
    if (!go) return;

    try {
      /* 1. 工站设备数 */
      if (OPTS.applyCounts) {
        const counts = Registry.countsFromLedger(_registry.devices);
        const ov = {};
        Object.keys(counts).forEach(k => {
          const base = ST[k];
          if (!base) return;
          if (counts[k] !== base.count) ov[k] = { count: counts[k] };
        });
        App.cfg.stationOverride = ov;
        LocalStore.save();
        Topology.invalidate();
      }

      /* 2. 设备清单落库 */
      await App.saveDevices(_registry.devices);

      /* 3. 切换拓扑到台账模式 */
      Topology.setRegistry(App.devices);
      Topology.invalidate();

      /* 4. 盘位表清理：旧编号的盘位在新拓扑下已无意义 */
      const valid = new Set();
      Topology.all(App.cfg).equipment.forEach(eq => {
        eq.slotKeys.forEach(k => valid.add(k));
      });
      const stale = (await Repo.getAllSlots()).filter(s => !valid.has(s.key));
      if (stale.length) {
        await Repo.removeWhere('slots', s => !valid.has(s.key));
        console.warn('[Ledger] 清理了 ' + stale.length + ' 条旧编号盘位');
      }

      await App.loadAll();
      Modal.closeById('ledger');
      App.switchView(App.state.curView);
      App.refreshStatus();

      Toast.ok('设备 ' + Util.num(App.devices.length) + ' 台已导入' +
        (stale.length ? '，清理旧编号盘位 ' + Util.num(stale.length) + ' 条' : '') +
        '。拓扑已切换为「真实台账」模式。', '导入完成');
    } catch (e) {
      console.error('[Ledger] 应用失败：', e);
      Toast.error('应用失败：' + e.message);
    }
  }

  /* ==========================================================================
     事件绑定（模态内委托）
     ========================================================================== */
  document.addEventListener('click', e => {
    const drop = e.target.closest('#ledDrop');
    if (drop) { pickFile(); return; }
    const f = e.target.closest('#ledFile');
    if (f) return;
    if (e.target.closest('#ledApply')) { apply(); return; }
    if (e.target.closest('#ledCancel')) {
      _parsed = null; _registry = null; renderBody(); return;
    }
  });

  document.addEventListener('change', e => {
    const o = e.target.closest('[data-led-opt]');
    if (!o) return;
    OPTS[o.dataset.ledOpt] = o.checked;
    // 借用/故障开关会改变台账构成，需重新生成预览
    if (_parsed && (o.dataset.ledOpt === 'skipFaulty' || o.dataset.ledOpt === 'includeBorrowed')) {
      _registry = Registry.fromLedger(_parsed, { skipFaulty: OPTS.skipFaulty });
      renderBody();
    }
  });

  /* 拖放 */
  document.addEventListener('dragover', e => {
    const dz = e.target.closest && e.target.closest('#ledDrop');
    if (dz) { e.preventDefault(); dz.classList.add('over'); }
  });
  document.addEventListener('dragleave', e => {
    const dz = e.target.closest && e.target.closest('#ledDrop');
    if (dz) dz.classList.remove('over');
  });
  document.addEventListener('drop', e => {
    const dz = e.target.closest && e.target.closest('#ledDrop');
    if (!dz) return;
    e.preventDefault();
    dz.classList.remove('over');
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) handleFile(f);
  });

  return { open };
})();


/* ==========================================================================
   src/dev/mock.js
   ========================================================================== */
/* ============================================================================
   模拟数据生成器 —— 用于界面验收与开发调试
   ----------------------------------------------------------------------------
   与 RDIMM 的 dev-testdata.js 同定位，但改进了两点：
     · 用确定性种子，同一 seed 产出完全一致的数据，便于复现问题
     · 盘位数据量大（12,737），生成后只写非空盘位，避免无谓占用

   ⚠️ 这是开发工具，会在真实库里写入假数据。
      正式使用前请到「导出中心 → 清空数据」清掉。
   ============================================================================ */

const Mock = (() => {

  const PN_POOL = [
    { pn: 'LVA-SSD-960G-A1', model: 'Lava 960G' },
    { pn: 'LVA-SSD-1T92-B3', model: 'Lava 1.92T' },
    { pn: 'LVA-SSD-3T84-C2', model: 'Lava 3.84T' },
    { pn: 'LVA-SSD-7T68-D1', model: 'Lava 7.68T' }
  ];
  const WO_POOL = [
    { no: 'WO26092901', pi: 1, qty: 1000, customer: '标准订单' },
    { no: 'WO26092807', pi: 0, qty: 500,  customer: '标准订单' },
    { no: 'WO26092912', pi: 2, qty: 300,  customer: '定制订单' }
  ];
  /* 各工站典型装载率（贴近真实节拍：箱类接近满载，服务器类略低） */
  const FILL = { ICT: 0.90, FUNCTION: 0.85, BIST: 0.94, ESS: 0.92,
                 FINAL: 0.78, ORT: 0.90, CUS: 0.82 };

  let _rnd = Math.random;
  let _seq = 0;
  function ri(a, b) { return a + Math.floor(_rnd() * (b - a + 1)); }
  function pick(a) { return a[Math.floor(_rnd() * a.length)]; }
  function sn() { _seq++; return 'LVA260929-' + Util.pad(_seq, 5); }

  /* --------------------------------------------------------------------------
     生成一套完整数据并写库
       opts: { seed, onProgress }
       onProgress: (done, total, label)
     -------------------------------------------------------------------------- */
  async function generate(cfg, opts) {
    const o = opts || {};
    const seed = o.seed || 20260929;
    _rnd = Util.seededRandom(seed);
    _seq = 0;

    const topo = Topology.all(cfg);
    const now = Date.now();
    const slotBatch = [];
    const records = [];
    const bad = [];
    const error = [];
    const logindex = [];
    const total = topo.totalSlots;
    let done = 0;

    /* 设备状态：同柜服务器状态相关，模拟「整柜掉线」这类真实故障 */
    const eqStates = {};
    topo.equipment.forEach(eq => {
      const roll = _rnd();
      let st = 'run';
      if (roll < 0.05) st = 'fault';
      else if (roll < 0.09) st = 'maint';
      else if (_rnd() < 0.10) st = 'idle';
      eqStates[eq.id] = st;
    });

    topo.equipment.forEach(eq => {
      const s = ST[eq.station];
      const eqState = eqStates[eq.id];
      const base = FILL[eq.station] || 0.8;
      let fill;
      if (eqState === 'idle')       fill = _rnd() * 0.35;
      else if (eqState === 'maint') fill = _rnd() * 0.08;
      else                          fill = Math.min(1, base + (_rnd() - 0.5) * 0.22);
      const occupied = Math.round(eq.capacity * fill);

      for (let i = 0; i < eq.capacity; i++) {
        done++;
        if (i >= occupied) continue;               // 空位不落库

        const wo = WO_POOL[Math.floor(_rnd() * WO_POOL.length)];
        const pn = PN_POOL[wo.pi];
        const snv = sn();

        // 状态分布：多数在测，少量通过/失败/异常
        const r = _rnd();
        let state;
        if (eqState === 'fault' && i < 4) state = 'abort';
        else if (r < 0.70) state = 'testing';
        else if (r < 0.955) state = 'pass';
        else if (r < 0.965) state = 'fail';
        else state = 'abort';

        const progress = state === 'testing' ? 0.05 + _rnd() * 0.9 : (state === 'pass' || state === 'fail' ? 1 : 0.4);
        const startTime = now - s.cycleMin * 60000 * progress;
        const endTime = (state === 'pass' || state === 'fail') ? startTime + s.cycleMin * 60000 : null;
        const errCode = state === 'fail'
          ? pick(['E-ICT-102', 'E-FN-311', 'E-BIST-407', 'E-ESS-220', 'E-CUS-118'])
          : '';
        const result = state === 'pass' ? 'pass' : state === 'fail' ? 'fail'
                     : state === 'abort' ? 'abort' : '';

        slotBatch.push(Schema.newSlot({
          station: eq.station, equipmentId: eq.id, slotIndex: i,
          cabinetId: eq.cabinetId, serverId: eq.serverId, boxId: eq.boxId,
          state, sn: snv, pn: pn.pn, model: pn.model, woNo: wo.no,
          result, errCode, startTime, endTime,
          retestRound: state === 'fail' && _rnd() < 0.3 ? 1 : 0,
          source: 'mock'
        }));

        /* 测试记录：每条非在测的盘位都有记录 */
        if (result) {
          records.push(Object.assign({}, Schema.newSlot({}), {}, {
            dedupKey: Schema.dedupKey({ sn: snv, station: eq.station, endTime: endTime || startTime }),
            sn: snv, station: eq.station, result: result.toUpperCase(),
            pn: pn.pn, model: pn.model, woNo: wo.no,
            cabinetId: eq.cabinetId, serverId: eq.serverId, boxId: eq.boxId,
            slotIndex: i, errCode,
            time: endTime || startTime, day: Util.todayKey(new Date(endTime || startTime)),
            source: 'mock', handled: _rnd() < 0.7
          }));
        }
      }

      if (o.onProgress && done % 4000 < eq.capacity) o.onProgress(done, total, eq.station);
    });

    /* 按工站 / 日期 / 工单限制 FAIL 数量，防止小样本的随机波动让良率低于 95%。
       口径与看板一致：PASS / (PASS + FAIL)，在测与 ABORT 不入分母。
       在派生不良前同步修正盘位和记录，保证各处显示的结果一致。 */
    const resultGroups = new Map();
    const slotsBySn = new Map(slotBatch.map(x => [x.sn, x]));
    records.forEach(rec => {
      if (rec.result !== 'PASS' && rec.result !== 'FAIL') return;
      const key = JSON.stringify([rec.station, rec.day, rec.woNo]);
      if (!resultGroups.has(key)) resultGroups.set(key, { total: 0, fails: [] });
      const group = resultGroups.get(key);
      group.total++;
      if (rec.result === 'FAIL') group.fails.push(rec);
    });
    resultGroups.forEach(group => {
      const maxFails = Math.floor(group.total / 20);
      // 用同一随机种子选取保留的失败样本，避免偏向前面的设备。
      for (let i = group.fails.length - 1; i > 0; i--) {
        const j = ri(0, i);
        [group.fails[i], group.fails[j]] = [group.fails[j], group.fails[i]];
      }
      group.fails.slice(maxFails).forEach(rec => {
        rec.result = 'PASS';
        rec.errCode = '';
        const slot = slotsBySn.get(rec.sn);
        slot.state = 'pass';
        slot.result = 'pass';
        slot.errCode = '';
        slot.retestRound = 0;
      });
    });

    /* 不良记录：从 FAIL 盘位派生 */
    const failSlots = slotBatch.filter(x => x.state === 'fail');
    failSlots.forEach(x => {
      const judgementId = Util.uid('jdg');
      const verdict = 'functional';
      bad.push(Schema.newBad({
        station: x.station, cabinetId: x.cabinetId, serverId: x.serverId,
        slotIndex: x.slotIndex, boxId: x.boxId,
        sn: x.sn, pn: x.pn, model: x.model, woNo: x.woNo,
        type: pick(['ICT电气不良', '功能测试失败', '老化早期失效', '应力失效', '客制化失败']),
        errCode: x.errCode, verdict, confirmed: true,
        confirmedBy: '自动判定', confirmedAt: now, judgementId,
        time: x.endTime || now, source: 'mock'
      }));
    });
    /* 掺入一些待确认（unknown）不良，验证待确认队列 */
    const unknownCount = Math.min(24, Math.floor(failSlots.length * 0.18));
    for (let i = 0; i < unknownCount && i < failSlots.length; i++) {
      const x = failSlots[i];
      bad.push(Schema.newBad({
        station: x.station, cabinetId: x.cabinetId, serverId: x.serverId,
        slotIndex: x.slotIndex, boxId: x.boxId,
        sn: x.sn, pn: x.pn, model: x.model, woNo: x.woNo,
        type: '待确认', errCode: '', verdict: 'unknown', confirmed: false,
        time: x.endTime || now, source: 'mock',
        note: '未命中任何判定规则，等待人工确认'
      }));
    }

    /* 报错记录：从 ABORT 盘位与故障设备派生 */
    slotBatch.filter(x => x.state === 'abort').slice(0, 60).forEach(x => {
      error.push(Schema.newError({
        station: x.station, cabinetId: x.cabinetId, serverId: x.serverId,
        boxId: x.boxId, equipmentId: x.equipmentId, slotIndex: x.slotIndex,
        sn: x.sn,
        type: pick(['设备通讯中断', '测试超时', '进程被中断', '箱体温度告警', '服务器掉线']),
        message: pick(['连接超时', '未收到结束信号', '进程异常退出', '温度超出阈值', '心跳丢失']),
        count: ri(1, 4), handled: _rnd() < 0.4,
        time: x.startTime || now, source: 'mock',
        dedupKey: [x.station, x.equipmentId, x.slotIndex, 'mock'].join('|')
      }));
    });
    Object.keys(eqStates).forEach(id => {
      if (eqStates[id] !== 'fault') return;
      const eq = topo.equipment.filter(e => e.id === id)[0];
      if (!eq) return;
      error.push(Schema.newError({
        station: eq.station, cabinetId: eq.cabinetId, serverId: eq.serverId,
        equipmentId: eq.id,
        type: '服务器掉线', message: '设备状态为故障，连续巡检无响应',
        count: ri(2, 9), handled: false, time: now - ri(1, 20) * 3600000,
        source: 'mock', dedupKey: [eq.station, eq.id, 'offline'].join('|')
      }));
    });

    /* 工单 */
    const workOrders = WO_POOL.map(w => {
      const wo = WorkOrder.create({
        no: w.no, pn: PN_POOL[w.pi].pn, model: PN_POOL[w.pi].model,
        qty: w.qty, customer: w.customer, status: 'running',
        acceptedBy: '张工', acceptedAt: now - 86400000
      });
      wo.status = 'running';
      return wo;
    });

    /* 日志索引 */
    const stationKeys = Topology.effectiveStations(cfg).map(s => s.key);
    stationKeys.forEach((st, i) => {
      logindex.push(Schema.newLogIndex({
        path: '/lava/logs/' + st + '/' + st + '_20260929_' + (120000 + i * 137) + '.log',
        name: st + '_20260929.log', station: st,
        size: ri(20000, 900000), parsed: ri(50, 900),
        hits: { PASS: ri(20, 400), FAIL: ri(0, 20), TIMEOUT: ri(0, 8) }
      }));
    });

    /* --------------------------------------------------------------------------
       写库：分块，避免一次性构造上万个对象阻塞主线程
       -------------------------------------------------------------------------- */
    await Repo.clearSlots();
    const CH = 3000;
    for (let i = 0; i < slotBatch.length; i += CH) {
      await Repo.putSlots(slotBatch.slice(i, i + CH));
      if (o.onProgress) o.onProgress(Math.min(total, done), total, '写入盘位 ' + (i + CH));
      await new Promise(r => setTimeout(r, 0));
    }

    await Repo.clearTable('records');
    for (let i = 0; i < records.length; i += 2000) {
      await Repo.putMany('records', records.slice(i, i + 2000));
    }
    await Repo.clearTable('bad');
    await Repo.putMany('bad', bad);
    await Repo.clearTable('error');
    await Repo.putMany('error', error);
    await Repo.clearTable('logindex');
    await Repo.putMany('logindex', logindex);
    /* 工单必须落库 —— 否则界面上的工单页会是空的 */
    await Repo.clearTable('workorders');
    await Repo.putMany('workorders', workOrders);
    await Repo.clearTable('ledger');
    await Repo.ledgerMark(records.map(r => r.dedupKey).slice(0, 50000));
    /* 盘位与记录分属两套表，台账也要标记，避免后续真实拉取重复入库 */
    await Repo.ledgerMark(slotBatch.map(s => s.key).slice(0, 50000));

    await Repo.metaSet('mockSeed', seed);
    await Repo.metaSet('mockAt', now);

    return {
      seed,
      slots: slotBatch.length,
      capacity: total,
      records: records.length,
      bad: bad.length,
      badPending: bad.filter(b => !b.confirmed).length,
      error: error.length,
      workOrders: workOrders.length,
      logindex: logindex.length,
      eqStates,
      workOrderList: workOrders
    };
  }

  /* 清空全部数据 */
  async function clearAll() {
    await Repo.clearAll();
    return true;
  }

  return { generate, clearAll, PN_POOL, WO_POOL };
})();


/* ==========================================================================
   src/main.js
   ========================================================================== */
/* ============================================================================
   主控 —— 运行时状态、视图路由、初始化
   ----------------------------------------------------------------------------
   App 是全局运行时缓存：配置来自 localStorage，大数据来自 Repo。
   盘位在内存里保留一份 Map（只含非空盘位），视图直接读它，
   避免每次渲染都去 IndexedDB 查 12,737 条。
   ============================================================================ */

const App = (() => {

  const state = {
    cfg: null,
    slots: new Map(),          // slotKey → slot 对象（仅非空）
    eqStates: {},              // equipmentId → run|idle|fault|maint
    workOrders: [],
    devices: [],               // 设备台账（真实设备身份与位置/IP）
    eqRuntime: {},             // 设备运行时状态（SSH 巡检写入）
    lastSshAt: 0,              // 最近一次巡检时间
    records: null,             // 懒加载缓存
    bad: null,
    error: null,
    logindex: null,
    curView: 'floor',
    canPatch: false,           // 首屏渲染完成后才允许增量补丁
    lastChanged: null,
    ticks: { render: null, ssh: null, slt: null },
    bootedAt: Date.now()
  };

  /* ==========================================================================
     数据访问
     ========================================================================== */
  function pendingBadKeys() {
    const set = new Set();
    (state.bad || []).forEach(b => {
      if (b.confirmed) return;
      if (b.slotIndex == null) return;
      set.add(Schema.slotKey(b.station, b.serverId || b.equipmentId || '', b.slotIndex));
    });
    return set;
  }

  /* 设备状态
     优先级：SSH 巡检实测 > 模拟数据 > 按盘位占用粗判
     巡检才是真相 —— 模拟数据与占用推断只是没有巡检时的占位。 */
  function eqState(station, equipmentId) {
    // ① SSH 巡检结果（最可信）
    const rt = state.eqRuntime && state.eqRuntime[equipmentId];
    if (rt && rt.errorKind && rt.errorKind !== 'none') return 'fault';
    if (rt && rt.power === 'off') return 'idle';      // 关机视为空闲而非故障
    if (rt && rt.power === 'on') return rt.testing ? 'run' : 'idle';

    // ② 模拟数据（开发/演示）
    const k = station + '|' + equipmentId;
    if (state.eqStates[k] != null) return state.eqStates[k];

    // ③ 兜底：按盘位占用粗判
    const eqs = (Topology.all(state.cfg).stationsMap[station] || [])
      .filter(e => e.id === equipmentId)[0];
    if (!eqs) return 'idle';
    let used = 0;
    for (let i = 0; i < eqs.capacity; i++) {
      const r = state.slots.get(eqs.slotKeys[i]);
      if (r && r.state !== 'empty') used++;
    }
    return used > 0 ? 'run' : 'idle';
  }

  /* 设备运行时的详细信息（供 tooltip 展示「N 秒前巡检」这类新鲜度信息） */
  function eqRuntime(equipmentId) {
    return (state.eqRuntime && state.eqRuntime[equipmentId]) || null;
  }

  /* 巡检快照的整体新鲜度 */
  function sshFreshness() {
    if (!state.lastSshAt) return { level: 'none', text: '未巡检', sec: null };
    return Util.freshness(state.lastSshAt);
  }

  async function loadAll() {
    const t0 = Date.now();
    const all = await Repo.getAllSlots();
    state.slots = new Map();
    all.forEach(s => { if (s.state && s.state !== 'empty') state.slots.set(s.key, s); });
    state.bad = await Repo.query('bad', null, { limit: 200000 });
    state.error = await Repo.query('error', null, { limit: 200000 });
    state.workOrders = await Repo.query('workorders', null, { limit: 5000 });

    /* 设备台账：有则切到「真实台账」拓扑模式，设备编号 = 真实机柜号+位号 */
    state.devices = await Repo.query('devices', null, { limit: 50000 });
    Topology.setRegistry(state.devices.length ? state.devices : null);

    console.info('[App] 载入 ' + state.slots.size + ' 个非空盘位' +
      '，设备台账 ' + state.devices.length + ' 台' +
      '，拓扑来源 ' + Topology.all(state.cfg).source +
      '，耗时 ' + (Date.now() - t0) + 'ms');
    return state.slots.size;
  }

  /* 保存设备台账（整体替换） */
  async function saveDevices(list) {
    await Repo.clearTable('devices');
    if (list && list.length) {
      const CH = 2000;
      for (let i = 0; i < list.length; i += CH) {
        await Repo.putMany('devices', list.slice(i, i + CH));
      }
    }
    state.devices = (list || []).slice();
    Topology.setRegistry(state.devices.length ? state.devices : null);
    return state.devices.length;
  }

  /* 写盘位并记录变更集，供视图增量补丁 */
  async function saveSlots(slots) {
    await Repo.putSlots(slots);
    slots.forEach(s => {
      if (s.state === 'empty' && !s.sn) state.slots.delete(s.key);
      else state.slots.set(s.key, s);
    });
    state.lastChanged = new Set(slots.map(s => s.key));
    Bus.emit(EVT.SLOTS_CHANGED, { keys: state.lastChanged });
    return slots.length;
  }

  /* ==========================================================================
     视图路由
     ========================================================================== */
  const RENDERERS = {
    /* 平面图分两步：先渲染卡片骨架，再挂载已展开的盘位网格
       （网格是 DOM 引用级操作，没法在字符串拼接阶段完成） */
    floor: async () => { await ViewFloor.render(); ViewFloor.afterRender(); },
    board: () => ViewBoard.render(),
    daily: () => ViewDaily.render(),
    stats: () => ViewStats.render(),
    bad: () => ViewBad.render(),
    error: () => ViewError.render(),
    pull: () => ViewPull.render(),
    wo: () => ViewWo.render(),
    log: () => ViewLog.render(),
    trace: () => ViewTrace.render()
  };

  /* 渲染序号：视图渲染函数是 async（要先 await 数据），快速切换时
     旧渲染可能晚于新渲染返回。每次切换递增序号并在完成后比对，
     过期结果直接丢弃，避免「已经切走了还在往里写」的串台。 */
  let _renderSeq = 0;

  async function switchView(key) {
    const v = VIEWS.filter(x => x.key === key)[0];
    if (!v) return;
    state.curView = key;
    LocalStore.ui.set('curView', key);
    Dom.$$('#viewTabs .tab').forEach(t => t.classList.toggle('active', t.dataset.view === key));
    Dom.$$('.view').forEach(el => el.classList.toggle('active', el.id === 'view-' + key));

    const seq = ++_renderSeq;
    try {
      const fn = RENDERERS[key];
      if (fn) await fn();
      if (seq !== _renderSeq) return;       // 已被更晚的切换取代
    } catch (e) {
      if (seq !== _renderSeq) return;
      console.error('[App] 渲染 ' + key + ' 出错：', e);
      Toast.error('「' + v.name + '」渲染出错：' + e.message);
    }
    Bus.emit(EVT.VIEW_SWITCH, key);
  }

  /* ==========================================================================
     盘位详情抽屉
     ========================================================================== */
  function openSlotDetail(key) {
    const rec = state.slots.get(key);
    if (!rec) { Toast.warn('该盘位为空'); return; }
    const loc = Topology.locate(state.cfg, key);
    const st = ST[loc.station];
    const wo = state.workOrders.filter(w => w.no === rec.woNo)[0];
    const isOrt = Sampling.isSampled(rec.sn);

    // 该 SN 在各工站的记录（懒加载）
    const recs = (state.records || []).filter(r => r.sn === rec.sn);
    const chain = recs.length
      ? Trace.bySn(rec.sn, recs).chain
      : null;

    // 没有历史记录时，用「当前所在工站」推一条简化链
    const fallbackChain = MAINLINE.concat(['ORT']).map((k, i) => {
      const order = MAINLINE.indexOf(k);
      const curOrder = MAINLINE.indexOf(loc.station);
      let st2 = 'pending';
      if (k === 'ORT') st2 = 'pending';
      else if (order < curOrder) st2 = 'pass';
      else if (order === curOrder) st2 = rec.state === 'testing' ? 'testing'
                                       : rec.state === 'pass' ? 'pass'
                                       : rec.state === 'fail' ? 'fail'
                                       : rec.state === 'abort' ? 'abort' : 'pending';
      return { station: k, state: st2, records: [], last: null,
               bypass: k === 'ORT',
               detail: k === 'ORT' ? (isOrt ? '已抽中（2.5% 抽样）' : '未抽中（2.5% 抽样）') : '' };
    });

    const remaining = rec.state === 'testing' && rec.startTime && st
      ? rec.startTime + st.cycleMin * 60000 - Date.now() : null;

    const body =
      '<dl class="kv">' +
        '<dt>工单</dt><dd>' + Util.esc(rec.woNo || '--') + '</dd>' +
        '<dt>PN / 型号</dt><dd>' + Util.esc(rec.pn || '--') +
          (rec.model ? ' <span style="color:var(--tx-3)">' + Util.esc(rec.model) + '</span>' : '') + '</dd>' +
        '<dt>当前工站</dt><dd>' + Util.esc(st.name + ' · ' + st.cn) + '</dd>' +
        (loc.cabinetId ? '<dt>所属机柜</dt><dd>' + Util.esc(loc.cabinetId) + '</dd>' : '') +
        '<dt>设备</dt><dd>' + Util.esc(loc.equipmentId) + '</dd>' +
        '<dt>位号</dt><dd>第 ' + (loc.slotIndex + 1) + ' 位 / 共 ' + st.capacity + '</dd>' +
        '<dt>当前状态</dt><dd><span class="pill ' + L.statePill(rec.state) + '">' +
          Util.esc(L.slotState(rec.state)) + '</span></dd>' +
        (rec.errCode ? '<dt>错误码</dt><dd style="color:#ff8b82">' + Util.esc(rec.errCode) + '</dd>' : '') +
        (rec.startTime ? '<dt>开始时间</dt><dd>' + Util.fmtFull(rec.startTime) + '</dd>' : '') +
        (remaining != null ? '<dt>预计剩余</dt><dd>' +
          (remaining > 0 ? Util.fmtDur(remaining) : '已超时') + '</dd>' : '') +
        (wo ? '<dt>工单进度</dt><dd>' + Util.esc(wo.no) + ' · ' +
          Util.esc(L.woState(wo.status)) + '</dd>' : '') +
      '</dl>' +
      '<div style="font-size:13px;font-weight:600;margin-bottom:12px">工序流转</div>' +
      Timeline.flow(chain || fallbackChain, { currentStation: loc.station }) +
      (chain ? '' :
        '<div class="note warn" style="margin-top:14px">' +
        '该 SN 暂无历史测试记录，上图按「推断」展示：已过工站标为通过。<br>' +
        '接入真实数据后（SSH / FTP / 本地目录）会显示每站的实际时间与结果。</div>') +
      '<div class="note" style="margin-top:14px">' +
        'ORT 为<b>旁路抽检</b>：按 2.5% 从 FINAL 产出中抽取，不阻塞主线放行。' +
        '本块 SN ' + (isOrt ? '<b style="color:#7fb3ff">已抽中</b>' : '未抽中') + '。</div>';

    const head =
      '<dl class="kv" style="margin-bottom:0">' +
      '</dl>';

    Drawer.open({
      title: rec.sn,
      sub: (rec.model || rec.pn || '') + (rec.woNo ? ' · ' + rec.woNo : ''),
      body,
      actions: '<button class="btn sm" data-detail-trace="1">在追溯页查看</button>',
      onMount(el) {
        el.addEventListener('click', e => {
          if (e.target.closest('[data-detail-trace]')) {
            Drawer.close();
            LocalStore.ui.set('traceQuery', rec.sn);
            switchView('trace');
          }
        });
      }
    });
  }

  /* --------------------------------------------------------------------------
     判定引擎的依赖注入
     领域层（domain/）刻意不引用 store，由这里把存储能力喂给它，
     这样 DefectEngine 保持纯逻辑、可在 Node 下测试。
     -------------------------------------------------------------------------- */
  function defectDeps() {
    return {
      cfg: state.cfg,
      findBad: async (ctx) => (state.bad || []).filter(b =>
        b.sn === ctx.sn && b.station === (ctx.station || '')),
      listBad: async (where, opts) => {
        let list = state.bad || [];
        if (where && where.confirmed !== undefined) {
          list = list.filter(b => !!b.confirmed === !!where.confirmed);
        }
        list = list.slice().sort((a, b) => (b.time || 0) - (a.time || 0));
        return opts && opts.limit ? list.slice(0, opts.limit) : list;
      },
      getBad: async (id) => (state.bad || []).filter(b => b.id === id)[0] || null,
      saveBad: async (b) => {
        await Repo.put('bad', b);
        const list = state.bad || (state.bad = []);
        const i = list.findIndex(x => x.id === b.id);
        if (i >= 0) list[i] = b; else list.unshift(b);
        return b.id;
      },
      saveJudgement: async (j) => Repo.put('judgements', j),
      getJudgement: async (id) => Repo.get('judgements', id)
    };
  }

  /* 确保某类记录已加载（视图按需拉取） */
  async function ensureRecords(which) {
    if (which === 'records' && !state.records) {
      state.records = await Repo.query('records', null, { limit: 200000 });
    }
    if (which === 'bad' && !state.bad)   state.bad = await Repo.query('bad', null, { limit: 200000 });
    if (which === 'error' && !state.error) state.error = await Repo.query('error', null, { limit: 200000 });
    if (which === 'logindex' && !state.logindex) state.logindex = await Repo.query('logindex', null, { limit: 20000 });
    return state[which];
  }
  function invalidate(which) {
    if (which) state[which] = null;
    else { state.records = null; state.bad = null; state.error = null; state.logindex = null; }
  }

  /* ==========================================================================
     顶栏状态
     ========================================================================== */
  async function refreshStatus() {
    const chip = document.getElementById('storageChip');
    if (chip) {
      const label = Repo.backendLabel();
      chip.textContent = '存储：' + label;
      chip.className = 'chip ' + (Repo.isDegraded() ? 'warn' : 'ok');
      const est = await Repo.estimate();
      chip.title = '已用 ' + Util.bytes(est.usage) +
                   (est.quota ? ' / ' + Util.bytes(est.quota) +
                     '（' + (est.usedPct * 100).toFixed(1) + '%）' : '') +
                   '\n后端：' + label +
                   '\n非空盘位：' + Util.num(state.slots.size) + ' / ' + Util.num(Topology.all(state.cfg).totalSlots);
    }
    const bchip = document.getElementById('bridgeChip');
    if (bchip) {
      if (typeof Bridge !== 'undefined') {
        const h = Bridge.peekHealth();
        bchip.textContent = Bridge.healthLabel(h);
        bchip.className = Bridge.healthChipClass(h);
        bchip.title = h.ok
          ? '桥接服务正常' +
            (h.uptimeSec ? '，已运行 ' + Math.floor(h.uptimeSec / 60) + ' 分钟' : '') +
            (h.sshHosts ? '\n巡检机台 ' + h.sshHosts + ' 台' : '') +
            (h.paramiko === false ? '\n未装 paramiko，SSH 仅支持密钥认证' : '')
          : (h.configured
              ? (h.pending ? '正在后台检测桥接连接' : '离线使用：' + (h.error || '')) +
                '\n本地查看、台账导入和导出可正常使用；SSH / FTP 实时接入需要桥接服务。'
              : '尚未配置桥接服务\n浏览器无法直连 FTP/SSH，需经桥接转发');
      } else {
        bchip.textContent = '桥接未配置';
        bchip.className = 'chip';
      }
    }
  }

  /* 降级模式横幅：file:// 下 IndexedDB 不可用时明确告知用户 */
  function renderDegradeBar() {
    const old = document.getElementById('degradeBar');
    if (old) old.remove();
    if (!Repo.isDegraded()) return;
    const isMem = Repo.backend() === 'memory';
    const bar = Dom.el('div', { class: 'degrade-bar', id: 'degradeBar' });
    bar.innerHTML =
      '<span>⚠️ <b>' + (isMem ? '存储不可用' : '降级存储模式') + '</b>：' +
      (isMem
        ? '数据仅存于内存，刷新页面即丢失。请立即到「导出中心」导出备份。'
        : '当前页面以 <code>file://</code> 打开，浏览器禁用了 IndexedDB，' +
          '盘位数据存在紧凑 localStorage 中，容量受限。') +
      '</span>' +
      '<span class="spacer"></span>' +
      (isMem ? '' : '<span>建议：运行 <b>bridge\\启动桥接服务.bat</b>，' +
        '改用 <b>http://127.0.0.1:8770/</b> 打开本页面，可获得完整存储容量。</span>');
    const topbar = document.querySelector('.topbar');
    if (topbar && topbar.parentNode) topbar.parentNode.insertBefore(bar, topbar.nextSibling);
  }

  /* ==========================================================================
     初始化
     ========================================================================== */
  /* 幂等启动：重复调用返回**同一个 Promise**。
     ⚠️ 不能用布尔标志 —— 那会让第二次调用立即返回，而第一次尚未完成，
     调用方以为启动好了就往下走，读到空状态。 */
  let _bootPromise = null;
  function boot() {
    if (_bootPromise) return _bootPromise;
    _bootPromise = _boot();
    return _bootPromise;
  }

  async function _boot() {
    const t0 = Date.now();
    state.cfg = await LocalStore.init();

    // 主题尽早应用，避免「先按深色画一帧再跳成浅色」的闪屏
    Theme.init();

    // 存储后端探测（IndexedDB → 紧凑 localStorage → 内存）
    await Repo.init();
    console.info('[App] 存储后端：' + Repo.backendLabel());

    DefectEngine.ensureRules(state.cfg);

    await loadAll();

    // 标签页
    Dom.html('viewTabs', VIEWS.filter(v => v.tab).map(v =>
      '<div class="tab' + (v.key === state.curView ? ' active' : '') +
      '" data-view="' + v.key + '">' + v.name + '</div>').join(''));

    // 工站总览条点击 + 标签页切换
    Dom.delegate('viewTabs', 'click', '.tab', (e, el) => switchView(el.dataset.view));

    // 各视图的局部事件
    ViewFloor.bind();
    if (typeof ViewBad !== 'undefined' && ViewBad.bind) ViewBad.bind();
    if (typeof ViewWo !== 'undefined' && ViewWo.bind) ViewWo.bind();
    if (typeof ViewTrace !== 'undefined' && ViewTrace.bind) ViewTrace.bind();
    if (typeof ViewPull !== 'undefined' && ViewPull.bind) ViewPull.bind();

    // 顶栏按钮
    bindTopbar();

    renderDegradeBar();

    // 首屏：必须 await，否则 boot 的 Promise 会在首屏渲染完成前 resolve，
    // 调用方（含冒烟测试）会读到空的视图容器
    const cur = LocalStore.ui.get('curView', 'floor');
    await switchView(VIEWS.some(v => v.key === cur) ? cur : 'floor');
    refreshStatus().catch(e => console.warn('[App] 状态更新失败：', e.message));
    // 网络探测不参与启动：离线时首屏和所有本地按钮仍立即可用。
    Bridge.health().then(() => refreshStatus()).catch(e =>
      console.warn('[App] 桥接状态更新失败：', e.message));

    // 首屏渲染完成，此后允许增量补丁
    state.canPatch = true;

    // 关页前落盘
    window.addEventListener('beforeunload', () => { try { Repo.flush(); } catch (e) { } });

    /* 拖放兜底：浏览器默认行为是「把拖进来的文件当作导航目标」，
       即拖一个文件到页面空白处会直接跳走/触发 file:// 导航拦截告警。
       台账的拖放区自己处理了 preventDefault，但页面其它区域也必须拦掉。 */
    ['dragover', 'drop'].forEach(ev => {
      document.addEventListener(ev, e => {
        const inZone = e.target && e.target.closest && e.target.closest('#ledDrop');
        if (inZone) return;              // 交给台账拖放区自己的处理
        e.preventDefault();
      }, false);
    });

    console.info('[App] 启动完成，耗时 ' + (Date.now() - t0) + 'ms');
    if (!state.slots.size) {
      Toast.info('库里暂无数据。点击顶栏「生成模拟数据」查看完整界面，' +
                 '或到「实时拉取」接入真实数据。', '欢迎使用 Lava_test 看板');
    }
  }

  function bindTopbar() {
    const on = (id, fn) => {
      const el = document.getElementById(id);
      if (el) el.onclick = fn;
    };

    on('btnManualRefresh', () => {
      invalidate();
      loadAll().then(() => {
        switchView(state.curView);
        refreshStatus();
        Bridge.health().then(() => refreshStatus()).catch(e =>
          console.warn('[App] 桥接状态更新失败：', e.message));
        Toast.ok('已刷新');
      });
    });

    on('btnMock', async () => {
      const ok = await Modal.confirm({
        title: '生成模拟数据',
        html: '将按真实车间配置（<b>12,737 个盘位</b>）生成一整套模拟数据，用于界面验收。<br><br>' +
              '⚠️ 这会<b>清空当前库中的盘位与记录数据</b>。若已有正式数据，请先到「导出中心」备份。',
        okText: '生成', danger: true
      });
      if (!ok) return;
      try {
        const r = await Mock.generate(state.cfg, {
          onProgress: (done, total, label) => {
            if (done % 20000 < 3000) console.log('[Mock] ' + done + '/' + total + ' ' + label);
          }
        });
        // 设备状态回填，供平面图显示
        state.eqStates = {};
        Object.keys(r.eqStates).forEach(id => {
          const eq = Topology.all(state.cfg).equipment.filter(e => e.id === id)[0];
          if (eq) state.eqStates[eq.station + '|' + id] = r.eqStates[id];
        });
        invalidate();
        await loadAll();
        switchView(state.curView);
        await refreshStatus();
        Toast.ok('盘位 ' + Util.num(r.slots) + ' / 记录 ' + Util.num(r.records) +
                 ' / 不良 ' + r.bad + '（待确认 ' + r.badPending + '）/ 报错 ' + r.error,
                 '模拟数据已生成');
      } catch (e) {
        console.error('[Mock] 生成失败：', e);
        Toast.error('生成失败：' + e.message);
      }
    });

    on('btnTheme', () => Theme.cycle());

    on('btnExportCenter', () => {
      if (typeof ModalExportCenter !== 'undefined') ModalExportCenter.open();
      else Toast.warn('导出中心将在后续阶段提供');
    });

    on('btnSettings', () => {
      if (typeof ModalSettings !== 'undefined') ModalSettings.open();
      else Toast.warn('系统设置将在后续阶段提供');
    });

    const btnLedger = document.getElementById('btnLedger');
    if (btnLedger) btnLedger.onclick = () => ModalLedger.open('import');

    const btnAuto = document.getElementById('btnAutoRefresh');
    if (btnAuto) {
      btnAuto.onclick = () => {
        if (!Scheduler.isRunning() && !Bridge.configured()) {
          Toast.warn('尚未配置桥接服务。自动刷新主要用于周期拉取与巡检；' +
                     '无桥接时只能刷新本页视图。', '提示');
        }
        const on = Scheduler.toggle();
        btnAuto.classList.toggle('on', on);
      };
    }
  }

  return {
    state, boot, switchView, openSlotDetail,
    pendingBadKeys, eqState, saveSlots, loadAll,
    ensureRecords, invalidate, refreshStatus, renderDegradeBar, defectDeps, saveDevices,
    eqRuntime, sshFreshness,
    get cfg() { return state.cfg; },
    get slots() { return state.slots; },
    get workOrders() { return state.workOrders; },
    get canPatch() { return state.canPatch; },
    get records() { return state.records; },
    get bad() { return state.bad; },
    get error() { return state.error; },
    get logindex() { return state.logindex; },
    get devices() { return state.devices; }
  };
})();

/* 启动 */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => App.boot());
} else {
  App.boot();
}

</script>
</body>
</html>
