        dup.message = h.errorMsg || h.errorHint || '';
        dup.updatedAt = Date.now();
        await Repo.put('error', dup);
      } else {
        const rec = Schema.newError({
          station: eq.station,
          cabinetId: eq.cabinetId,
          equipmentId: eq.id,
          type,
          message: h.errorMsg || h.errorHint || '',
          sn: '',
          day,
          count: 1,
          source: 'ssh',
          dedupKey: key,
          time: h.checkedAt || Date.now()
        });
        existing.unshift(rec);
        await Repo.put('error', rec);
        added++;
      }
    }
    if (added) Bus.emit(EVT.RECORDS_CHANGED, { store: 'error' });
    return added;
  }

  /* --------------------------------------------------------------------------
     按需读取（在「日志分析」等页面用）
     -------------------------------------------------------------------------- */
  async function ls(ip, dir) {
    const r = await Bridge.api('/api/ssh/ls', { ip, dir });
    return (r && r.entries) || [];
  }
  async function cat(ip, file, max) {
    return Bridge.fetchText('/api/ssh/cat', { ip, file, max: max || 524288 });
  }
  async function slt(ip, root) {
    return Bridge.fetchText('/api/ssh/slt', { ip, root });
  }

  return {
    poll, probeNow, applySnapshot, ipIndex, recordAlarms,
    ls, cat, slt,
    lastAt: () => _lastSnapAt,
    lastError: () => _lastError,
    isBusy: () => _busy
  };
})();


/* ==========================================================================
   src/bridge/ftp.js
   ========================================================================== */
/* ============================================================================
   FTP / 本地目录通道（页面侧）
   ----------------------------------------------------------------------------
   扫描 → 增量过滤 → 下载 → 入库。

   增量靠 seenFiles（path → mtime）：只有没见过或 mtime 变了的文件才拉。
   现场日志目录动辄上千个文件，全量拉一遍既慢又没必要。

   原始文件会存一份在 rawfiles 表：日志格式尚未确定，
   等格式明确后可以对历史原始日志**离线重解析**，不必重新拉取。
   ============================================================================ */

const FtpChannel = (() => {

  const MAX_FILE = 32 * 1024 * 1024;      // 单个文件上限，防止拉到大文件卡住
  const LOG_EXT = /\.(log|txt|json|csv|xml|ini|out)$/i;

  let _busy = false;
  let _lastScan = null;

  /* --------------------------------------------------------------------------
     扫描
     -------------------------------------------------------------------------- */
  async function scan(kind, opts) {
    const o = opts || {};
    const ch = kind === 'local' ? 'localDir' : 'ftp';
    if (!Bridge.configured()) {
      throw new Error('未配置桥接服务地址');
    }
    const cfg = App.cfg.channels[ch] || {};

    const path = kind === 'local' ? '/api/localscan' : '/api/scan';
    const params = {
      root: o.root || cfg.path || cfg.basePath || '',
      depth: o.depth || App.cfg.settings.scanDepth || 4,
      limit: o.limit || 3000,
      pattern: o.pattern || ''
    };

    const r = await Bridge.api(path, params, { timeout: 60000 });
    const files = (r && r.files) || [];
    _lastScan = { at: Date.now(), kind, count: files.length, files };
    return files;
  }

  /* 扫描所有启用的根目录，合并结果 */
  async function scanAllRoots(kind) {
    const roots = (App.cfg.scanRoots || []).filter(r => r.enabled);
    const out = [];
    const errors = [];
    for (const root of roots) {
      try {
        const files = await scan(kind, { root: root.path });
        files.forEach(f => {
          f.rootId = root.id;
          f.rootName = root.name;
          f.station = root.station || '';
        });
        out.push.apply(out, files);
      } catch (e) {
        errors.push({ root: root.name, error: e.message });
      }
    }
    return { files: out, errors };
  }

  /* --------------------------------------------------------------------------
     增量过滤
     -------------------------------------------------------------------------- */
  async function pickChanged(files, onlyNew) {
    const list = (files || []).filter(f => !f.isDir);
    if (onlyNew === false) return list;

    const seen = await Repo.metaGet('seenFiles', {});
    const fresh = [], skipped = [];
    list.forEach(f => {
      const prev = seen[f.path];
      if (prev === undefined || prev !== f.mtime) fresh.push(f);
      else skipped.push(f);
    });
    return fresh;
  }

  async function markSeen(files) {
    const seen = await Repo.metaGet('seenFiles', {});
    (files || []).forEach(f => { seen[f.path] = f.mtime; });
    // 只保留最近的 20000 条，避免无限增长
    const keys = Object.keys(seen);
    if (keys.length > 20000) {
      keys.slice(0, keys.length - 20000).forEach(k => { delete seen[k]; });
    }
    await Repo.metaSet('seenFiles', seen);
  }

  /* --------------------------------------------------------------------------
     拉取并入库
     -------------------------------------------------------------------------- */
  async function pull(kind, opts) {
    if (_busy) { Toast.warn('上一轮拉取还在进行中'); return null; }
    const o = opts || {};
    _busy = true;

    const stat = { scanned: 0, changed: 0, pulled: 0, skipped: 0, failed: 0,
                   bytes: 0, records: 0, errors: [] };
    try {
      Toast.info('正在扫描远端日志…');
      let files = o.files;
      if (!files) {
        const r = await scanAllRoots(kind);
        files = r.files;
        stat.errors.push.apply(stat.errors, r.errors);
      }
      stat.scanned = files.length;

      const maxFiles = o.maxFiles || App.cfg.settings.maxFilesPerRun || 80;
      const candidates = files
        .filter(f => LOG_EXT.test(f.name) || /_log\.zip$/i.test(f.name))
        .filter(f => !f.size || f.size <= MAX_FILE)
        .slice(0, maxFiles);

      const todo = await pickChanged(candidates, o.onlyNew);
      stat.changed = todo.length;
      stat.skipped = candidates.length - todo.length;

      if (!todo.length) {
        Toast.ok('扫描 ' + stat.scanned + ' 个文件，无新增或变化');
        return stat;
      }

      Toast.info('需拉取 ' + todo.length + ' 个文件（已跳过未变化的 ' + stat.skipped + ' 个）');

      for (let i = 0; i < todo.length; i++) {
        const f = todo[i];
        try {
          const got = await download(kind, f);
          stat.pulled++;
          stat.bytes += got.buffer.byteLength;

          const text = await decodeMaybe(got.buffer);
          await Repo.put('rawfiles', {
            path: f.path,
            name: f.name,
            station: f.station || '',
            size: got.buffer.byteLength,
            mtime: f.mtime || got.mtime || null,
            pulledAt: Date.now(),
            text: text.length > 400000 ? text.slice(0, 400000) : text,
            truncated: text.length > 400000
          });

          const n = await ingestText(text, f);
          stat.records += n;
        } catch (e) {
          stat.failed++;
          stat.errors.push({ file: f.name, error: e.message });
        }
        if ((i + 1) % 10 === 0) Toast.info('已拉取 ' + (i + 1) + ' / ' + todo.length + '…');
      }

      await markSeen(todo);
      await Repo.metaSet('lastPullAt', Date.now());

      Bus.emit(EVT.DATA_LOADED, stat);
      Toast.ok('拉取 ' + stat.pulled + ' 个文件（' + Util.bytes(stat.bytes) + '）' +
               (stat.failed ? '，失败 ' + stat.failed : '') +
               (stat.records ? '，解析出 ' + Util.num(stat.records) + ' 条记录' : ''),
               '拉取完成');
      return stat;
    } catch (e) {
      console.error('[Ftp] 拉取失败：', e);
      Toast.error('拉取失败：' + e.message);
      return null;
    } finally {
      _busy = false;
    }
  }

  async function download(kind, f) {
    if (kind === 'local') {
      const p = f.absPath || f.path;
      return Bridge.fetchBin('/api/localfile', { path: p });
    }
    return Bridge.fetchBin('/api/file', { path: f.path });
  }

  /* 尝试按 UTF-8 解码；解不出就按 GBK 再试（现场日志常是 GBK） */
  async function decodeMaybe(buffer) {
    const bytes = new Uint8Array(buffer);
    try {
      const t = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
      return t;
    } catch (e) {
      try {
        return new TextDecoder('gbk').decode(bytes);
      } catch (e2) {
        return new TextDecoder('utf-8', { fatal: false }).decode(bytes);
      }
    }
  }

  /* --------------------------------------------------------------------------
     入库：日志格式未定，先做「原始留档 + 关键词扫描 + 可配置抽取」
     -------------------------------------------------------------------------- */
  async function ingestText(text, file) {
    /* 解析器注册表：目前只有通用实现，现场样例到位后按需增加解析器，
       调用方不用改（这正是把解析做成注册表而不是写死分支的原因）。 */
    if (typeof Pipeline !== 'undefined' && Pipeline.ingest) {
      return Pipeline.ingest(text, {
        fileName: file.name,
        filePath: file.path,
        station: file.station || '',
        rootId: file.rootId || '',
        // 传文件 mtime：日志没带时间戳时用它兜底。
        // 必须是文件自身的确定性属性，不能用当前时间，否则幂等失效。
        mtime: file.mtime || null,
        source: 'ftp'
      });
    }
    // 退路：至少做一次关键词扫描并把命中数记进日志索引
    const scan = Highlight.scan(App.cfg, text, 500);
    await Repo.put('logindex', Schema.newLogIndex({
      path: file.path, name: file.name, station: file.station || '',
      size: (file.size || text.length), mtime: file.mtime || null,
      pulledAt: Date.now(), parsed: 0, hits: scan.summary
    }));
    return 0;
  }

  /* --------------------------------------------------------------------------
     状态
     -------------------------------------------------------------------------- */
  async function status() {
    const seen = await Repo.metaGet('seenFiles', {});
    const lastPullAt = await Repo.metaGet('lastPullAt', 0);
    let raw = 0;
    try { raw = await Repo.count('rawfiles'); } catch (e) { }
    return {
      busy: _busy,
      seenCount: Object.keys(seen).length,
      lastPullAt,
      lastScan: _lastScan,
      rawFiles: raw,
      roots: (App.cfg.scanRoots || []).filter(r => r.enabled).length
    };
  }

  function isBusy() { return _busy; }
  function lastScan() { return _lastScan; }

  return { scan, scanAllRoots, pickChanged, markSeen, pull, status, isBusy, lastScan, decodeMaybe };
})();


/* ==========================================================================
   src/bridge/scheduler.js
   ========================================================================== */
/* ============================================================================
   节拍调度
   ----------------------------------------------------------------------------
   三类周期性任务：

     renderTick  重绘当前视图 + 拉 SSH 快照（默认 300 秒）
     sshTick     只拉巡检快照（默认 60 秒）
     pullTick    增量拉取日志（默认由「拉取间隔」控制）

   三条不变量（沿用 RDIMM 的经验，这几条不做就会出问题）：

     1. **页面不可见时不跑** —— 最小化/切后台时跳过，省网络也省机台负载
     2. **每个任务自带 busy 锁** —— 上一轮没跑完不启动下一轮，避免叠加
     3. **只由一个节拍驱动** —— 开启「自动刷新」时，SSH 与拉取都挂在它的
        节拍上，不再各自起定时器；否则两套节拍会打架，同一时刻跑两遍
   ============================================================================ */

const Scheduler = (() => {

  let _timers = {};
  let _state = {};
  let _running = false;
  let _nextAt = 0;
  let _countdownTimer = null;

  function task(name) {
    _state[name] = _state[name] || { busy: false, lastAt: 0, lastMs: 0, runs: 0, errors: 0 };
    return _state[name];
  }

  /* 包装：加 busy 锁 + 计时 + 异常兜底 */
  function guard(name, fn) {
    const t = task(name);
    return async function () {
      if (t.busy) return false;
      t.busy = true;
      const t0 = Date.now();
      try {
        await fn();
        t.lastMs = Date.now() - t0;
        t.runs++;
        t.lastAt = Date.now();
        return true;
      } catch (e) {
        t.errors++;
        t.lastAt = Date.now();
        console.warn('[Scheduler] ' + name + ' 出错：', e.message);
        return false;
      } finally {
        t.busy = false;
      }
    };
  }

  function visible() {
    return !document.hidden;
  }

  /* --------------------------------------------------------------------------
     一个节拍里做什么
     -------------------------------------------------------------------------- */
  const tickRender = guard('render', async () => {
    if (!visible()) return;
    // 重绘当前视图
    try { await App.switchView(App.state.curView); } catch (e) { }
    // 顺带拉一次巡检（自动刷新开启时由这里统一驱动）
    if (Bridge.configured()) {
      if ((await Bridge.health()).ok) await Ssh.poll(true);
      App.refreshStatus();
    }
  });

  const tickSsh = guard('ssh', async () => {
    if (!visible()) return;
    if (!Bridge.configured()) return;
    if (!(await Bridge.health()).ok) return;
    await Ssh.poll(true);
    Bus.emit(EVT.SLOTS_CHANGED, { keys: null });   // 让平面图重绘状态
  });

  const tickPull = guard('pull', async () => {
    if (!visible()) return;
    if (!Bridge.configured()) return;
    if (!App.cfg.settings.autoPull) return;
    if (!(await Bridge.health()).ok) return;
    await FtpChannel.pull('ftp', { onlyNew: App.cfg.settings.onlyNew !== false });
  });

  /* --------------------------------------------------------------------------
     启动 / 停止
     -------------------------------------------------------------------------- */
  function start() {
    stop();
    _running = true;
    const sec = Math.max(15, App.cfg.settings.refreshSec || 60);
    _nextAt = Date.now() + sec * 1000;

    // 主节拍：重绘 + 巡检
    _timers.render = setInterval(() => {
      _nextAt = Date.now() + sec * 1000;
      tickRender();
    }, sec * 1000);

    // SSH 单独一个更快的节拍，但**只在没开自动刷新时**才起作用
    _timers.ssh = setInterval(() => {
      if (_timers.render) return;      // 自动刷新开着 → 由 renderTick 统一驱动
      tickSsh();
    }, Math.max(20, (App.cfg.channels.ssh || {}).intervalSec || 60) * 1000);

    // 倒计时显示
    _countdownTimer = setInterval(updateChip, 1000);

    console.log('[Scheduler] 已启动，节拍 ' + sec + ' 秒');
    updateChip();
    tickRender();      // 立即跑一次，不用等第一个周期
  }

  function stop() {
    Object.keys(_timers).forEach(k => { if (_timers[k]) clearInterval(_timers[k]); });
    _timers = {};
    if (_countdownTimer) clearInterval(_countdownTimer);
    _countdownTimer = null;
    _running = false;
    updateChip();
  }

  function toggle() {
    if (_running) { stop(); Toast.ok('自动刷新已关闭'); }
    else { start(); Toast.ok('自动刷新已开启（每 ' +
      Math.max(15, App.cfg.settings.refreshSec || 60) + ' 秒）'); }
    return _running;
  }

  function isRunning() { return _running; }

  function updateChip() {
    const el = document.getElementById('tickChip');
    if (!el) return;
    if (!_running) {
      el.textContent = '自动刷新：关';
      el.className = 'chip';
      el.title = '点击「自动刷新」开启周期性刷新与巡检';
      return;
    }
    const left = Math.max(0, Math.round((_nextAt - Date.now()) / 1000));
    el.textContent = '自动刷新：' + left + 's';
    el.className = 'chip ok';
    const t = _state.render || {};
    el.title = '每 ' + Math.max(15, App.cfg.settings.refreshSec || 60) + ' 秒一轮\n' +
      '已运行 ' + (t.runs || 0) + ' 轮' +
      (t.lastMs ? '，上轮耗时 ' + (t.lastMs / 1000).toFixed(1) + ' 秒' : '') +
      (t.errors ? '\n失败 ' + t.errors + ' 次' : '') +
      '\n页面不可见时自动跳过';
  }

  function status() {
    return { running: _running, nextInSec: Math.max(0, Math.round((_nextAt - Date.now()) / 1000)),
             tasks: Util.clone(_state) };
  }

  /* 页面重新可见时补一次，避免切回来看到的还是旧数据 */
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && _running) {
      _nextAt = Date.now() + Math.max(15, App.cfg.settings.refreshSec || 60) * 1000;
      tickRender();
    }
  });

  return { start, stop, toggle, isRunning, status, tickRender, tickSsh, tickPull };
})();


/* ==========================================================================
   src/components/toast.js
   ========================================================================== */
/* ============================================================================
   提示条
   ============================================================================ */

const Toast = (() => {

  function show(msg, type, title, ms) {
    const root = document.getElementById('toastRoot');
    if (!root) { console.log('[Toast:' + (type || 'info') + ']', msg); return; }
    const node = document.createElement('div');
    node.className = 'toast ' + (type || '');
    node.innerHTML = (title ? '<div class="toast-title">' + Util.esc(title) + '</div>' : '') +
                     '<div class="toast-sub">' + Util.esc(msg) + '</div>';
    root.appendChild(node);
    setTimeout(() => {
      node.style.transition = 'opacity .25s, transform .25s';
      node.style.opacity = '0';
      node.style.transform = 'translateX(20px)';
      setTimeout(() => node.remove(), 260);
    }, ms || 3000);
  }

  function ok(msg, title)   { show(msg, 'ok', title); }
  function warn(msg, title) { show(msg, 'warn', title, 4200); }
  function error(msg, title){ show(msg, 'err', title, 6000); }
  function info(msg, title) { show(msg, 'info', title); }

  return { show, ok, warn, error, info };
})();

/* 数据层在降级/配额异常时会调 Toast —— 通过事件解耦，避免 store 依赖 UI 模块 */
if (typeof Bus !== 'undefined') {
  Bus.on(EVT.TOAST, p => {
    if (!p) return;
    Toast.show(p.msg, p.type, p.title);
  });
}


/* ==========================================================================
   src/components/modal.js
   ========================================================================== */
/* ============================================================================
   模态框 —— 通用容器 + 确认框
   ----------------------------------------------------------------------------
   内容用 innerHTML 生成，事件用委托绑定（delegate），避免每个模态框重复写绑定。
   ============================================================================ */

const Modal = (() => {

  const stack = [];             // 支持嵌套（确认框叠在模态框上）

  const SIZES = { normal: '', wide: 'wide', wider: 'wider', full: 'full' };

  /* --------------------------------------------------------------------------
     打开
       opts: { id, title, sub, size, body, footer, onMount, onClose, onEscape }
       body/footer 可以是 HTML 字符串
       返回 handle { el, close(), body, setBody(), footer }
     -------------------------------------------------------------------------- */
  function open(opts) {
    const o = opts || {};
    const root = document.getElementById('modalRoot');
    if (!root) { console.error('[Modal] 缺少 #modalRoot 挂载点'); return null; }

    // 同 id 的已存在则先关掉，避免重复
    if (o.id) closeById(o.id);

    const overlay = Dom.el('div', { class: 'modal-overlay', 'data-modal': o.id || '' });
    overlay.innerHTML =
      '<div class="modal ' + (SIZES[o.size] || '') + '">' +
        '<div class="modal-head">' +
          '<div>' +
            '<div class="t">' + Util.esc(o.title || '') + '</div>' +
            (o.sub ? '<div class="sub">' + Util.esc(o.sub) + '</div>' : '') +
          '</div>' +
          '<div class="spacer"></div>' +
          '<button class="modal-close" data-mclose="1" title="关闭（Esc）">&times;</button>' +
        '</div>' +
        '<div class="modal-body">' + (o.body || '') + '</div>' +
        (o.footer !== false
          ? '<div class="modal-foot">' + (o.footer || '<button class="btn" data-mclose="1">关闭</button>') + '</div>'
          : '') +
      '</div>';

    root.appendChild(overlay);

    const handle = {
      id: o.id || '',
      el: overlay,
      body: overlay.querySelector('.modal-body'),
      card: overlay.querySelector('.modal'),
      close: () => close(handle),
      setBody(html) { handle.body.innerHTML = html; },
      setFooter(html) {
        const f = overlay.querySelector('.modal-foot');
        if (f) f.innerHTML = html;
      },
      query: sel => overlay.querySelector(sel),
      queryAll: sel => Array.prototype.slice.call(overlay.querySelectorAll(sel))
    };

    /* 关闭：点 X、点底部按钮、点遮罩空白处 */
    overlay.addEventListener('click', e => {
      if (e.target === overlay && o.maskClose !== false) { close(handle); return; }
      if (e.target.closest('[data-mclose]')) close(handle);
    });

    // Esc 关闭最上层
    overlay.addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.stopPropagation(); close(handle); }
    });

    stack.push(handle);
    if (o.onMount) {
      try { o.onMount(handle); }
      catch (e) { console.error('[Modal] onMount 出错：', e); }
    }
    // 聚焦第一个输入框，便于键盘操作
    setTimeout(() => {
      const first = overlay.querySelector('input:not([type=hidden]),select,textarea');
      if (first) { try { first.focus(); } catch (e) { } }
    }, 40);

    return handle;
  }

  function close(handle) {
    if (!handle || !handle.el) return;
    const i = stack.indexOf(handle);
    if (i >= 0) stack.splice(i, 1);
    try { handle.el.remove(); } catch (e) { }
    if (handle.onClose) { try { handle.onClose(); } catch (e) { } }
  }

  function closeById(id) {
    stack.slice().forEach(h => { if (h.id === id) close(h); });
  }
  function closeTop() {
    if (stack.length) { close(stack[stack.length - 1]); return true; }
    return false;
  }
  function closeAll() {
    stack.slice().forEach(close);
  }
  function isOpen() { return stack.length > 0; }

  /* --------------------------------------------------------------------------
     确认框 —— 返回 Promise<boolean>
     -------------------------------------------------------------------------- */
  function confirm(opts) {
    const o = (typeof opts === 'string') ? { text: opts } : (opts || {});
    return new Promise(resolve => {
      const root = document.getElementById('modalRoot');
      const overlay = Dom.el('div', { class: 'modal-overlay' });
      overlay.innerHTML =
        '<div class="confirm-box">' +
          '<div class="ct">' + Util.esc(o.title || '确认操作') + '</div>' +
          '<div class="cb">' + (o.html || Util.esc(o.text || '')) + '</div>' +
          '<div class="cf">' +
            '<button class="btn" data-cf="0">' + Util.esc(o.cancelText || '取消') + '</button>' +
            '<button class="btn ' + (o.danger ? 'danger' : 'primary') + '" data-cf="1">' +
              Util.esc(o.okText || '确定') + '</button>' +
          '</div>' +
        '</div>';
      let settled = false;
      const finish = v => {
        if (settled) return;
        settled = true;
        overlay.remove();
        resolve(v);
      };
      overlay.addEventListener('click', e => {
        if (e.target === overlay) return finish(false);
        const b = e.target.closest('[data-cf]');
        if (b) finish(b.dataset.cf === '1');
      });
      root.appendChild(overlay);
      setTimeout(() => {
        const okBtn = overlay.querySelector('[data-cf="1"]');
        if (okBtn) { try { okBtn.focus(); } catch (e) { } }
      }, 40);
    });
  }

  /* 输入框弹窗（替代 RDIMM 大量使用的 prompt） */
  function prompt(opts) {
    const o = (typeof opts === 'string') ? { text: opts } : (opts || {});
    return new Promise(resolve => {
      const h = open({
        title: o.title || '请输入',
        size: 'normal',
        body: '<div class="form-group">' +
                '<label class="form-label">' + Util.esc(o.text || '') + '</label>' +
                '<input class="form-input" id="__promptInput" value="' + Util.esc(o.value || '') + '">' +
                (o.hint ? '<div class="form-hint">' + Util.esc(o.hint) + '</div>' : '') +
              '</div>',
        footer: '<button class="btn" data-cf="0">取消</button>' +
                '<button class="btn primary" data-cf="1">确定</button>',
        onMount(hh) {
          const input = hh.query('#__promptInput');
          const done = v => { h.close(); resolve(v); };
          hh.el.addEventListener('click', e => {
            const b = e.target.closest('[data-cf]');
            if (b) done(b.dataset.cf === '1' ? input.value : null);
          });
          input.addEventListener('keydown', e => {
            if (e.key === 'Enter') done(input.value);
          });
        },
        onClose() { resolve(null); }
      });
    });
  }

  /* Esc 兜底：模态框自己也会处理，这里管没有焦点在模态内的情况 */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && stack.length) {
      const top = stack[stack.length - 1];
      // 若焦点在输入框且按 Esc，仍关闭（用户预期）
      if (!e.target.closest || !e.target.closest('.modal-overlay')) close(top);
    }
  });

  return { open, close, closeById, closeTop, closeAll, isOpen, confirm, prompt, stack };
})();


/* ==========================================================================
   src/components/drawer.js
   ========================================================================== */
/* ============================================================================
   右侧抽屉 —— 盘位详情 / 单块产品流转
   ============================================================================ */

const Drawer = (() => {
  let _cur = null;

  function open(opts) {
    const o = opts || {};
    const el = document.getElementById('drawer');
    const mask = document.getElementById('mask');
    if (!el) return null;

    el.innerHTML =
      '<div class="drawer-head">' +
        '<div>' +
          '<div class="t">' + Util.esc(o.title || '') + '</div>' +
          (o.sub ? '<div class="sub">' + Util.esc(o.sub) + '</div>' : '') +
        '</div>' +
        '<div class="spacer"></div>' +
        (o.actions || '') +
        '<button class="btn sm" data-dclose="1">关闭</button>' +
      '</div>' +
      '<div class="drawer-body">' + (o.body || '') + '</div>';

    el.classList.add('show');
    if (mask) mask.classList.add('show');
    document.body.classList.add('no-scroll');

    el.onclick = e => {
      if (e.target.closest('[data-dclose]')) close();
    };
    if (mask) mask.onclick = () => close();

    _cur = { el, opts: o };
    if (o.onMount) { try { o.onMount(el); } catch (e) { console.error('[Drawer] onMount：', e); } }
    return _cur;
  }

  function close() {
    const el = document.getElementById('drawer');
    const mask = document.getElementById('mask');
    if (el) { el.classList.remove('show'); el.onclick = null; }
    if (mask) { mask.classList.remove('show'); mask.onclick = null; }
    document.body.classList.remove('no-scroll');
    if (_cur && _cur.opts && _cur.opts.onClose) {
      try { _cur.opts.onClose(); } catch (e) { }
    }
    _cur = null;
  }

  function isOpen() {
    const el = document.getElementById('drawer');
    return !!(el && el.classList.contains('show'));
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && isOpen() && !Modal.isOpen()) close();
  });

  return { open, close, isOpen, current: () => _cur };
})();


/* ==========================================================================
   src/components/table.js
   ========================================================================== */
/* ============================================================================
   表格构建 —— 统一列定义、渲染、分页、导出
   ----------------------------------------------------------------------------
   各视图不再各写一遍 innerHTML 拼表，避免 RDIMM 里「两套 CSV 导出实现并存」
   那种列契约不一致的问题。列定义即导出的表头来源。
   ============================================================================ */

const DataTable = (() => {

  /* 列定义：
     { key, label, width, cls, fmt(v,row), html(v,row), csv(v,row), hide }
     fmt 返回文本，html 返回 HTML（优先），csv 返回导出值 */
  function build(cols, rows, opts) {
    const o = opts || {};
    const vis = cols.filter(c => !c.hide);
    const head = vis.map(c =>
      '<th' + (c.width ? ' style="width:' + c.width + '"' : '') +
      (c.cls ? ' class="' + c.cls + '"' : '') + '>' + Util.esc(c.label) + '</th>'
    ).join('');

    if (!rows || !rows.length) {
      return '<div class="table-wrap"><table class="data-table"><thead><tr>' + head +
        '</tr></thead><tbody><tr><td colspan="' + vis.length +
        '" class="empty-tip">' + Util.esc(o.emptyText || '暂无数据') + '</td></tr></tbody></table></div>';
    }

    const body = rows.map((row, ri) => {
      const tds = vis.map(c => {
        let v = '';
        if (typeof c.html === 'function') v = c.html(row[c.key], row, ri);
        else if (typeof c.fmt === 'function') v = Util.esc(c.fmt(row[c.key], row, ri));
        else v = Util.esc(row[c.key] == null ? '' : row[c.key]);
        return '<td' + (c.cls ? ' class="' + c.cls + '"' : '') + '>' + v + '</td>';
      }).join('');
      const rowCls = typeof o.rowClass === 'function' ? o.rowClass(row, ri) : '';
      const rowAttr = typeof o.rowAttr === 'function' ? o.rowAttr(row, ri) : '';
      return '<tr' + (rowCls ? ' class="' + rowCls + '"' : '') + rowAttr + '>' + tds + '</tr>';
    }).join('');

    return '<div class="table-wrap"><table class="data-table">' +
      '<thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>';
  }

  /* 带分页的渲染：返回 {html, slice, page, pages}
     total 为总条数（可能是服务端计的数），rows 为当前页数据 */
  function paginated(cols, allRows, page, pageSize) {
    const size = pageSize || LocalStore.ui.get('tablePageSize', 100);
    const total = allRows.length;
    const pages = Math.max(1, Math.ceil(total / size));
    const p = Util.clamp(page || 1, 1, pages);
    const slice = allRows.slice((p - 1) * size, p * size);
    const html = build(cols, slice);
    const pager = total > size
      ? '<div class="pager">' +
          '<span class="pg-info">共 ' + Util.num(total) + ' 条，第 ' + p + ' / ' + pages + ' 页</span>' +
          '<button class="btn sm" data-pg="first"' + (p <= 1 ? ' disabled' : '') + '>首页</button>' +
          '<button class="btn sm" data-pg="prev"' + (p <= 1 ? ' disabled' : '') + '>上一页</button>' +
          '<button class="btn sm" data-pg="next"' + (p >= pages ? ' disabled' : '') + '>下一页</button>' +
          '<button class="btn sm" data-pg="last"' + (p >= pages ? ' disabled' : '') + '>末页</button>' +
        '</div>'
      : (total ? '<div class="pager"><span class="pg-info">共 ' + Util.num(total) + ' 条</span></div>' : '');
    return { html: html + pager, slice, page: p, pages, total };
  }

  /* 处理分页按钮点击：返回新页码，无变化返回原值 */
  function handlePage(action, page, total, pageSize) {
    const size = pageSize || LocalStore.ui.get('tablePageSize', 100);
    const pages = Math.max(1, Math.ceil(total / size));
    if (action === 'first') return 1;
    if (action === 'last') return pages;
    if (action === 'prev') return Util.clamp(page - 1, 1, pages);
    if (action === 'next') return Util.clamp(page + 1, 1, pages);
    return page;
  }

  /* 按列定义导出 CSV —— 与界面同源，保证列契约一致 */
  function toCsv(cols, rows, opts) {
    const vis = cols.filter(c => !c.hide);
    const headers = vis.map(c => (opts && opts.headerPrefix ? opts.headerPrefix + c.label : c.label));
    const data = rows.map(row => vis.map(c => {
      if (typeof c.csv === 'function') return c.csv(row[c.key], row);
      if (typeof c.fmt === 'function') return c.fmt(row[c.key], row);
      return row[c.key];
    }));
    return Util.toCsv(headers, data, opts);
  }

  /* 内联迷你进度条 */
  function miniBar(pct, color) {
    const p = Util.clamp((pct || 0) * 100, 0, 100);
    const c = color || (p >= 95 ? 'var(--ok)' : p >= 60 ? 'var(--info)' : 'var(--warn)');
    return '<span class="mini-bar"><span class="track"><i style="width:' + p.toFixed(0) +
           '%;background:' + c + '"></i></span><span class="pct">' + p.toFixed(0) + '%</span></span>';
  }

  /* 汇总条（带占比） */
  function summaryList(items) {
    const max = items.reduce((a, x) => Math.max(a, x.value), 0) || 1;
    const total = items.reduce((a, x) => a + x.value, 0) || 1;
    return '<div class="summary-list">' + items.map(x =>
      '<div class="summary-item">' +
        '<span>' + Util.esc(x.label) + '</span>' +
        '<span class="track"><i style="width:' + (x.value / max * 100).toFixed(1) +
          '%;background:' + (x.color || 'var(--info)') + '"></i></span>' +
        '<span class="val">' + Util.num(x.value) + ' · ' +
          (x.value / total * 100).toFixed(1) + '%</span>' +
      '</div>').join('') + '</div>';
  }

  return { build, paginated, handlePage, toCsv, miniBar, summaryList };
})();


/* ==========================================================================
   src/components/slot-grid.js
   ========================================================================== */
/* ============================================================================
   盘位网格渲染器 —— 全项目最热的代码路径
   ----------------------------------------------------------------------------
   12,737 个盘位。实测生成 HTML 字符串只要 ~25ms，所以**字符串渲染不是瓶颈**，
   瓶颈是频繁重建 DOM。因此策略是：

     首屏：一次 innerHTML 全量渲染（快，且浏览器解析一次到位）
     刷新：**只 patch 变化的格**，不重建子树

   索引的建立不靠给 12,737 个格子挂 data 属性（会多出 ~350KB HTML），
   而是利用「querySelectorAll 返回文档序 == 我发射的顺序」这一点，
   按设备在盘位两重循环里顺序对齐，O(n) 且零属性开销。
   ============================================================================ */

const SlotGrid = (() => {

  /* 单元格的 title 提示 */
  function cellTitle(station, eq, slotIndex, rec) {
    const st = ST[station];
    const lines = [eq.id + ' · 位' + (slotIndex + 1)];
    if (!rec || rec.state === 'empty') {
      lines.push('空位');
    } else {
      lines.push(L.slotState(rec.state));
      if (rec.sn) lines.push('SN ' + rec.sn);
      if (rec.pn) lines.push('PN ' + rec.pn);
      if (rec.woNo) lines.push('工单 ' + rec.woNo);
      if (rec.errCode) lines.push('错误码 ' + rec.errCode);
      if (rec.state === 'testing' && rec.startTime && st) {
        const left = rec.startTime + st.cycleMin * 60000 - Date.now();
        lines.push('剩余 ' + Util.fmtDur(left));
      }
    }
    return lines.join('\n');
  }

  /* 单元格 class：状态类 + 待确认不良黄框 */
  function cellClass(rec, pendingBad) {
    const state = (rec && rec.state) || 'empty';
    let c = 'cell ' + ((SLOT_STATE[state] || SLOT_STATE.empty).cls);
    if (!rec || !rec.sn) c += ' no-sn';
    if (pendingBad) c += ' pending-bad';
    return c;
  }

  /* --------------------------------------------------------------------------
     渲染一整台设备的盘位网格（返回 HTML 串）
     -------------------------------------------------------------------------- */
  function gridHTML(station, eq, slotMap, opts) {
    const st = ST[station];
    const cap = eq.capacity;
    // 容量档位映射到 CSS 类：1 / 16 / 128 / 256
    const cls = cap >= 128 ? cap : (cap === 1 ? 1 : 16);
    const pendingSet = (opts && opts.pending) || null;

    let html = '<div class="slot-grid cap' + cls + '" data-eq="' + Util.esc(eq.id) + '">';
    for (let i = 0; i < cap; i++) {
      const key = eq.slotKeys[i];
      const rec = slotMap ? slotMap.get(key) : null;
      const title = cellTitle(station, eq, i, rec);
      // ICT 单格显示 SN 尾号，方便一眼认出是哪块
      const label = (cap === 1 && rec && rec.sn) ? Util.esc(String(rec.sn).slice(-6)) : '';
      html += '<div class="' + cellClass(rec, pendingSet && pendingSet.has(key)) + '"' +
              ' data-k="' + Util.esc(key) + '"' +
              ' title="' + Util.escAttr(title) + '">' + label + '</div>';
    }
    return html + '</div>';
  }

  /* --------------------------------------------------------------------------
     独立设备卡（ICT / BIST / ESS）
     -------------------------------------------------------------------------- */
  function flatCardHTML(station, eq, slotMap, eqState, opts) {
    const st = ST[station];
    let used = 0, testing = 0, fail = 0;
    for (let i = 0; i < eq.capacity; i++) {
      const rec = slotMap.get(eq.slotKeys[i]);
      if (!rec || rec.state === 'empty') continue;
      used++;
      if (rec.state === 'testing') testing++;
      else if (rec.state === 'fail') fail++;
    }
    // 当前在测的第一块，用于显示进度与剩余时间
    let cur = null;
    for (let i = 0; i < eq.capacity; i++) {
      const rec = slotMap.get(eq.slotKeys[i]);
      if (rec && rec.state === 'testing' && rec.startTime) { cur = rec; break; }
    }
    const pct = cur && st && st.cycleMin
      ? Util.clamp((Date.now() - cur.startTime) / (st.cycleMin * 60000), 0, 1) * 100
      : (eq.capacity ? used / eq.capacity * 100 : 0);
    const remain = cur && st ? (cur.startTime + st.cycleMin * 60000 - Date.now()) : 0;
    const es = EQ_STATE[eqState] || EQ_STATE.idle;

    return '<div class="eq ' + (eqState === 'fault' ? 'fault' : eqState === 'maint' ? 'maint' : '') +
             '" data-eq="' + Util.esc(eq.id) + '">' +
      '<div class="eq-head">' +
        '<span class="id">' + Util.esc(eq.id) + '</span>' +
        '<span class="badge ' + es.cls + '">' + es.label + '</span>' +
        '<span class="occ"><b>' + Util.num(used) + '</b>/' + Util.num(eq.capacity) + '</span>' +
        (fail ? '<span class="badge b-fault">失效 ' + fail + '</span>' : '') +
      '</div>' +
      gridHTML(station, eq, slotMap, opts) +
      '<div class="eq-foot">' +
        '<span>' + (cur ? '在测 ' + testing : (used ? '已装载' : '空载')) + '</span>' +
        '<span class="pbar"><i style="width:' + pct.toFixed(0) + '%"></i></span>' +
        '<span>' + (cur ? (remain > 0 ? '剩余 ' + Util.fmtDur(remain) : '已完成') : '—') + '</span>' +
      '</div>' +
    '</div>';
  }

  /* --------------------------------------------------------------------------
     服务器行（机柜布局用）
     -------------------------------------------------------------------------- */
  function serverRowHTML(station, eq, slotMap, opts) {
    let used = 0;
    for (let i = 0; i < eq.capacity; i++) {
      const rec = slotMap.get(eq.slotKeys[i]);
      if (rec && rec.state !== 'empty') used++;
    }
    const cls = used === eq.capacity ? 'full' : (used === 0 ? 'zero' : '');
    // 服务器号只显示序号部分，缩短行宽
    const short = eq.id.replace(/^SRV-[A-Z]-/, '');
    return '<div class="srv" data-eq="' + Util.esc(eq.id) + '">' +
      '<span class="sid" title="' + Util.esc(eq.id) + '">' + Util.esc(short) + '</span>' +
      gridHTML(station, eq, slotMap, opts) +
      '<span class="cnt ' + cls + '">' + used + '/' + eq.capacity + '</span>' +
    '</div>';
  }

  /* --------------------------------------------------------------------------
     机柜卡
     -------------------------------------------------------------------------- */
  function cabinetHTML(station, cab, slotMap, eqStates, opts) {
    let used = 0, cap = 0, fail = 0;
    cab.servers.forEach(eq => {
      const st = eqStates && eqStates[eq.id];
      cap += eq.capacity;
      for (let i = 0; i < eq.capacity; i++) {
        const rec = slotMap.get(eq.slotKeys[i]);
        if (!rec || rec.state === 'empty') continue;
        used++;
        if (rec.state === 'fail') fail++;
      }
    });
    const pct = cap ? used / cap * 100 : 0;
    const anyFault = cab.servers.some(eq => eqStates && eqStates[eq.id] === 'fault');

    return '<div class="cab' + (anyFault ? ' fault' : '') + '" data-cab="' + Util.esc(cab.id) + '">' +
      '<div class="cab-head">' +
        '<span>' + Util.esc(cab.id) + '</span>' +
        '<span class="spacer" style="flex:1"></span>' +
        '<span class="oc">' + cab.servers.length + ' 台 · ' + used + '/' + cap +
          ' · <b style="color:' + (pct >= 95 ? '#6ee787' : 'var(--tx-2)') + '">' + pct.toFixed(0) + '%</b>' +
          (fail ? ' · <b style="color:#ff8b82">失效 ' + fail + '</b>' : '') +
        '</span>' +
      '</div>' +
      cab.servers.map(eq => serverRowHTML(station, eq, slotMap, opts)).join('') +
    '</div>';
  }

  /* --------------------------------------------------------------------------
     建立 key → 元素索引
       container 内 .cell 的文档序必须与 equipmentList × slotKeys 的发射序一致
     -------------------------------------------------------------------------- */
  function buildIndex(container, station, equipmentList) {
    const index = new Map();
    if (!container) return index;
    const cells = container.querySelectorAll('.cell[data-k]');
    let i = 0;
    for (let e = 0; e < equipmentList.length; e++) {
      const eq = equipmentList[e];
      for (let s = 0; s < eq.capacity; s++) {
        const node = cells[i++];
        if (!node) break;
        index.set(eq.slotKeys[s], node);
      }
    }
    return index;
  }

  /* --------------------------------------------------------------------------
     增量补丁：只改变化的格
       changes 为 Set<slotKey> 或 null（null = 全量重建标记）
     -------------------------------------------------------------------------- */
  function patch(index, changes, slotMap, pendingSet) {
    if (!index || !changes || !changes.size) return 0;
    let n = 0;
    changes.forEach(key => {
      const node = index.get(key);
      if (!node) return;
      const rec = slotMap.get(key);
      const state = (rec && rec.state) || 'empty';
      const stateCls = (SLOT_STATE[state] || SLOT_STATE.empty).cls;

      // 换状态类（保留 cell / no-sn / pending-bad 这些非状态类）
      const keep = (node.className || '').split(/\s+/).filter(c =>
        c && c.indexOf('s-') !== 0);
      const noSn = (!rec || !rec.sn);
      if (noSn && keep.indexOf('no-sn') < 0) keep.push('no-sn');
      const newCls = keep.filter(c => c !== 'no-sn').concat(noSn ? ['no-sn'] : []);
      newCls.push(stateCls);
      if (pendingSet && pendingSet.has(key)) newCls.push('pending-bad');
      node.className = newCls.join(' ');

      // 刷新 tooltip
      const parts = Schema.parseSlotKey(key);
      const eq = (Topology.all(LocalStore.load()).stationsMap[parts.station] || [])
        .filter(x => x.id === parts.equipmentId)[0];
      if (eq) node.title = cellTitle(parts.station, eq, parts.slotIndex, rec);

      // ICT 单格要更新可见的 SN 尾号
      if (ST[parts.station] && ST[parts.station].capacity === 1) {
        node.textContent = (rec && rec.sn) ? String(rec.sn).slice(-6) : '';
      }
      n++;
    });
    return n;
  }

  /* --------------------------------------------------------------------------
     Canvas 缩略图 —— 用于智慧看板的「全线热力图」与导出 PNG
       12,737 格用 canvas 画只要毫秒级，且不产生任何 DOM
     -------------------------------------------------------------------------- */
  const STATE_COLOR = {
    empty: '#232c38', testing: '#4f8ef7', pass: '#39d353',
    fail: '#f85149', abort: '#8b7fd4', maintenance: '#f0a500',
    damaged: '#b1583f', disabled: '#4a5568'
  };

  function drawCanvas(canvas, station, equipmentList, slotMap, opts) {
    const o = opts || {};
    const cell = o.cell || 3;
    const gap = o.gap == null ? 1 : o.gap;
    const cols = o.cols || 16;
    const total = equipmentList.reduce((a, e) => a + e.capacity, 0);
    const rows = Math.ceil(total / cols);
    const w = cols * (cell + gap);
    const h = rows * (cell + gap);
    const dpr = window.devicePixelRatio || 1;

    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, w, h);

    let i = 0;
    for (let e = 0; e < equipmentList.length; e++) {
      const eq = equipmentList[e];
      for (let s = 0; s < eq.capacity; s++) {
        const rec = slotMap.get(eq.slotKeys[s]);
        const state = (rec && rec.state) || 'empty';
        ctx.fillStyle = STATE_COLOR[state] || STATE_COLOR.empty;
        const x = (i % cols) * (cell + gap);
        const y = Math.floor(i / cols) * (cell + gap);
        ctx.fillRect(x, y, cell, cell);
        i++;
      }
    }
    return { width: w, height: h, total };
  }

  /* 汇总一组盘位的状态计数（避免视图层各写一遍） */
  function countStates(equipmentList, slotMap) {
    let cap = 0, used = 0, testing = 0, pass = 0, fail = 0, abort = 0, other = 0;
    equipmentList.forEach(eq => {
      for (let i = 0; i < eq.capacity; i++) {
        cap++;
        const rec = slotMap.get(eq.slotKeys[i]);
        if (!rec || rec.state === 'empty') continue;
        used++;
        if (rec.state === 'testing') testing++;
        else if (rec.state === 'pass') pass++;
        else if (rec.state === 'fail') fail++;
        else if (rec.state === 'abort') abort++;
        else other++;
      }
    });
    return { cap, used, free: cap - used, testing, pass, fail, abort, other,
             util: cap ? used / cap : 0 };
  }

  return {
    gridHTML, flatCardHTML, serverRowHTML, cabinetHTML,
    buildIndex, patch, drawCanvas, countStates, cellTitle, STATE_COLOR
  };
})();


/* ==========================================================================
   src/components/virtual-list.js
   ========================================================================== */
/* ============================================================================
   视口懒挂载 —— 机柜墙用
   ----------------------------------------------------------------------------
   FINAL 有 45 个机柜，每个机柜 9 行服务器 × 16 盘位 = 144 格。
   一次性挂载 45×144 = 6,480 格虽然可行，但滚动时会明显掉帧。
   这里用 IntersectionObserver 只挂载进入视口的机柜内容，同时挂载量控制在
   约 3,000 格以内。

   用法：
     VirtualList.observe(container, { onEnter(el), onLeave(el) })
   ============================================================================ */

const VirtualList = (() => {

  let _observer = null;
  const _handlers = new WeakMap();

  function supported() {
    return typeof IntersectionObserver !== 'undefined';
  }

  function ensureObserver() {
    if (_observer || !supported()) return _observer;
    _observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        const h = _handlers.get(entry.target);
        if (!h) return;
        if (entry.isIntersecting) {
          if (!entry.target.dataset.vLoaded) {
            entry.target.dataset.vLoaded = '1';
            if (h.onEnter) { try { h.onEnter(entry.target); } catch (e) { console.error(e); } }
          }
        } else if (h.onLeave && entry.target.dataset.vLoaded) {
          try { h.onLeave(entry.target); } catch (e) { }
        }
      });
    }, {
      root: null,
      // 提前 400px 预挂载，滚动时不会看到空白
      rootMargin: '400px 0px',
      threshold: 0
    });
    return _observer;
  }

  /* 对容器内所有 [data-vitem] 元素启用懒挂载 */
  function observe(container, handlers) {
    if (!container) return;
    const items = container.querySelectorAll('[data-vitem]');
    if (!items.length) return;

    if (!supported()) {
      // 不支持时直接全部挂载，功能不受影响
      Array.prototype.forEach.call(items, el => {
        if (handlers.onEnter) handlers.onEnter(el);
      });
      return;
    }
    const obs = ensureObserver();
    Array.prototype.forEach.call(items, el => {
      // 已挂载的直接调一次，避免首屏空着
      _handlers.set(el, handlers);
      const rect = el.getBoundingClientRect();
      if (rect.top < (window.innerHeight + 400) && rect.bottom > -400) {
        el.dataset.vLoaded = '1';
        if (handlers.onEnter) handlers.onEnter(el);
      }
      obs.observe(el);
    });
  }

  function unobserveAll(container) {
    if (!container || !_observer) return;
    const items = container.querySelectorAll('[data-vitem]');
    Array.prototype.forEach.call(items, el => {
      try { _observer.unobserve(el); } catch (e) { }
      _handlers.delete(el);
    });
  }

  /* 分批执行（首屏渲染大块数据时避免长时间阻塞主线程） */
  function chunked(items, fn, chunkSize) {
    const CH = chunkSize || 200;
    const list = items.slice();
    return new Promise(resolve => {
      let i = 0;
      function step() {
        const end = Math.min(i + CH, list.length);
        for (; i < end; i++) fn(list[i], i);
        if (i < list.length) {
          if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
          else setTimeout(step, 0);
        } else resolve();
      }
      step();
    });
  }

  return { observe, unobserveAll, chunked, supported };
})();


/* ==========================================================================
   src/components/charts.js
   ========================================================================== */
/* ============================================================================
   图表 —— 手写 SVG，零外部依赖
   ----------------------------------------------------------------------------
   为什么不用 ECharts：
     RDIMM 从 jsdelivr CDN 加载 ECharts，现场断网即失效（其源码解析 §10 已列为缺陷）；
     改为本地打包又要多 1MB。本项目只需要柱状/折线/环形三种图，
     手写 SVG 约 200 行即可覆盖，且打包后仍 < 20KB、离线可用、可导出 PNG。
   ============================================================================ */

const Charts = (() => {

  const PALETTE = ['#4f8ef7', '#39d353', '#f0a500', '#f85149', '#d96ad9',
                   '#3fb6f0', '#12b5a5', '#f0883e'];

  function esc(s) { return Util.esc(s); }

  /* --------------------------------------------------------------------------
     横向柱状图
       data: [{ label, value, color?, sub? }]
     -------------------------------------------------------------------------- */
  function barH(data, opts) {
    const o = opts || {};
    const items = data || [];
    if (!items.length) return '<div class="empty-tip">暂无数据</div>';
    const max = Math.max.apply(null, items.map(x => x.value).concat([1]));
    return '<div class="bar-chart">' +
      (o.title ? '<div style="font-size:12.5px;font-weight:600;margin-bottom:12px">' +
        esc(o.title) + '</div>' : '') +
      items.map((x, i) => {
        const pct = (x.value / max * 100).toFixed(1);
        const color = x.color || PALETTE[i % PALETTE.length];
        const valText = o.fmt ? o.fmt(x.value, x) : Util.num(Math.round(x.value));
        return '<div class="bar-row">' +
          '<div class="bn"><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:' +
            color + '"></i>' + esc(x.label) + (x.tag || '') + '</div>' +
          '<div class="bt"><i style="width:' + pct + '%;background:' + color + '"></i></div>' +
          '<div class="bv">' + valText + '</div>' +
        '</div>';
      }).join('') +
      (o.note ? '<div class="hint" style="margin:11px 0 0">' + o.note + '</div>' : '') +
    '</div>';
  }

  /* --------------------------------------------------------------------------
     纵向柱状图（按天趋势）
       data: [{ label, value }]
     -------------------------------------------------------------------------- */
  function barV(data, opts) {
    const o = opts || {};
    const items = data || [];
    if (!items.length) return '<div class="empty-tip">暂无数据</div>';
    const max = Math.max.apply(null, items.map(x => x.value).concat([1]));
    const W = 100, H = 46;                 // 用百分比坐标，容器自适应
    const bw = W / items.length;
    const bars = items.map((x, i) => {
      const h = (x.value / max) * (H - 8);
      const xPos = i * bw + bw * 0.18;
      const w = bw * 0.64;
      return '<rect x="' + xPos.toFixed(2) + '" y="' + (H - h).toFixed(2) +
             '" width="' + w.toFixed(2) + '" height="' + h.toFixed(2) +
             '" rx="0.6" fill="' + (x.color || PALETTE[0]) + '">' +
             '<title>' + esc(x.label) + ': ' + Util.num(x.value) + '</title></rect>';
    }).join('');
    const labels = items.map((x, i) =>
      i % (items.length > 14 ? 3 : 1) === 0
        ? '<text x="' + (i * bw + bw / 2).toFixed(2) + '" y="' + (H + 3).toFixed(2) +
          '" font-size="2.6" fill="#67748a" text-anchor="middle">' + esc(x.label) + '</text>'
        : ''
    ).join('');

    return '<div class="bar-chart">' +
      (o.title ? '<div style="font-size:12.5px;font-weight:600;margin-bottom:10px">' +
        esc(o.title) + '</div>' : '') +
      '<svg viewBox="0 0 100 ' + (H + 6) + '" preserveAspectRatio="none" ' +
        'style="width:100%;height:150px;overflow:visible">' + bars + labels + '</svg>' +
      (o.note ? '<div class="hint" style="margin:6px 0 0">' + o.note + '</div>' : '') +
    '</div>';
  }

  /* --------------------------------------------------------------------------
     折线图
     -------------------------------------------------------------------------- */
  function line(data, opts) {
    const o = opts || {};
    const items = data || [];
    if (items.length < 2) return '<div class="empty-tip">数据点不足</div>';
    const max = Math.max.apply(null, items.map(x => x.value).concat([1]));
    const W = 100, H = 42;
    const step = W / (items.length - 1);
    const pts = items.map((x, i) =>
      (i * step).toFixed(2) + ',' + (H - (x.value / max) * (H - 6) - 2).toFixed(2));
    const path = 'M' + pts.join(' L');
    const area = path + ' L' + W + ',' + H + ' L0,' + H + ' Z';
    const dots = items.map((x, i) =>
      '<circle cx="' + (i * step).toFixed(2) + '" cy="' +
      (H - (x.value / max) * (H - 6) - 2).toFixed(2) + '" r="0.9" fill="' +
      (o.color || PALETTE[0]) + '"><title>' + esc(x.label) + ': ' + Util.num(x.value) +
      '</title></circle>').join('');
    const labels = items.map((x, i) =>
      i % (items.length > 10 ? 2 : 1) === 0
        ? '<text x="' + (i * step).toFixed(2) + '" y="' + (H + 4) + '" font-size="2.6" ' +
          'fill="#67748a" text-anchor="middle">' + esc(x.label) + '</text>'
        : '').join('');

    return '<div class="bar-chart">' +
      (o.title ? '<div style="font-size:12.5px;font-weight:600;margin-bottom:10px">' +
        esc(o.title) + '</div>' : '') +
      '<svg viewBox="0 0 100 ' + (H + 6) + '" preserveAspectRatio="none" ' +
        'style="width:100%;height:150px;overflow:visible">' +
        '<path d="' + area + '" fill="' + (o.color || PALETTE[0]) + '" opacity="0.13"/>' +
        '<path d="' + path + '" fill="none" stroke="' + (o.color || PALETTE[0]) +
          '" stroke-width="1.1" stroke-linejoin="round"/>' +
        dots + labels +
      '</svg>' +
    '</div>';
  }

  /* --------------------------------------------------------------------------
     环形图（占比）
     -------------------------------------------------------------------------- */
  function donut(data, opts) {
    const o = opts || {};
    const items = (data || []).filter(x => x.value > 0);
    const total = items.reduce((a, x) => a + x.value, 0);
    if (!total) return '<div class="empty-tip">暂无数据</div>';

    const R = 15.9155;     // 使周长恰好为 100，便于按百分比画弧
    let offset = 0;
    const arcs = items.map((x, i) => {
      const pct = x.value / total * 100;
      const seg = '<circle cx="21" cy="21" r="' + R + '" fill="none" ' +
        'stroke="' + (x.color || PALETTE[i % PALETTE.length]) + '" stroke-width="6" ' +
        'stroke-dasharray="' + pct.toFixed(3) + ' ' + (100 - pct).toFixed(3) + '" ' +
        'stroke-dashoffset="' + (-offset).toFixed(3) + '">' +
        '<title>' + esc(x.label) + ': ' + Util.num(x.value) + ' (' + pct.toFixed(1) + '%)</title></circle>';
      offset += pct;
      return seg;
    }).join('');

    return '<div class="bar-chart" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">' +
      '<svg viewBox="0 0 42 42" style="width:132px;height:132px;flex:none;' +
        'transform:rotate(-90deg)">' +
        '<circle cx="21" cy="21" r="' + R + '" fill="none" stroke="#232c38" stroke-width="6"/>' +
        arcs +
      '</svg>' +
      '<div style="flex:1;min-width:150px">' +
        (o.title ? '<div style="font-size:12.5px;font-weight:600;margin-bottom:9px">' +
          esc(o.title) + '</div>' : '') +
        items.map((x, i) =>
          '<div style="display:flex;align-items:center;gap:7px;font-size:11.5px;margin-bottom:5px">' +
            '<i style="width:9px;height:9px;border-radius:2px;background:' +
              (x.color || PALETTE[i % PALETTE.length]) + '"></i>' +
            '<span style="flex:1">' + esc(x.label) + '</span>' +
            '<span style="color:var(--tx-2)">' + Util.num(x.value) + '</span>' +
            '<span style="color:var(--tx-3);min-width:44px;text-align:right">' +
              (x.value / total * 100).toFixed(1) + '%</span>' +
          '</div>').join('') +
      '</div>' +
    '</div>';
  }

  /* --------------------------------------------------------------------------
     把 SVG 图导出为 PNG（无需外部库，走 canvas 重绘）
     -------------------------------------------------------------------------- */
  function exportPng(svgEl, filename) {
    if (!svgEl) { Toast.warn('未找到图表'); return; }
    const clone = svgEl.cloneNode(true);
    // 内联底色，避免导出后透明
    const vbox = (svgEl.getAttribute('viewBox') || '0 0 100 50').split(/\s+/);
    const w = 1000, h = Math.round(w * (Number(vbox[3]) / Number(vbox[2])) || 300);
    clone.setAttribute('width', w);
    clone.setAttribute('height', h);
    clone.style.background = '#0d1117';
    const svgStr = new XMLSerializer().serializeToString(clone);
    const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = function () {
      const canvas = document.createElement('canvas');
      const dpr = 2;
      canvas.width = w * dpr; canvas.height = h * dpr;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0d1117';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.scale(dpr, dpr);
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      canvas.toBlob(b => {
        Util.download(filename || ('chart_' + Util.tsTag() + '.png'), b, 'image/png');
      }, 'image/png');
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      Toast.error('图表导出失败');
    };
    img.src = url;
  }

  return { barH, barV, line, donut, exportPng, PALETTE };
})();


/* ==========================================================================
   src/components/timeline.js
   ========================================================================== */
/* ============================================================================
   时间线 —— 单块产品的工序流转链
   ============================================================================ */

const Timeline = (() => {

  /* 工序流转链（追溯抽屉用）
     chain 来自 Trace.bySn()：{ station, state, last, records, retest, detail, bypass } */
  function flow(chain, opts) {
    const o = opts || {};
    const clsMap = { pass: 'd-pass', fail: 'd-fail', abort: 'd-abort',
                     testing: 'd-run', pending: 'd-skip', unknown: 'd-skip' };
    const pillMap = {
      pass: '<span class="pill p-pass">通过</span>',
      fail: '<span class="pill p-fail">失败</span>',
      abort: '<span class="pill p-abort">异常终止</span>',
      pending: '<span class="pill p-wait">未开始</span>',
      unknown: '<span class="pill p-wait">未知</span>'
    };

    return '<div class="flow">' + (chain || []).map((seg, i) => {
      const st = ST[seg.station];
      const s = st || { name: seg.station, cn: '', capacity: '-', unit: '', cycleMin: 0, loads: '' };
      const d = clsMap[seg.state] || 'd-skip';
      const isCur = seg.state === 'testing' || (o.currentStation === seg.station && seg.state === 'pending' && !seg.bypass);

      let meta = '';
      const last = seg.last;
      if (last) {
        meta = Util.fmtFull(last.time);
        if (o.showDevice !== false && last.equipmentId) {
          meta += ' · ' + Util.esc(last.equipmentId);
          if (last.slotIndex != null) meta += ' 位' + (last.slotIndex + 1);
        }
        if (last.errCode) meta += ' · <span style="color:#ff8b82">' + Util.esc(last.errCode) + '</span>';
      }

      return '<div class="fstep ' + d + (isCur ? ' cur' : '') + (seg.bypass ? ' bypass' : '') + '">' +
        '<i class="fdot"></i>' +
        '<div class="fn">' +
          '<span class="nm">' + (i + 1) + '. ' + Util.esc(s.name) + '</span>' +
          (pillMap[seg.state] || pillMap.unknown) +
          '<span style="font-size:11px;color:var(--tx-3)">' + Util.esc(s.cn || '') + '</span>' +
        '</div>' +
        '<div class="fm">' + s.capacity + ' 盘位/' + Util.esc(s.unit || '台') +
          ' · 单轮 ' + Util.fmtCycle(s.cycleMin) + '</div>' +
        (meta ? '<div class="fmeta">' + meta + '</div>' : '') +
        (seg.retest ? '<div class="fmeta" style="color:#f5cd6b">复测 ' + seg.retest + ' 次</div>' : '') +
        (seg.detail && !seg.retest ? '<div class="fmeta">' + Util.esc(seg.detail) + '</div>' : '') +
      '</div>';
    }).join('') + '</div>';
  }

  /* 通用时间线（追溯查询页用）
     items: [{ kind, time, station, sn, result, text }] */
  function events(items, opts) {
    const o = opts || {};
    const list = (items || []).slice(0, o.limit || 60);
    if (!list.length) return '<div class="empty-tip">无时间线记录</div>';
    return '<div class="trace-timeline">' + list.map(it => {
      const cls = it.kind === 'bad' ? 't-fail' : it.kind === 'error' ? 't-error'
                : (String(it.result || '').toUpperCase() === 'PASS' ? 't-pass' : 't-fail');
      return '<div class="tl-item ' + cls + '">' +
        '<div class="tl-head">' +
          '<span class="tl-time">' + Util.fmtTime(it.time) + '</span>' +
          '<span class="pill ' + L.resultPill(it.result) + '">' +
            Util.esc(it.station || '') + '</span>' +
          (it.sn ? '<span class="col-sn mono" style="font-size:11px;color:var(--tx-2)">' +
            Util.esc(it.sn) + '</span>' : '') +
        '</div>' +
        '<div class="tl-body">' + Util.esc(it.text || '') + '</div>' +
      '</div>';
    }).join('') + '</div>';
  }

  return { flow, events };
})();


/* ==========================================================================
   src/components/highlight.js
   ========================================================================== */
/* ============================================================================
   关键词高亮与日志扫描
   ----------------------------------------------------------------------------
   对应 RDIMM 的 logScanKeywords / logHighlight / woKeywordRules。
   规则可在「日志分析 → 规则」里配置；为空则用内置默认。
   ============================================================================ */

const Highlight = (() => {

  const DEFAULT_RULES = [
    { key: 'PASS',     name: '通过',       re: '\\bPASS\\b' },
    { key: 'FAIL',     name: '失败',       re: '\\bFAIL\\b' },
    { key: 'ERROR',    name: '错误',       re: '\\bERR(OR)?\\b' },
    { key: 'SN',       name: '序列号',     re: '\\bSN\\b\\s*[:=]' },
    { key: 'STATION',  name: '工站',       re: '\\b(Station|工站)\\b\\s*[:=]' },
    { key: 'TIMEOUT',  name: '超时',       re: '(超时|timeout)' },
    { key: 'RETRY',    name: '重试',       re: '(重试|retry)' },
    { key: 'TEMP',     name: '温度异常',   re: '(温度|Temp).{0,12}(超|高|fail|异常)' },
    { key: 'ECC',      name: 'ECC',        re: '\\b(CE|UCE|ECC)\\b' },
    { key: 'DONE',     name: '完成',       re: '\\b(Done|Finished|完成)\\b' }
  ];

  function rules(cfg) {
    const custom = (cfg && cfg.woKeywordRules) || [];
    return custom.length ? custom : DEFAULT_RULES;
  }

  /* 逐行 × 逐规则扫描 */
  function scan(cfg, text, maxHits) {
    const limit = maxHits || 500;
    const lines = String(text || '').split(/\r?\n/);
    const rs = rules(cfg);
    const hits = [];
    const summary = {};
    const compiled = rs.map(r => {
      try { return { key: r.key, name: r.name, re: new RegExp(r.re, 'i') }; }
      catch (e) { return null; }   // 非法正则跳过，不影响其它规则
    }).filter(Boolean);

    for (let i = 0; i < lines.length && hits.length < limit; i++) {
      const line = lines[i];
      if (!line) continue;
      for (let k = 0; k < compiled.length; k++) {
        const r = compiled[k];
        if (r.re.test(line)) {
          hits.push({ key: r.key, name: r.name, line: i + 1, text: Util.truncate(line.trim(), 220) });
          summary[r.key] = (summary[r.key] || 0) + 1;
          break;   // 一行只记首个命中的规则，避免重复计数
        }
      }
    }
    return { hits, summary, total: hits.length, lineCount: lines.length };
  }

  /* HTML 转义 + 关键词包裹 <mark> */
  function render(cfg, text) {
    const out = Util.esc(text);
    const rs = rules(cfg);
    let html = out;
    rs.forEach(r => {
      try {
        const re = new RegExp('(' + r.re + ')', 'gi');
        html = html.replace(re, '<mark>$1</mark>');
      } catch (e) { }
    });
    return html;
  }

  /* 命中列表（点击可定位到原文行） */
  function hitsHtml(hits) {
    if (!hits || !hits.length) return '<div class="empty-tip">未命中任何关键词</div>';
    return '<div class="log-hits">' + hits.map(h =>
      '<div class="log-hit kw-' + Util.esc(h.key) + '" data-log-line="' + h.line + '">' +
        '<span class="ln">' + h.line + '</span>' +
        '<span class="tx" title="' + Util.escAttr(h.text) + '">' +
          '<span style="color:var(--tx-3)">[' + Util.esc(h.name) + ']</span> ' +
          Util.esc(h.text) + '</span>' +
      '</div>').join('') + '</div>';
  }

  return { DEFAULT_RULES, rules, scan, render, hitsHtml };
})();


/* ==========================================================================
   src/views/floor.js
   ========================================================================== */
/* ============================================================================
   平面图 —— 按工站分区，逐台显示盘位测试状态
   ----------------------------------------------------------------------------
   显示规则：
     有盘位在测/有结果的设备 → 显示（逐格彩色网格）
     完全空载的设备          → **默认隐藏**

   为什么隐藏空载：产线不会一直满测，空设备只是噪音。
   满配 12,737 盘位里若大部分是空位，全画出来反而看不出哪台在跑。
   需要时可在图例处勾选「显示空载设备」。

   刷新走增量补丁：维护 key → 元素索引，只改变化的格。
   ============================================================================ */

const ViewFloor = (() => {

  let _sections = {};          // stationKey → { bodyEl, index:Map }

  function folded() { return LocalStore.ui.get('folded', {}); }
  function setFolded(k, v) {
    const f = folded(); f[k] = v; LocalStore.ui.set('folded', f);
  }
  function showEmpty() { return !!LocalStore.ui.get('showEmptyEq', false); }
  function setShowEmpty(v) { LocalStore.ui.set('showEmptyEq', !!v); }

  /* 一台设备是否「有内容」：只要有一个盘位非空就算 */
  function hasContent(eq) {
    for (let i = 0; i < eq.capacity; i++) {
      const r = App.slots.get(eq.slotKeys[i]);
      if (r && r.state !== 'empty') return true;
    }
    return false;
  }

  /* 当前应显示哪些设备 */
  function visibleEquipments(stationKey, cfg) {
    const eqs = Topology.all(cfg).stationsMap[stationKey] || [];
    if (showEmpty()) return eqs;
    return eqs.filter(hasContent);
  }

  /* --------------------------------------------------------------------------
     渲染
     -------------------------------------------------------------------------- */
  function render() {
    const cfg = App.cfg;
    const filter = LocalStore.ui.get('stationFilter', '');
    const stations = filter
      ? Topology.effectiveStations(cfg).filter(s => s.key === filter)
      : Topology.effectiveStations(cfg);

    _sections = {};
    const html = stations.map(s => sectionHTML(s, cfg)).join('');
    Dom.html('floorBody', html || '<div class="empty-tip">无工站配置</div>');

    // 建索引供增量补丁：必须用「实际渲染出来的」设备列表，顺序才对得上
    stations.forEach(s => {
      const bodyEl = document.querySelector('#floorBody .sec-body[data-st="' + s.key + '"]');
      if (!bodyEl) return;
      const rendered = visibleEquipments(s.key, cfg);
      _sections[s.key] = { bodyEl, index: buildIndex(bodyEl, s.key, rendered) };
    });

    renderStrip();
    syncShowEmptyToggle();
  }

  /* 索引按「设备循环 × 盘位循环」对齐 querySelectorAll 的文档序。
     机柜布局下设备的文档序同样是按设备逐个发射的，故仍成立。 */
  function buildIndex(container, stationKey, equipmentList) {
    const index = new Map();
    if (!container) return index;
    const cells = container.querySelectorAll('.cell[data-k]');
    let i = 0;
    for (let e = 0; e < equipmentList.length; e++) {
      const eq = equipmentList[e];
      for (let s = 0; s < eq.capacity; s++) {
        const node = cells[i++];
        if (!node) break;
        index.set(eq.slotKeys[s], node);
      }
    }
    return index;
  }

  function renderStrip() {
    const cfg = App.cfg;
    const cur = LocalStore.ui.get('stationFilter', '');
    const topo = Topology.all(cfg);
    Dom.html('stationStrip', Topology.summary(cfg).map(s => {
      const eqs = topo.stationsMap[s.station] || [];
      const c = SlotGrid.countStates(eqs, App.slots);
      const active = eqs.filter(hasContent).length;
      return '<div class="schip' + (cur === s.station ? ' active' : '') +
          '" data-st="' + s.station + '" title="点击只看该工站">' +
        '<div class="nm"><i class="dot" style="background:' + s.color + '"></i>' + s.name + '</div>' +
        '<div class="mt">' + active + '/' + s.eqCount + ' ' + s.unit + '在跑 · ' +
          Util.num(c.used) + '/' + Util.num(c.cap) + ' 盘位</div>' +
        '<div class="bar"><i style="width:' + (c.util * 100).toFixed(1) +
          '%;background:' + s.color + '"></i></div>' +
      '</div>';
    }).join(''));
  }

  /* --------------------------------------------------------------------------
     单个工站分区
     -------------------------------------------------------------------------- */
  function sectionHTML(s, cfg) {
    const topo = Topology.all(cfg);
    const allEqs = topo.stationsMap[s.key] || [];
    if (!allEqs.length) return '';

    const visible = visibleEquipments(s.key, cfg);
    const hiddenCount = allEqs.length - visible.length;
    const c = SlotGrid.countStates(allEqs, App.slots);
    const ov = Capacity.overview(cfg).rows.filter(r => r.station === s.key)[0] || {};
    const isFolded = !!folded()[s.key];
    const cabCount = s.layout === 'cabinet' ? Topology.cabinetCount(cfg, s.key) : 0;
    const activeEq = allEqs.length - hiddenCount;
    const pending = App.pendingBadKeys();

    let body;
    if (!visible.length) {
      body = '<div class="empty-tip">该工站当前无在跑设备' +
        (hiddenCount ? '（' + hiddenCount + ' 台空载已隐藏）' : '') + '</div>';
    } else if (s.layout === 'flat') {
      body = '<div class="eq-wrap">' + visible.map(eq =>
        SlotGrid.flatCardHTML(s.key, eq, App.slots,
          App.eqState(s.key, eq.id), { pending })).join('') + '</div>';
    } else {
      // 机柜布局：按机柜分组，柜内只保留有内容的服务器
      const allCabs = Topology.cabinets(cfg, s.key);
      const visIds = new Set(visible.map(e => e.id));
      const cabs = allCabs
        .map(cab => ({ cab, servers: cab.servers.filter(e => visIds.has(e.id)) }))
        .filter(x => x.servers.length);
      body = '<div class="cab-wrap">' + cabs.map(({ cab, servers }) => {
        const states = {};
        servers.forEach(eq => { states[eq.id] = App.eqState(s.key, eq.id); });
        return SlotGrid.cabinetHTML(s.key, { id: cab.id, servers, slotCount: servers.length * s.capacity },
          App.slots, states, { pending });
      }).join('') + '</div>';
    }

    const hiddenNote = hiddenCount
      ? '<div class="hint" style="margin:0 0 10px">' +
        '已隐藏 <b>' + hiddenCount + '</b> 台空载设备' +
        (showEmpty() ? '' : '（图例处可勾选显示）') + '</div>'
      : '';

    return '<div class="sec">' +
      '<div class="sec-head" data-toggle-sec="' + s.key + '">' +
        '<i class="bar-l" style="background:' + s.color + '"></i>' +
        '<div>' +
          '<div class="t">' + s.name +
            '<span class="sub">' + s.cn + ' · ' + s.full + '</span>' +
            (ov.isBottleneck ? '<span class="badge b-fault">瓶颈</span>' : '') +
          '</div>' +
          '<div class="sub">' + activeEq + '/' + s.eqCount + ' ' + s.unit + '在跑' +
            (cabCount ? ' · ' + cabCount + ' 机柜' : '') +
            ' · 单台 ' + s.capacity + ' 盘位 · 单轮 ' + Util.fmtCycle(s.cycleMin) +
            ' · 上料 ' + s.loads +
            (s.sampling ? ' · 抽检 ' + (s.sampling * 100) + '%' : '') +
          '</div>' +
        '</div>' +
        '<div class="kpis">' +
          '<span>占用 <b>' + Util.num(c.used) + '</b></span>' +
          '<span>空闲位 <b>' + Util.num(c.free) + '</b></span>' +
          '<span>在测 <b>' + Util.num(c.testing) + '</b></span>' +
          '<span class="c-pass">通过 <b>' + Util.num(c.pass) + '</b></span>' +
          '<span class="c-fail">失败 <b>' + Util.num(c.fail) + '</b></span>' +
          '<span>利用率 <b>' + (c.util * 100).toFixed(1) + '%</b></span>' +
        '</div>' +
        '<span class="fold-tag">' + (isFolded ? '展开' : '折叠') + '</span>' +
      '</div>' +
      '<div class="sec-body' + (isFolded ? ' hide' : '') + '" data-st="' + s.key + '">' +
        hiddenNote + body +
      '</div>' +
    '</div>';
  }

  /* --------------------------------------------------------------------------
     增量刷新
     -------------------------------------------------------------------------- */
  function refresh(changedKeys) {
    if (!changedKeys || !App.canPatch) { render(); return 0; }

    /* 变更可能让一台原来空载的设备变成有内容，或反过来。
       前者需要它出现（当前索引里没有），后者需要它消失（索引里有但应移除）。
       这两种情况无法靠 patch 处理，直接整站重渲染更稳；其余走 patch。 */
    let needFullRender = false;
    const touchedStations = new Set();
    changedKeys.forEach(k => {
      const p = Schema.parseSlotKey(k);
      if (p.station) touchedStations.add(p.station);

      const rec = App.slots.get(k);
      const nowHas = !!(rec && rec.state !== 'empty');
      const wasTracked = Object.keys(_sections).some(st =>
        _sections[st] && _sections[st].index.has(k));
      // 有 → 无（设备变空了）或 无 → 有（设备刚上料）都会改变可见集合
      if (nowHas !== wasTracked) needFullRender = true;
    });

    if (needFullRender) { render(); return 0; }

    const pending = App.pendingBadKeys();
    let n = 0;
    touchedStations.forEach(st => {
      const sec = _sections[st];
      if (sec && sec.index.size) n += SlotGrid.patch(sec.index, changedKeys, App.slots, pending);
    });
    if (!n && changedKeys.size) { render(); return 0; }
    renderStrip();
    return n;
  }

  function syncShowEmptyToggle() {
    const cb = document.getElementById('chkShowEmpty');
    if (cb) cb.checked = showEmpty();
  }

  /* --------------------------------------------------------------------------
     交互
     -------------------------------------------------------------------------- */
  function bind() {
    Dom.delegate('stationStrip', 'click', '.schip', (e, el) => {
      const k = el.dataset.st;
      const cur = LocalStore.ui.get('stationFilter', '');
      LocalStore.ui.set('stationFilter', cur === k ? '' : k);
      render();
    });

    Dom.delegate('floorBody', 'click', '[data-toggle-sec]', (e, el) => {
      if (e.target.closest('.cell')) return;
      const k = el.dataset.toggleSec;
      setFolded(k, !folded()[k]);
      render();
    });

    Dom.delegate('floorBody', 'click', '.cell[data-k]', (e, el) => {
      const rec = App.slots.get(el.dataset.k);
      if (!rec || !rec.sn) return;
      App.openSlotDetail(el.dataset.k);
    });

    const btnFold = document.getElementById('btnFoldAll');
    if (btnFold) {
      btnFold.onclick = () => {
        const f = folded();
        const anyOpen = Topology.effectiveStations(App.cfg).some(s => !f[s.key]);
        Topology.effectiveStations(App.cfg).forEach(s => { f[s.key] = anyOpen; });
        LocalStore.ui.set('folded', f);
        render();
      };
    }

    const chk = document.getElementById('chkShowEmpty');
    if (chk) {
      chk.onchange = () => { setShowEmpty(chk.checked); render(); };
    }
  }

  /* 无渲染后置操作（保持与主控的接口一致） */
  function afterRender() { return 0; }

  return { render, refresh, bind, renderStrip, afterRender, hasContent, visibleEquipments };
})();


/* ==========================================================================
   src/views/board.js
   ========================================================================== */
/* ============================================================================
   智慧现场看板 —— 面向班组的一屏总览
   ----------------------------------------------------------------------------
   与平面图的分工：平面图看「位置」，看板看「今天状况」。
   盘位用 canvas 画（12,737 格不产生任何 DOM），可整屏呈现。
   ============================================================================ */

const ViewBoard = (() => {

  async function render() {
    await App.ensureRecords('records');
    const cfg = App.cfg;
    const topo = Topology.all(cfg);
    const today = Util.todayKey();
    const recs = App.records || [];
    const todayRecs = recs.filter(r => r.day === today);
    const tp = todayRecs.filter(r => String(r.result).toUpperCase() === 'PASS').length;
    const tf = todayRecs.filter(r => String(r.result).toUpperCase() === 'FAIL').length;
    const ta = todayRecs.filter(r => String(r.result).toUpperCase() === 'ABORT').length;
    const y = Capacity.yieldOf({ pass: tp, fail: tf, abort: ta });

    /* 全线统计 */
    let used = 0, testing = 0, total = 0;
    const perStation = [];
    Topology.summary(cfg).forEach(s => {
      const eqs = topo.stationsMap[s.station] || [];
      const c = SlotGrid.countStates(eqs, App.slots);
      used += c.used; testing += c.testing; total += c.cap;
      perStation.push({ s, c });
    });

    /* 故障设备 */
    const faultEqs = [];
    topo.equipment.forEach(eq => {
      const st = App.eqState(eq.station, eq.id);
      if (st === 'fault' || st === 'maint') {
        faultEqs.push({ eq, st });
      }
    });

    /* 待办 */
    const pendingBad = (App.bad || []).filter(b => !b.confirmed).length;
    const openErr = (App.error || []).filter(e => !e.handled).length;
    const runningWo = (App.workOrders || []).filter(w => w.status === 'running').length;

    Dom.html('boardBody',
      '<div class="toolbar">' +
        '<span class="title">智慧现场看板</span>' +
        '<span style="font-size:11.5px;color:var(--tx-3)">' + Util.nowStr() + '</span>' +
        '<span class="spacer" style="flex:1"></span>' +
        '<button class="btn sm" id="boardGotoFloor">去平面图</button>' +
      '</div>' +

      '<div class="kpi-wall">' +
        kpi('全线在制', Util.num(used),
            '容量 ' + Util.num(total) + ' · 利用率 ' + (total ? (used / total * 100).toFixed(1) : 0) + '%') +
        kpi('测试中', Util.num(testing), '正在跑的盘位', 'var(--info)') +
        kpi('今日通过', Util.num(tp), 'FAIL ' + Util.num(tf), 'var(--ok)') +
        kpi('今日良率', y.pct == null ? '--' : (y.pct * 100).toFixed(2) + '%',
            y.formula, y.pct != null && y.pct >= 0.95 ? 'var(--ok)' : 'var(--warn)') +
        kpi('异常终止', Util.num(ta), '数据不完整，不计入良率', 'var(--abort)') +
        kpi('待确认不良', Util.num(pendingBad), '需人工判定', pendingBad ? 'var(--warn)' : 'var(--tx)') +
        kpi('待处理报错', Util.num(openErr), '设备侧异常', openErr ? 'var(--bad)' : 'var(--tx)') +
        kpi('在产工单', Util.num(runningWo), '生产中', 'var(--info)') +
      '</div>' +

      '<div class="section-title">各工站负载</div>' +
      Charts.barH(perStation.map(x => ({
        label: x.s.name, value: Math.round(x.c.util * 100), color: x.s.color,
        tag: x.s.isBottleneck ? ' <span class="badge b-fault">瓶颈</span>' : ''
      })), {
        fmt: v => v + '%',
        note: perStation.map(x => x.s.name + ' ' + Util.num(x.c.used) + '/' + Util.num(x.c.cap)).join(' · ')
      }) +

      '<div class="section-title">全线热力图' +
        '<span class="note-inline">按需绘制 —— 12,737 格，不产生 DOM</span></div>' +
      '<div class="bar-chart">' +
        '<div class="toolbar" style="margin-bottom:11px">' +
          '<button class="btn sm" id="boardHeatToggle">绘制热力图</button>' +
          '<span class="hint" style="margin:0">' +
            '每格一个盘位，按工站顺序排列。用于判断整线负载是否均匀 —— ' +
            '大片连续的「在测」说明该工站满载。默认不绘制，避免无谓开销。' +
          '</span>' +
        '</div>' +
        '<div id="boardHeat" style="overflow-x:auto"></div>' +
      '</div>' +

      '<div class="section-title">设备异常（故障 / 维护中）</div>' +
      (faultEqs.length
        ? '<div class="cab-wall">' + faultEqs.slice(0, 60).map(x =>
            '<div class="cab-mini" data-goto-eq="' + Util.esc(x.eq.station + '|' + x.eq.id) + '">' +
              '<div class="nm">' +
                '<span class="badge ' + (x.st === 'fault' ? 'b-fault' : 'b-maint') + '">' +
                  L.eqState(x.st) + '</span>' + Util.esc(x.eq.id) + '</div>' +
              '<div class="sub">' + Util.esc(x.eq.station) +
                (x.eq.cabinetId ? ' · ' + Util.esc(x.eq.cabinetId) : '') + '</div>' +
            '</div>').join('') + '</div>' +
          (faultEqs.length > 60 ? '<div class="hint">仅显示前 60 台，共 ' + faultEqs.length + ' 台</div>' : '')
        : '<div class="empty-tip">所有设备状态正常</div>') +

      '<div class="section-title">报错类型 TOP</div>' +
      errTop(App.error || []) +

      '<div class="section-title">近 7 日报错趋势</div>' +
      Charts.line(last7(App.error || []), { color: 'var(--warn)' }) +

      '<div class="section-title">现场建议</div>' +
      (Capacity.advice(cfg).map(a =>
        '<div class="suggest-card ' + (a.level === 'warn' ? 'warn' : '') + '">' +
        a.text.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>') + '</div>').join('') ||
        '<div class="empty-tip">暂无建议</div>')
    );

  }

  /* 热力图改为按需绘制：默认不画，点按钮才画 */
  let _heatDrawn = false;

  function kpi(label, value, sub, color) {
    return '<div class="card"><div class="lbl">' + Util.esc(label) + '</div>' +
      '<div class="val" style="color:' + (color || 'var(--tx)') + '">' + value + '</div>' +
      (sub ? '<div class="sub">' + Util.esc(sub) + '</div>' : '') + '</div>';
  }

  function errTop(list) {
    if (!list.length) return '<div class="empty-tip">暂无报错</div>';
    const by = {};
    list.forEach(e => { by[e.type || '未分类'] = (by[e.type || '未分类'] || 0) + (e.count || 1); });
    return DataTable.build([
      { key: 'type', label: '报错类型' },
      { key: 'count', label: '累计次数', cls: 'num' },
      { key: 'bar', label: '占比', html: (v, r) =>
        DataTable.miniBar(r.count / (by[Object.keys(by)[0]] || 1), 'var(--bad)') }
